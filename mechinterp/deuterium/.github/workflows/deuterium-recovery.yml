name: Deuterium recovery and retrospective

on:
  push:
    branches: ['research/deuterium-recovered-followup-20261119']
    paths:
      - 'experiments/deuterium/**'
      - 'papers/VPD_TRM_Feature_Steering/**'
      - '.github/workflows/deuterium-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
      - name: Verify archive integrity and historical scoring semantics
        run: python -m unittest experiments.deuterium.tests.test_artifacts experiments.deuterium.tests.test_records -v
      - name: Record runner
        run: python -m experiments.deuterium.runtime_manifest --output "$RUNNER_TEMP/deuterium-results/runtime.json"
      - name: Download, verify and inventory original bytes
        run: >-
          python -m experiments.deuterium.artifacts
          --archive "$RUNNER_TEMP/deuterium-recovery.zip"
          --extract "$RUNNER_TEMP/deuterium-recovery"
          --manifest "$RUNNER_TEMP/deuterium-results/archive_manifest.json"
      - name: Check deterministic inventory against committed record
        run: cmp experiments/deuterium/results/archive_manifest.json "$RUNNER_TEMP/deuterium-results/archive_manifest.json"
      - name: Reconcile historical records
        run: >-
          python -m experiments.deuterium.records
          --records-root "$RUNNER_TEMP/deuterium-recovery"
          --out-dir "$RUNNER_TEMP/deuterium-results/retrospective"
      - name: Check deterministic audit against committed record
        run: diff -ru experiments/deuterium/results/retrospective "$RUNNER_TEMP/deuterium-results/retrospective"
      - name: Install pinned paper renderer
        run: python -m pip install -r experiments/deuterium/requirements-paper.txt
      - name: Regenerate supported paper tables and figures
        run: >-
          python -m experiments.deuterium.render_paper
          --followup experiments/deuterium/results/followup/paper_summary.json
      - name: Verify regenerated scientific text and tables
        run: >-
          git diff --exit-code --
          papers/VPD_TRM_Feature_Steering/vpd_trm_feature_steering_paper.md
          papers/VPD_TRM_Feature_Steering/tables
      - name: Preserve analysis receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deuterium-recovery-${{ github.sha }}
          path: |
            ${{ runner.temp }}/deuterium-results/
            papers/VPD_TRM_Feature_Steering/
          if-no-files-found: error
          retention-days: 90
