name: Deuterium frozen steering follow-up

on:
  push:
    branches: ['research/deuterium-recovered-followup-20261119']
    paths:
      - 'experiments/deuterium/steering.py'
      - 'experiments/deuterium/protocol.json'
      - 'experiments/deuterium/requirements-steering.txt'
      - '.github/workflows/deuterium-followup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      WANDB_MODE: disabled
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
      - name: Install pinned CPU environment
        run: |
          python -m pip install setuptools==84.2.1
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r experiments/deuterium/requirements-steering.txt
          python -m pip check
      - name: Test protocol boundaries and intervention mechanics
        run: python -m unittest discover -s experiments/deuterium/tests -p 'test_*.py' -v
      - name: Record hardware, software and source
        run: |
          python -m experiments.deuterium.runtime_manifest --output "$RUNNER_TEMP/deuterium-followup/runtime.json"
          python -m pip freeze > "$RUNNER_TEMP/deuterium-followup/pip-freeze.txt"
      - name: Fetch and authenticate original records
        run: >-
          python -m experiments.deuterium.artifacts
          --archive "$RUNNER_TEMP/deuterium-recovery.zip"
          --extract "$RUNNER_TEMP/deuterium-recovery"
          --manifest "$RUNNER_TEMP/deuterium-followup/archive_manifest.json"
      - name: Audit recovered checkpoint prerequisites
        run: >-
          python -m experiments.deuterium.steering preflight
          --records "$RUNNER_TEMP/deuterium-recovery"
          --out "$RUNNER_TEMP/deuterium-followup/recovered"
      - name: Select the recorded protocol freeze
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          r = json.loads(Path('experiments/deuterium/registration.json').read_text())
          sha = r['registration_commit']
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise ValueError('Invalid registration commit')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('DEUTERIUM_REGISTRATION_COMMIT=' + sha + '\n')
          PY
      - name: Execute frozen synthetic recurrent-gate comparison
        run: >-
          python -m experiments.deuterium.steering toy --phase score
          --registration-commit "$DEUTERIUM_REGISTRATION_COMMIT"
          --out "$RUNNER_TEMP/deuterium-followup/scored"
      - name: Independently verify saved scores and edit tensors
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'deuterium-followup'
          result = json.loads((root / 'scored/steering_summary.json').read_text())
          if result['comparison_completed']:
              subprocess.run([sys.executable, '-m', 'experiments.deuterium.verify_followup',
                  '--results', str(root / 'scored'), '--out', str(root / 'verification.json')], check=True)
          else:
              print('Comparison incomplete; retained prerequisite receipts define the scientific status.')
          PY
      - name: Build scientific result ledger
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/deuterium-followup/scored/steering_summary.json" ]; then
            python -m experiments.deuterium.summarize_followup \
              --recovered "$RUNNER_TEMP/deuterium-followup/recovered/recovered_preflight.json" \
              --scored "$RUNNER_TEMP/deuterium-followup/scored/steering_summary.json" \
              --out "$RUNNER_TEMP/deuterium-followup/paper_summary.json"
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP']) / 'deuterium-followup/scored/steering_summary.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Scientific execution status\n\n')
              if source.exists():
                  r = json.loads(source.read_text())
                  out.write(f"Verdict: **{r['status']}**. Comparison completed: **{r['comparison_completed']}**.\n\n")
                  out.write(f"Protocol commit: `{r['registration']['registration_commit']}`\n\n")
                  out.write('The recovered model has a separate prerequisite receipt. The synthetic task cannot establish its historical claims.\n')
              else:
                  out.write('No scored comparison receipt was produced. Inspect failed steps and preserved diagnostics.\n')
          PY
      - name: Preserve all outputs including failed prerequisites
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deuterium-followup-${{ github.sha }}
          path: ${{ runner.temp }}/deuterium-followup/
          if-no-files-found: error
          retention-days: 90
