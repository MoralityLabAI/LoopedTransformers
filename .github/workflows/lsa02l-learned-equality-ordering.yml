name: LSA-02L learned equality-search ordering
on:
  pull_request:
    paths:
      - 'research/lean_cgrt_hrm400/ppt_gym/equality_ordering.py'
      - 'research/lean_cgrt_hrm400/ppt_gym/tests/test_equality_ordering.py'
      - 'docs/lsa02l_learned_equality_ordering_protocol.md'
      - '.github/workflows/lsa02l-learned-equality-ordering.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch
        run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Test public bounds and recurrent ordering
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m compileall -q ppt_gym/equality_ordering.py
          python -m unittest ppt_gym.tests.test_equality_preflight ppt_gym.tests.test_equality_ordering -v
      - name: Freeze original suite and prospective fresh development roster
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m ppt_gym.equality_suite --out runs/lsa02l-original-suite
          python -m ppt_gym.equality_ordering freeze-dev --suite runs/lsa02l-original-suite --out runs/lsa02l-dev
      - name: Regenerate and certify native train-only source
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m ppt_gym.equality_preflight train --suite runs/lsa02l-original-suite --out runs/lsa02l-teacher
      - name: Fit duplicates, measure capped ordering, independently certify all closures
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m ppt_gym.equality_ordering run --suite runs/lsa02l-original-suite --teacher runs/lsa02l-teacher --dev runs/lsa02l-dev --out runs/lsa02l-result
          python - <<'PY'
          import json
          m=json.load(open('runs/lsa02l-result/manifest.json'))
          assert m['roots']==32 and m['training_frames']==546
          assert m['backend']['actual_lean_process'] and not m['sealed_contents_parsed']
          assert not m['scientific_eligible'] and not m['architecture_promotion_eligible']
          assert m['summary']['exact_ceiling']['100000']['certified']==32
          print('LSA02L_GATE',m['gate'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsa02l-native-equality-ordering
          path: |
            research/lean_cgrt_hrm400/runs/lsa02l-dev/
            research/lean_cgrt_hrm400/runs/lsa02l-teacher/
            research/lean_cgrt_hrm400/runs/lsa02l-result/
          retention-days: 14
          if-no-files-found: warn
