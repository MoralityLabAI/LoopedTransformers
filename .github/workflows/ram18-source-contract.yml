name: RAM-18 predata source-only contracts
on:
  push:
    paths:
      - 'experiments/lean_ram18/**'
      - '.github/workflows/ram18-source-contract.yml'
  pull_request:
    paths:
      - 'experiments/lean_ram18/**'
      - '.github/workflows/ram18-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test registered source and quantified-Nat generator with no TRAIN or TEST compiler access
        run: |
          python -m pip install --disable-pip-version-check psutil==7.1.3
          python -m unittest discover -s experiments/lean_ram18 -p 'test_*.py' -v
          python -m compileall -q experiments/lean_ram18
