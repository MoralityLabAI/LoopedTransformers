name: LRM-REV-02 engineering source and receipt checks
on:
  pull_request:
    paths:
      - 'mechinterp/revision_memory_gym/**'
      - '.github/workflows/lrm-rev02-engineering.yml'
  push:
    paths:
      - 'mechinterp/revision_memory_gym/**'
      - '.github/workflows/lrm-rev02-engineering.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 psutil==7.2.2
      - name: Test fixture, runner and independent receipt audit
        run: python -m unittest discover -s mechinterp/revision_memory_gym -p 'test_lrm_rev02_*.py' -v
      - name: Audit a published engineering receipt when present
        run: |
          if [ -f mechinterp/revision_memory_gym/results/lrm_rev02_v1/summary.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          import re
          import subprocess
          path = Path('mechinterp/revision_memory_gym/results/lrm_rev02_v1/source_manifest.json')
          sha = json.loads(path.read_text())['source_commit']
          if not isinstance(sha, str) or re.fullmatch(r'[0-9a-f]{40}', sha) is None:
              raise SystemExit('Invalid frozen source commit')
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', sha], check=True)
          PY
            python mechinterp/revision_memory_gym/audit_lrm_rev02.py mechinterp/revision_memory_gym/results/lrm_rev02_v1 --repo-root .
            python mechinterp/revision_memory_gym/replay_lrm_rev02.py --out mechinterp/revision_memory_gym/results/lrm_rev02_v1
          fi
