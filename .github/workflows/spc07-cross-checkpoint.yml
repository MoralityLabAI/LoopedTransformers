name: SPC-07 frozen cross-checkpoint observability controls
on:
  push:
    paths:
      - 'experiments/spectral_state_cost_v0/spc07_transfer.py'
      - 'experiments/spectral_state_cost_v0/SPC-07.md'
      - 'experiments/spectral_state_cost_v0/receipts/spc07_summary.json'
      - 'tests/test_spc07_transfer.py'
      - '.github/workflows/spc07-cross-checkpoint.yml'
  pull_request:
    paths:
      - 'experiments/spectral_state_cost_v0/spc07_transfer.py'
      - 'experiments/spectral_state_cost_v0/SPC-07.md'
      - 'experiments/spectral_state_cost_v0/receipts/spc07_summary.json'
      - 'tests/test_spc07_transfer.py'
      - '.github/workflows/spc07-cross-checkpoint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-checkpoint-unit-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU numerical dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate geometry, analytic Jacobians, and frozen numeric summary
        run: python -m unittest discover -s tests -p 'test_spc07_transfer.py' -v
      - name: Declare checkpoint gating
        run: echo 'The two frozen SPC-04 trained checkpoint binaries are distributed in the SPC-07 reproducibility archive; checkpoint-dependent tests require SPC04_CHECKPOINT_DIR and are skipped in repository-only CI.'
