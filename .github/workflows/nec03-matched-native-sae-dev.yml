name: NEC-03D source-only SAE matched-dose CPU pilot

on:
  push:
    branches: ['research/nec03-matched-native-sae-dev-20261121']
    paths:
      - '.github/workflows/nec03-matched-native-sae-dev.yml'
      - 'mechinterp/neuron_communities/source_sae.py'
      - 'mechinterp/neuron_communities/matched_dose.py'
      - 'mechinterp/neuron_communities/nec03_development.py'
      - 'mechinterp/neuron_communities/audit_nec03.py'
      - 'mechinterp/neuron_communities/test_nec03_development.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nec03d-seed103-20261121
  cancel-in-progress: true

jobs:
  cpu-sae-native-matched:
    name: Seed-103 coalition and threshold on frozen trained models
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      DNNL_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU stack
        run: |
          python -m pip install pytest==8.4.2 networkx==3.4.2 numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Reuse six-source model and source-only community archive
        uses: actions/download-artifact@v4
        with:
          name: nec02b-six-model-raw-causal-and-crossseed-receipts
          run-id: 44790504320
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: MoralityLabAI/LoopedTransformers
          path: /tmp/nec03
      - name: Verify original six-checkpoint and all-community receipts
        run: |
          python -m mechinterp.neuron_communities.audit_crossseed --root /tmp/nec03
      - name: Source-only SAE and local-dose tests
        run: |
          python -m pytest -q mechinterp/neuron_communities/test_nec03_development.py
      - name: Fit SAE and select source-ranked features on BOTH frozen tasks
        timeout-minutes: 10
        run: |
          for task in coalition threshold; do
            python -m mechinterp.neuron_communities.nec03_development prepare \
              --root /tmp/nec03 --out "/tmp/nec03/nec03d/seed103_$task" \
              --seed 103 --task "$task"
          done
      - name: Check both source-only SAE rosters frozen before heldout replay
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          for task in ('coalition','threshold'):
              folder=Path('/tmp/nec03/nec03d')/f'seed103_{task}'
              raw=(folder/'prepare.json').read_bytes()
              assert hashlib.sha256(raw).hexdigest()==(folder/'prepare.sha256').read_text().strip()
              obj=json.loads(raw)
              assert obj['source_contexts']=={'fit':80,'selection':80,'heldout':0}
              assert obj['inference_gate']=='REDESIGN_OR_PILOT_ONLY'
              assert obj['source_sha256']=='de4e0263864ee70c2bf94ca95008ace10fce1323d1a51b4c8829ec26e40bbd9b'
              assert obj['sae']['n_holdout_contexts_seen_by_fit']==0
              print('NEC03D_SOURCE_FROZEN', task, obj['selected_candidate_count'])
          PY
      - name: Retrospective frozen matched-dose causal replay
        timeout-minutes: 10
        run: |
          for task in coalition threshold; do
            python -m mechinterp.neuron_communities.nec03_development evaluate \
              --root /tmp/nec03 --out "/tmp/nec03/nec03d/seed103_$task" \
              --seed 103 --task "$task"
          done
      - name: Recompute 16-state labels, outcomes and physical doses independently
        run: |
          python -m mechinterp.neuron_communities.audit_nec03 \
            --root /tmp/nec03 --seed 103 --tasks coalition threshold
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/nec03/nec03d_audit.json')
          result=json.loads(p.read_text())
          assert result['all_raw_cases_and_local_doses_verified']
          assert len(result['arms'])==2
          assert result['FSI_01_gate']=='REDESIGN_OR_PILOT_ONLY'
          assert result['total_candidate_context_rows']==48*result['total_communities']
          print('NEC03D_PAIRED_SOURCE_DOSE_AUDIT',result['total_communities'])
          PY
      - name: Upload source-locked SAE and full raw matched-dose traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nec03d-source-sae-matched-dose-pilot
          path: |
            /tmp/nec03/nec03d/
            /tmp/nec03/nec03d_audit.json
          retention-days: 30
          if-no-files-found: warn
