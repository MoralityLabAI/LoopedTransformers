name: LRF-03 native tactic adapter
on:
  push:
    branches:
      - research/refutationbench-native-tactics-lrf03-20261124
    paths:
      - 'experiments/lean_review_feedback/lrf03/**'
      - '.github/workflows/lrf03-native-tactics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lrf03-native-tactic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-tactics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: patrickdugan/MathCan
          ref: f0873083c5a6b0e424d0872db058b8edb8f56f5d
          path: mathcan-dev
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o /tmp/lean435.tar.zst
          tar --zstd -xf /tmp/lean435.tar.zst -C /tmp
          echo "/tmp/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        working-directory: experiments/lean_review_feedback/lrf03
        run: python -m unittest -v test_adapter
      - name: Build only the pinned original imports
        working-directory: mathcan-dev
        run: lake build MathCan.ObservableQuotient MathCan.AuthorizationQuotient
      - name: Native review of bounded tactic proposals
        run: python -u experiments/lean_review_feedback/lrf03/adapter.py --mathcan mathcan-dev --out /tmp/lrf03
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lrf03-native-tactic-receipts
          path: /tmp/lrf03
          retention-days: 30
