name: LBF-20G relation composition
on:
  pull_request:
    paths:
      - "research/lite_braille_fresco/lbf20g_relation.py"
      - "research/lite_braille_fresco/lean/LBF20Relation.lean"
      - "research/lite_braille_fresco/LBF_20G_REGISTRATION.md"
      - ".github/workflows/lbf20g-relation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false
      - name: Verify balanced route lemmas
        run: |
          mkdir -p "$RUNNER_TEMP/lbf20g-theory"
          lean_bin="$HOME/.elan/toolchains/leanprover--lean4---v4.19.0/bin/lean"
          "$lean_bin" --threads=1 research/lite_braille_fresco/lean/LBF20Relation.lean > "$RUNNER_TEMP/lbf20g-theory/theory.log" 2>&1 || { cat "$RUNNER_TEMP/lbf20g-theory/theory.log"; exit 1; }
          cat "$RUNNER_TEMP/lbf20g-theory/theory.log"
          test "$(grep -c 'does not depend on any axioms' "$RUNNER_TEMP/lbf20g-theory/theory.log")" -eq 6
      - name: Exact propagation audit and CPU relation-cell fits
        run: |
          python research/lite_braille_fresco/lbf20g_relation.py --out "$RUNNER_TEMP/lbf20g"
          python - <<'PY'
          import os,json
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"lbf20g"
          s=json.loads((d/"summary.json").read_text())
          assert len(s["fits"])==12 and len(s["audit"]["rings"])==28 and s["audit"]["false_negatives"]==0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbf20g-relation-receipts
          path: |
            ${{ runner.temp }}/lbf20g/
            ${{ runner.temp }}/lbf20g-theory/
          if-no-files-found: warn
