name: NEC-03N diagnostic for failed source step900 ancestry

on:
  push:
    branches: ['research/nec03n-fix1800-source-learning-20261121']
    paths:
      - '.github/workflows/nec03n-diagnose-midpoint.yml'
      - 'mechinterp/neuron_communities/nec03n_midpoint_diagnostic.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  DNNL_MAX_CPU_ISA: AVX2
  PYTHONHASHSEED: '0'

jobs:
  diagnose-failed-original-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        index: [2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exactly original native CPU stack
        run: |
          python -m pip install networkx==3.4.2 numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore immutable NEC-03M root artifact from original successful run
        uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44894980345
          name: nec03m-source-world-${{ matrix.index }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec03n/old
      - name: Recreate original source900 only and record loss/weights mismatch without new 1800 training
        run: |
          python -m mechinterp.neuron_communities.nec03n_midpoint_diagnostic \
            --index ${{ matrix.index }} \
            --old-root /tmp/nec03n/old \
            --out /tmp/nec03n/diagnostic
      - name: Verify diagnostics stayed on original source-training split
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/nec03n/diagnostic/milestone_diagnostic.json').read_text())
          assert r['source_only']
          assert r['native_model_source_steps']==900
          assert r['development_evaluation_contexts_scored']==0
          assert r['reserved_contexts_scored']==0
          assert r['four_input_confirmation_worlds_scored']==0
          assert r['new_1800_checkpoint_created'] is False
          print('NEC03N_MIDPOINT_DIAGNOSTIC_SOURCE_ONLY',r['world_id'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nec03n-original-step900-mismatch-diagnostic-${{ matrix.index }}
          path: /tmp/nec03n/diagnostic/
          retention-days: 60
          if-no-files-found: error
