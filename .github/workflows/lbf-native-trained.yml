name: LBF-04 native-trained PPT competence and fresco pilot

on:
  pull_request:
    paths:
      - "research/lite_braille_fresco/**"
      - ".github/workflows/lbf-native-trained.yml"
  push:
    branches:
      - "research/lbf-gym-v0-20261123"
    paths:
      - "research/lite_braille_fresco/**"
      - ".github/workflows/lbf-native-trained.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trained-ppt-fresco:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu

      - name: Source-verified Lean teacher and frozen PPT-B training
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m ppt_gym.live_cli freeze \
            --out runs/lbf04-suite --seed 20261123 --per-split 24
          python -m ppt_gym.native_train collect \
            --suite runs/lbf04-suite --out runs/lbf04-teacher \
            --roots 24 --request-timeout 60 --max-seconds 420 --cert-timeout 240
          python -m ppt_gym.native_train fit \
            --teacher runs/lbf04-teacher --out runs/lbf04-fit \
            --middle-order ab --seed 103 --steps 240 --depth 2 --width 32 \
            --max-bytes 384 --learning-rate 0.001 --threads 2 --max-seconds 240
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path("runs/lbf04-teacher/manifest.json").read_text())
          f=json.loads(Path("runs/lbf04-fit/manifest.json").read_text())
          assert t["backend"]["actual_lean_process"] and t["source_compiler_passed"]
          assert t["independent_lineages"]==24 and t["reference_proofs_compiled"]==24
          assert t["query_roots_exposed_to_fit"]==0 and not t["locked_test_opened"]
          assert f["training_source_native"] and f["optimizer_steps"]==240
          assert f["optimizer_calls_on_calibration_or_test"]==0
          assert f["train_order"]=="ab" and f["seed"]==103
          print("LBF04_TEACHER",t["train_examples"],t["reference_proofs_compiled"],
                "checkpoint",f["checkpoint_sha256"])
          PY
      - name: Native calibration and model-free proof replay
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m ppt_gym.native_order run \
            --suite runs/lbf04-suite --checkpoint runs/lbf04-fit/checkpoint.pt \
            --native-teacher runs/lbf04-teacher/manifest.json \
            --split calibration --roots 8 --checks 8 --depth 2 \
            --max-seconds 360 --cert-timeout 240 --out runs/lbf04-calibration
          python -m ppt_gym.native_order replay \
            --suite runs/lbf04-suite --session runs/lbf04-calibration \
            --out runs/lbf04-replay
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("runs/lbf04-calibration/manifest.json").read_text())
          r=json.loads(Path("runs/lbf04-replay/replay.json").read_text())
          assert m["status"]=="complete" and m["paired_roots"]==8
          assert m["backend"]["actual_lean_process"]
          assert m["training_provenance"]["training_source_verified"]
          assert m["training_provenance"]["source_lineages_disjoint"]
          assert m["training_provenance"]["training_lineages"]==24
          assert m["standalone_reference_certificates"]==8
          assert r["replay_passed"] and r["independent_replay_episodes"]==24
          assert m["query_label_training_updates"]==0
          assert m["scientific_eligible"] is False
          print("LBF04_NATIVE",m["scores"],"reference_budget_reachable",
                m["reference_reachable_within_budget"])
          PY
      - name: Frozen source-trained recurrence fresco and message intervention
        working-directory: research/lite_braille_fresco
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python ppt_bridge.py \
            --checkpoint ../lean_cgrt_hrm400/runs/lbf04-fit/checkpoint.pt \
            --episodes ../lean_cgrt_hrm400/runs/lbf04-calibration/paired_episodes.jsonl \
            --session-manifest ../lean_cgrt_hrm400/runs/lbf04-calibration/manifest.json \
            --replay-receipt ../lean_cgrt_hrm400/runs/lbf04-replay/replay.json \
            --max-episodes 4 --depth 3 --out runs/lbf04-observations
          python lbf_gym.py encode \
            --observations runs/lbf04-observations/observations.jsonl \
            --out runs/lbf04-encoded
          python lbf_gym.py render \
            --encoded runs/lbf04-encoded/encoded.jsonl \
            --out runs/lbf04-fresco.svg
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          from lbf_gym import file_sha, read_jsonl
          p=Path("runs/lbf04-observations")
          m=json.loads((p/"manifest.json").read_text())
          e=read_jsonl(Path("runs/lbf04-encoded/encoded.jsonl"))
          rows=read_jsonl(p/"message_probes.jsonl")
          ET.parse("runs/lbf04-fresco.svg")
          assert m["source_attestation"]["native_replay_verified"]
          assert m["n_episodes"]==4 and len(rows)>0
          assert len(rows)==m["message_probe_rows"]
          assert m["message_probe_sha256"]==file_sha(p/"message_probes.jsonl")
          assert all(x["lean_calls"]==0 for x in rows)
          assert all(x["max_abs_logit_delta"]<1e-5 for x in rows if x["pass"]==1)
          assert len(e)==4 and all(x["source"]["kind"]=="ppt_replay" for x in e)
          print("LBF04_MESSAGE",len(rows),"peak_delta",
                max(x["max_abs_logit_delta"] for x in rows),
                "selection_flips",sum(x["changed_top_candidate"] for x in rows))
          PY
      - name: Development-only competence disposition
        working-directory: research/lite_braille_fresco
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          session=json.loads(Path("../lean_cgrt_hrm400/runs/lbf04-calibration/manifest.json").read_text())
          fit=json.loads(Path("../lean_cgrt_hrm400/runs/lbf04-fit/manifest.json").read_text())
          rows=session["paired_roots"]
          order=fit["train_order"]
          rate=session["scores"][order]["standalone_verified_closures"]/rows
          # The existing LSA-02B competency gate also demands 32 eligible
          # lineages, plus an independent exact candidate-uniform baseline.
          disposition="BLOCKED_INCOMPETENT_CHECKPOINT"
          out={"schema":"lbf04.competence_disposition.v1",
               "stage":"development_calibration","checkpoint_sha256":session["checkpoint_sha256"],
               "training_source_native":True,"calibration_roots":rows,
               "trained_order":order,"trained_order_close_rate":rate,
               "minimum_required_independent_roots":32,
               "minimum_close_rate":0.40,
               "candidate_uniform_baseline_measured":False,
               "locked_test_opened":False,"disposition":disposition,
               "scientific_eligible":False}
          Path("runs/lbf04-disposition.json").write_text(json.dumps(out,sort_keys=True)+"\n")
          print("LBF04_COMPETENCE",out)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbf04-source-trained-ppt-fresco
          path: |
            research/lean_cgrt_hrm400/runs/lbf04-suite/manifest.json
            research/lean_cgrt_hrm400/runs/lbf04-teacher/manifest.json
            research/lean_cgrt_hrm400/runs/lbf04-teacher/train_census.jsonl
            research/lean_cgrt_hrm400/runs/lbf04-fit/checkpoint.pt
            research/lean_cgrt_hrm400/runs/lbf04-fit/manifest.json
            research/lean_cgrt_hrm400/runs/lbf04-calibration/
            research/lean_cgrt_hrm400/runs/lbf04-replay/replay.json
            research/lite_braille_fresco/runs/lbf04-observations/
            research/lite_braille_fresco/runs/lbf04-encoded/
            research/lite_braille_fresco/runs/lbf04-fresco.svg
            research/lite_braille_fresco/runs/lbf04-disposition.json
          retention-days: 14
          if-no-files-found: warn
