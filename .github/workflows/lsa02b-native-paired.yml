name: LSA-02B native paired Lean order smoke

on:
  pull_request:
    paths:
      - "research/lean_cgrt_hrm400/ppt_gym/native_order.py"
      - "research/lean_cgrt_hrm400/ppt_gym/tests/test_native_order.py"
      - "docs/lsa02b_native_lean_bridge.md"
      - ".github/workflows/lsa02b-native-paired.yml"
  push:
    branches:
      - "research/lsa02b-native-lean-paired-20261123"
    paths:
      - "research/lean_cgrt_hrm400/ppt_gym/native_order.py"
      - "research/lean_cgrt_hrm400/ppt_gym/tests/test_native_order.py"
      - ".github/workflows/lsa02b-native-paired.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch
        run: python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - name: FakeLean smoke is explicitly non-scientific
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m compileall -q ppt_gym/native_order.py ppt_gym/tests/test_native_order.py
          python -m unittest ppt_gym.tests.test_native_order -v

  real-lean-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "research/lean_cgrt_hrm400/lean"
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch
        run: python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Native Lean AB/BA paired proof run and independent replay
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m ppt_gym.live_cli freeze --out runs/lsa02b-native-suite --seed 20261123 --per-split 3
          python -m ppt_gym fixture --out runs/lsa02b-native-fixture --per-family 3 --seed 77
          python -m ppt_gym train --fixture runs/lsa02b-native-fixture --allow-synthetic --plan b \
            --width 16 --heads 4 --max-bytes 32 --steps 2 --depths 1 2 \
            --max-seconds 90 --out runs/lsa02b-native-checkpoint
          python -m ppt_gym.native_order run --suite runs/lsa02b-native-suite \
            --checkpoint runs/lsa02b-native-checkpoint/checkpoint.pt \
            --roots 2 --checks 8 --depth 1 --max-seconds 180 --cert-timeout 180 \
            --out runs/lsa02b-native-paired
          python -m ppt_gym.native_order replay --suite runs/lsa02b-native-suite \
            --session runs/lsa02b-native-paired --out runs/lsa02b-native-replay
          # Independent positive control: ensure the real Lean certifier actually
          # accepts a known source-generated Horn proof, even if both model
          # schedules fail to close the two sampled calibration roots.
          python - <<'PY'
          from lcgrt.fragment import generate
          from lcgrt.extract import explore
          from lcgrt.certify import certify, decl_name
          from lcgrt.lean_repl import LeanRepl
          theorem = generate(17, 2, "chain-dead", conj_p=0,
                             tid="lsa02b_native_certifier_positive")
          with LeanRepl(timeout=60) as lean:
              reference = explore(lean, theorem)
          proof = reference["proof"]["script"]
          receipt = certify([(theorem.tid, theorem, proof)], timeout=90)
          assert receipt["status"][decl_name(theorem.tid)] == "passed", receipt
          print("LSA-02B positive native standalone certificate", receipt["source_sha256"])
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("runs/lsa02b-native-paired")
          m=json.loads((root/"manifest.json").read_text())
          r=json.loads(Path("runs/lsa02b-native-replay/replay.json").read_text())
          assert m["status"]=="complete", m["status"]
          assert m["backend"]["actual_lean_process"], m["backend"]
          assert m["paired_roots"]==2 and m["split"]=="calibration", m
          assert m["independent_reference_proofs"]==2, m
          assert m["standalone_reference_certificates"]==2, m
          assert 0 <= m["reference_reachable_within_budget"] <= 2
          assert sum(x["standalone_verified_closures"] for x in m["scores"].values()) <= 6
          assert m["training_provenance"]["checkpoint_evidence_class"]=="synthetic_fixture"
          assert m["scientific_eligible"] is False and m["architecture_promotion_eligible"] is False
          assert m["query_label_training_updates"]==0
          assert r["replay_passed"] and r["independent_replay_episodes"]==6
          assert not r["model_used_in_replay"]
          print("Native Lean verified pair roots",m["paired_roots"],
                "reference certificates",m["standalone_reference_certificates"],
                "reference under budget",m["reference_reachable_within_budget"],
                "standalone",m["scores"],
                "report mode",m["status"],"replay",r["replay_passed"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsa02b-native-lean-smoke
          path: |
            research/lean_cgrt_hrm400/runs/lsa02b-native-suite/manifest.json
            research/lean_cgrt_hrm400/runs/lsa02b-native-paired/
            research/lean_cgrt_hrm400/runs/lsa02b-native-replay/
          if-no-files-found: warn
