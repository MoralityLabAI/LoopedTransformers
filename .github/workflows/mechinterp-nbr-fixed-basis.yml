name: NBR fixed basis reanalysis
on:
  pull_request:
    paths:
      - 'mechinterp/nbr_fixed_basis/**'
      - '.github/workflows/mechinterp-nbr-fixed-basis.yml'
permissions:
  contents: read
  actions: read
jobs:
  reanalysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m mechinterp.nbr_fixed_basis.control --self-test
      - uses: actions/download-artifact@v4
        with:
          name: nbr-gaoxin492-fp32
          run-id: 45515740820
          github-token: ${{ github.token }}
          path: original
      - run: |
          echo 'bcf9b3c47f5703d8e33222bbb66f34e057277476c44a555b896dc5325dd50a5b  original/nbr_roster.json' | sha256sum -c
          python -m mechinterp.nbr_fixed_basis.control --receipts original/nbr_native --out reanalysis/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbr-fixed-basis
          path: reanalysis/
          if-no-files-found: warn
