name: BPD Fable pre-run source regression checks
on:
  push:
    paths:
      - 'mechinterp/bpd/**'
      - '.github/workflows/bpd-fable-preflight.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/**'
      - '.github/workflows/bpd-fable-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-math-and-donor-contrast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and pytest
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test archived failure predicates and new contrast/multiplicity/math semantics
        run: |
          python -m pytest -q mechinterp/bpd/tests/test_bpd_fable_preflight.py
      - name: Verify source module syntax
        run: |
          python -m compileall -q mechinterp/bpd
