name: INK-FP-AUDIT-01 source tests
on:
  pull_request:
    paths:
      - 'research_gym/ink_fp_audit_01/**'
      - 'tests/test_ink_fp_audit.py'
      - '.github/workflows/ink-fp-audit-01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_ink_fp_audit.py -v
      - run: python -m compileall -q research_gym/ink_fp_audit_01
