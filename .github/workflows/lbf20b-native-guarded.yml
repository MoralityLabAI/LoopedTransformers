name: LBF-20B native guarded search
on:
  pull_request:
    paths:
      - "research/lite_braille_fresco/lbf20b_native_guarded.py"
      - "research/lite_braille_fresco/LBF_20B_REGISTRATION.md"
      - ".github/workflows/lbf20b-native-guarded.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - name: Native train-only guard receipts and paired development search
        run: |
          python research/lite_braille_fresco/lbf20b_native_guarded.py --out "$RUNNER_TEMP/lbf20b"
      - name: Independently compile every kernel-accepted proof
        run: |
          lean_bin="$HOME/.elan/toolchains/leanprover--lean4---v4.19.0/bin/lean"
          "$lean_bin" --threads=1 "$RUNNER_TEMP/lbf20b/Witnesses.lean" > "$RUNNER_TEMP/lbf20b/witnesses.log" 2>&1 || { cat "$RUNNER_TEMP/lbf20b/witnesses.log"; exit 1; }
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"lbf20b"
          s=json.loads((d/"summary.json").read_text())
          log=(d/"witnesses.log").read_text()
          entries=re.findall(r"'(lbf20b_[A-Za-z0-9_]+)' (does not depend on any axioms|depends on axioms: \[[^\]]*\])",log)
          assert len(entries)==s["native_kernel_certificates"] and len({n for n,_ in entries})==len(entries), (len(entries),s["native_kernel_certificates"])
          for name, line in entries:
              if "depends on axioms:" in line:
                  axioms=set(x.strip() for x in line.split("[",1)[1][:-1].split(","))
                  assert axioms<={"propext","Quot.sound","Classical.choice"},(name,axioms)
          assert s["episodes"]==126
          print("Standalone native certificates:",len(entries))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbf20b-native-guarded-receipts
          path: ${{ runner.temp }}/lbf20b
          if-no-files-found: warn
