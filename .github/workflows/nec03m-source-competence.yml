name: NEC-03M five-input native SAE source-only competence pilot

on:
  push:
    branches: ['research/nec03m-five-input-source-competence-20261121']
    paths:
      - '.github/workflows/nec03m-source-competence.yml'
      - 'mechinterp/neuron_communities/NEC03M_SOURCE_LOCK.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nec03m-original-source-five-input-first-four
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  DNNL_MAX_CPU_ISA: AVX2
  PYTHONHASHSEED: '0'

jobs:
  locked-five-input-source-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native CPU test environment
        run: |
          python -m pip install pytest==8.4.2 networkx==3.4.2 numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify exact source registry SHA, source-only five-input hook and confirmation refusal
        run: |
          python - <<'PY'
          from mechinterp.neuron_communities.nec03m_source_pilot import verify_m_lock
          from mechinterp.neuron_communities.nec03l_five_input_worlds import registration
          from mechinterp.neuron_communities.nec03g_worlds import registry
          l=verify_m_lock()
          r=registration()
          assert l['five_source_registry_sha256']==r['registry_sha256']
          assert l['old_confirmation_world_spec_sha256']==registry()['confirmation_full_spec_sha256']
          assert l['source_development_world_indices']==[0,1,2,3]
          assert l['heldout_development_worlds_scored']==0
          assert l['original_confirmation_worlds_scored']==0
          print('NEC03M_NEW_5BIT_SOURCE_AND_ORIGINAL_64_CONFIRMATION_LOCK_PASS')
          PY
          python -m pytest -q \
            mechinterp/neuron_communities/test_nec03l_five_input_worlds.py \
            mechinterp/neuron_communities/test_nec03m_source_pilot.py

  new-five-input-source-roots:
    needs: locked-five-input-source-unit-tests
    strategy:
      fail-fast: false
      matrix:
        index: [0,1,2,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact native/TopK16 SAE CPU training stack
        run: |
          python -m pip install networkx==3.4.2 numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Train two independently initialized native teacher heads 900 updates each, source SAE/angle only
        timeout-minutes: 28
        run: |
          python -m mechinterp.neuron_communities.nec03m_source_pilot \
            --development-world-index ${{ matrix.index }} --out /tmp/nec03m/root
      - name: Independently replay all 2560 source labels, checkpoint/SAE/40-group ranks and active direction candidates
        timeout-minutes: 8
        run: |
          python -m mechinterp.neuron_communities.nec03m_source_audit \
            --folder /tmp/nec03m/root
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/nec03m/root')
          p=json.loads((root/'source_pilot_receipt.json').read_text())
          a=json.loads((root/'independent_source_audit.json').read_text())
          assert p['source_results_only']
          assert p['development_evaluation_context_groups_scored']==0
          assert p['new_embargoed_worlds_scored']==0
          assert p['original_confirmation_worlds_scored']==0
          assert a['native_source_training_labels_and_all_2560_input_scores_replayed']
          assert a['source_SAE_reconstruction_and_40_group_attribution_rank_recomputed']
          print('NEC03M_FIVE_INPUT_SOURCE_MODEL_AUDITED',p['world_id'],
                [p['arms'][key]['native']['source_correct'] for key in ('composed','additive')])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nec03m-source-world-${{ matrix.index }}
          path: /tmp/nec03m/root/
          retention-days: 60
          if-no-files-found: warn

  four-root-source-only-aggregation:
    needs: new-five-input-source-roots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all four completed and independently source-audited root artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nec03m-source-world-*
          merge-multiple: false
          path: /tmp/nec03m/roots
      - name: Aggregate just four world-level in-sample competence and null coverage receipts
        run: |
          python -m mechinterp.neuron_communities.nec03m_source_aggregate \
            --root /tmp/nec03m/roots --out /tmp/nec03m/summary
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/nec03m/summary/nec03m_five_input_source_competence_audit.json')
          r=json.loads(p.read_text())
          assert r['native_teacher_models_trained_from_new_seeds']==8
          assert r['development_roots_registered']==4
          assert r['new_development_evaluation_contexts_scored']==0
          assert r['reserved_contexts_scored']==0
          assert r['five_input_embargoed_worlds_scored']==0
          assert r['original_four_input_confirmation_worlds_scored']==0
          assert r['FSI_01_gate']=='REDESIGN_OR_PILOT_ONLY'
          print('NEC03M_NEW_5INPUT_SOURCE_PILOT_SUMMARIZED',r['whole_worlds_source_ready'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nec03m-four-root-5-input-native-sae-source-feasibility
          path: /tmp/nec03m/summary/
          retention-days: 60
          if-no-files-found: warn
