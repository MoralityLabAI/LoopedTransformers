name: RAM-03 integrity tests
on:
  push:
    paths:
      - 'experiments/lean_ram03/**'
      - '.github/workflows/lean-ram03-tests.yml'
  pull_request:
    paths:
      - 'experiments/lean_ram03/**'
      - '.github/workflows/lean-ram03-tests.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/_source
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/Compactification-Theory
          ref: e8a780254b5cf41d479095f4f22bcfc4aa76ed72
          path: _source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install psutil==7.1.3
      - run: python -m unittest discover -s experiments/lean_ram03/tests -v
