name: ROC-05B frozen causal geometry and source preflight

on:
  push:
    paths:
      - 'configs/roc05b_matched_rule_causal_v1.json'
      - 'research_gym/analysis/roc05b_*.py'
      - 'tests/test_roc05b_*.py'
      - '.github/workflows/roc05b-source-audit.yml'
      - 'experiments/roc05_fresh_replication/ROC05B_CAUSAL_PROTOCOL.md'
  pull_request:
    paths:
      - 'configs/roc05b_matched_rule_causal_v1.json'
      - 'research_gym/analysis/roc05b_*.py'
      - 'tests/test_roc05b_*.py'
      - '.github/workflows/roc05b-source-audit.yml'
      - 'experiments/roc05_fresh_replication/ROC05B_CAUSAL_PROTOCOL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytic-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU PyTorch for frozen causal geometry checks
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check registration, source and tested midpoint/derivative geometry
        run: |
          python -m compileall -q research_gym/analysis/roc05b_*.py
          python -m unittest discover -s tests -p 'test_roc05b_*.py' -v
          python - <<'PY'
          import json
          c=json.load(open('configs/roc05b_matched_rule_causal_v1.json'))
          assert len(c['parent']['frozen_1920step_checkpoint_sha256'])==6
          assert all(len(z)==2 and all(len(s)==64 for s in z.values())
                     for z in c['parent']['frozen_1920step_checkpoint_sha256'].values())
          assert c['primary']['radius']==.2
          assert c['observations']['rank']==7
          assert c['data']['roc05_reserved_pool'].startswith('384')
          print('All twelve original first-run checkpoint hashes pinned; reserved inputs ungenerated')
          PY
