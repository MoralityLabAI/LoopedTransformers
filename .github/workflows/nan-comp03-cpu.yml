name: NAN-COMP-03 CPU competence and independent receipt audit
on:
  push:
    branches: [research/nan-comp03-bounded-reciprocal]
    paths: ['experiments/nan_comp03/**', '.github/workflows/nan-comp03-cpu.yml']
  pull_request:
    paths: ['experiments/nan_comp03/**', '.github/workflows/nan-comp03-cpu.yml']
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6
      - name: Frozen competence contracts
        run: python -m unittest discover -s experiments/nan_comp03/tests -v
      - name: Independent finite-series and paired-grade audit
        run: python -S -m experiments.nan_comp03.audit --out nan-comp03-independent-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: nan-comp03-independent-cpu-audit
          path: nan-comp03-independent-audit.json
