name: LBF-20L profile-aware cutset planning
on:
  pull_request:
    paths:
      - "research/lite_braille_fresco/lbf20l_planner.py"
      - "research/lite_braille_fresco/lean/LBF20Profile.lean"
      - "research/lite_braille_fresco/LBF_20L_REGISTRATION.md"
      - ".github/workflows/lbf20l-planner.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false
      - name: Verify profile and quotient identities
        run: |
          mkdir -p "$RUNNER_TEMP/lbf20l-theory"
          lean_bin="$HOME/.elan/toolchains/leanprover--lean4---v4.19.0/bin/lean"
          "$lean_bin" --threads=1 research/lite_braille_fresco/lean/LBF20Profile.lean > "$RUNNER_TEMP/lbf20l-theory/theory.log" 2>&1 || { cat "$RUNNER_TEMP/lbf20l-theory/theory.log"; exit 1; }
          cat "$RUNNER_TEMP/lbf20l-theory/theory.log"
          test "$(grep -c 'does not depend on any axioms' "$RUNNER_TEMP/lbf20l-theory/theory.log")" -eq 6
      - name: Exhaustive profile audit and paired cutset planning
        run: |
          python research/lite_braille_fresco/lbf20l_planner.py --out "$RUNNER_TEMP/lbf20l"
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ["RUNNER_TEMP"])/"lbf20l/summary.json").read_text())
          assert s["audit"]["systems"]==56 and s["audit"]["mismatches"]==0
          assert s["audit"]["profile_checks"]==32*15+24*26
          assert s["audit"]["support_checks"]==4*(32*33+24*37)
          assert s["rows"]==624 and s["new_training_fits"]==0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbf20l-planner-receipts
          path: |
            ${{ runner.temp }}/lbf20l/
            ${{ runner.temp }}/lbf20l-theory/
          if-no-files-found: warn
