name: RAM-02 portable integrity tests

on:
  push:
    paths:
      - 'experiments/lean_ram02/**'
      - '.github/workflows/lean-ram02-tests.yml'
  pull_request:
    paths:
      - 'experiments/lean_ram02/**'
      - '.github/workflows/lean-ram02-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fixed CPU test dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install psutil==7.1.3
      - name: Check model, split isolation, budgets and memory recovery
        run: python -m unittest discover -s experiments/lean_ram02/tests -v
