name: Native readout-silent intervention controls
on:
  pull_request:
    paths:
      - 'research_gym/scripts/loopscope_readout_*.py'
      - 'research_gym/scripts/verify_readout_silent.py'
      - 'research_gym/tests/test_readout_silent.py'
      - '.github/workflows/readout-silent.yml'
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s research_gym/tests -p 'test_readout_silent.py' -v
      - run: python -O -m unittest discover -s research_gym/tests -p 'test_readout_silent.py' -v
      - run: python -m research_gym.scripts.loopscope_readout_silent --help
