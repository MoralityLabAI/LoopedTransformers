name: MoLT prefix recurrence smoke
on:
  pull_request:
    paths:
      - 'experiments/molt_goblin_v1/**'
      - '.github/workflows/molt-prefix-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prefix-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q experiments/molt_goblin_v1/test_pilot.py experiments/molt_goblin_v1/test_study.py
      - run: python -m experiments.molt_goblin_v1.pilot --steps 8 --loops 2 --threads 2

      - run: python -m experiments.molt_goblin_v1.study --steps 8 --loops 2 --threads 2 --out /tmp/molt-study.json
