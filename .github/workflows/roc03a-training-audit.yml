name: ROC-03A fixed 1920-step CPU source-lock replay

on:
  pull_request:
    paths:
      - 'configs/roc03a_source_locked_training_v1.json'
      - 'research_gym/analysis/roc03a_stronger_train.py'
      - 'experiments/roc03a_task_competence/**'
      - 'tests/test_roc03a_receipt.py'
      - '.github/workflows/roc03a-training-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ROC03A_ROOT: /tmp/roc03a
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source-only protocol, metrics and syntax
        run: |
          python -m compileall -q research_gym/analysis/roc03a_stronger_train.py
          python -m unittest tests.test_roc03a_receipt -v
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Generate only train/calibration source, verify exact SHA
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from research_gym.analysis.roc02_delayed_rule_source import build_split
          root=Path(os.environ['ROC03A_ROOT'])/'source'/'data'
          root.mkdir(parents=True,exist_ok=True)
          m=json.loads(Path('experiments/roc02_delayed_rule_v1/source_manifest.json').read_text())
          for split in ('train','calibration'):
              rows=build_split(split)
              raw=''.join(json.dumps(x,sort_keys=True,separators=(',',':'))+'\n' for x in rows).encode()
              assert hashlib.sha256(raw).hexdigest()==m['splits'][split]['file_sha256']
              (root/f'{split}_inputs.jsonl').write_bytes(raw)
          print('Only training and calibration source materialized')
          PY
      - name: Replay preregistered full update budget
        run: |
          python -m research_gym.analysis.roc03a_stronger_train \
            --source-dir "$ROC03A_ROOT/source" \
            --out-dir "$ROC03A_ROOT/results"
      - name: Independently replay trained checkpoint scores against new receipt
        run: |
          python - <<'PY'
          import json,os,torch,hashlib
          from pathlib import Path
          from research_gym.analysis.roc02_tied_train import TiedRuleModel, rows,tensors,evaluate
          root=Path(os.environ['ROC03A_ROOT'])
          out=root/'results'
          r=json.loads((out/'roc03a_R8_S2026111701_metrics.json').read_text())
          ck=out/'roc03a_R8_S2026111701_step1920.pt'
          assert hashlib.sha256(ck.read_bytes()).hexdigest()==r['checkpoint_sha256']
          data=torch.load(ck,map_location='cpu',weights_only=True)
          assert (data['seed'],data['depth'],data['steps'])==(2026111701,8,1920)
          model=TiedRuleModel(8); model.load_state_dict(data['state_dict']); model.eval()
          for split in ('train','calibration'):
              score=evaluate(model,tensors(rows(root/'source'/'data'/f'{split}_inputs.jsonl')))
              old=r['checkpoints'][-1][split]
              assert score['accuracy']==old['accuracy']
              assert abs(score['cross_entropy']-old['cross_entropy'])<1e-5
          assert r['gate'] in ('PASS','FAIL') and not r['sealed_test_evaluated']
          print('ROC03A source-locked checkpoint and metrics replay PASS, gate:',r['gate'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ROC03A-source-locked-1920-step-CPU-pilot
          path: /tmp/roc03a/results/
          retention-days: 30
