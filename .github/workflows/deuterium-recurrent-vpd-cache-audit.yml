name: Deuterium source-only recurrent VPD adapter cache audit

on:
  pull_request:
    paths:
      - 'mechinterp/deuterium/native_trm/adapter_audit/**'
      - '.github/workflows/deuterium-recurrent-vpd-cache-audit.yml'
  push:
    paths:
      - 'mechinterp/deuterium/native_trm/adapter_audit/**'
      - '.github/workflows/deuterium-recurrent-vpd-cache-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  WANDB_MODE: disabled
  PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/upstream-param-decomp'

jobs:
  audit-tied-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: MoralityLabAI/param-decomp
          ref: 2df0092d5be4d8e4748b3c66ef8325dedef17549
          path: upstream-param-decomp
          sparse-checkout: param_decomp
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
      - name: Install original VPD CPU dependency set
        run: |
          python -m pip install setuptools==84.2.1
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r mechinterp/deuterium/experiments/deuterium/requirements-steering.txt
          python -m pip install sympy==1.14.0
          python -m pip check
          test "$(git -C upstream-param-decomp rev-parse HEAD)" = '2df0092d5be4d8e4748b3c66ef8325dedef17549'
      - name: Source-only regression tests; no new experiment/test data
        run: |
          python -m compileall -q mechinterp/deuterium/native_trm/adapter_audit
          python -m unittest discover -s mechinterp/deuterium/native_trm/adapter_audit/tests -p 'test_cache_ledger.py' -v
      - name: Run excluded seed 61076 untrained native four-pass mask ledger
        run: |
          python -m mechinterp.deuterium.native_trm.adapter_audit.cache_ledger \
            --mode smoke --out runs/deuterium-adapter-01/smoke.json
          python -m mechinterp.deuterium.native_trm.adapter_audit.audit_receipt \
            --source runs/deuterium-adapter-01/smoke.json \
            --out runs/deuterium-adapter-01/smoke_audit.json
      - uses: actions/download-artifact@v4
        with:
          name: lga02-source-train-only-teacher-and-six-SAEs
          run-id: 44222863870
          github-token: ${{ github.token }}
          path: runs/deuterium-adapter-01/original-teachers
      - name: Download saved original trained VPD CI and factor weights for seed 103
        uses: actions/download-artifact@v4
        with:
          name: deuterium-native-stageb-first-teacher-103
          run-id: 44463652662
          github-token: ${{ github.token }}
          path: runs/deuterium-adapter-01/original-fitted-vpd/seed_103
      - name: Download saved original trained VPD CI and factor weights for seed 211
        uses: actions/download-artifact@v4
        with:
          name: deuterium-native-stageb-first-teacher-211
          run-id: 44463652662
          github-token: ${{ github.token }}
          path: runs/deuterium-adapter-01/original-fitted-vpd/seed_211
      - name: Download saved original trained VPD CI and factor weights for seed 307
        uses: actions/download-artifact@v4
        with:
          name: deuterium-native-stageb-first-teacher-307
          run-id: 44463652662
          github-token: ${{ github.token }}
          path: runs/deuterium-adapter-01/original-fitted-vpd/seed_307
      - name: Verify pretrained teacher bytes, and audit only 8 original training strings
        run: |
          echo 'd32f249385df2eabefcacbee15c9ab2cccc73f01452300f275a11f621106a266  runs/deuterium-adapter-01/original-teachers/bundle.pt' | sha256sum -c -
          echo '7bf32b627d7b95e756119cec221c33afd9a6c1cd44e6904ef9002791026bc07d  runs/deuterium-adapter-01/original-teachers/train.json' | sha256sum -c -
          python -m mechinterp.deuterium.native_trm.adapter_audit.cache_ledger \
            --mode trained \
            --teacher-bundle runs/deuterium-adapter-01/original-teachers/bundle.pt \
            --teacher-meta runs/deuterium-adapter-01/original-teachers/train.json \
            --fitted-root runs/deuterium-adapter-01/original-fitted-vpd \
            --out runs/deuterium-adapter-01/old_train_source_only.json
          python -m mechinterp.deuterium.native_trm.adapter_audit.audit_receipt \
            --source runs/deuterium-adapter-01/old_train_source_only.json \
            --out runs/deuterium-adapter-01/trained_audit.json
      - name: Summarize actual native tied-module and mask evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runs/deuterium-adapter-01')
          r=json.loads((p/'old_train_source_only.json').read_text())
          a=json.loads((p/'trained_audit.json').read_text())
          assert r['status']=='SOURCE_ONLY_PASS' and a['status']=='PASS'
          assert a['torch_imported'] is False
          print('DEUTERIUM_ADAPTER_01',a['conclusion'])
          for seed,record in r['models'].items():
              print('TEACHER',seed,'mask_mean_abs_diffs',record['mean_absolute_per_depth_mask_mismatch_against_last_mask'],
                    'source_input_rms',record['physical_input_rms_distance_from_last_pass'])
          PY
      - name: Upload original source-only cache audits even after failed gates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deuterium-native-adapter-cache-source-only-${{ github.sha }}
          path: |
            runs/deuterium-adapter-01/*.json
          if-no-files-found: warn
          retention-days: 90
