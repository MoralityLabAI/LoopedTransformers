name: PEF-09 ungated frozen-feature invariants

on:
  pull_request:
    paths:
      - 'research/pef09/**'
      - '.github/workflows/pef09-ungated-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ungated-projection-invariants-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      DNNL_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU model and unit-test stack
        run: |
          python -m pip install pytest
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check registered ungated projection and residual recovery algebra
        run: python -m pytest -q research/pef09/test_pef09.py research/pef09/test_pef09r.py
      - name: Check Python syntax
        run: python -m compileall -q research/pef09
