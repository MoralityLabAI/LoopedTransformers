name: AF-10 structural causal cut and original-checkpoint replay

on:
  push:
    branches: [feat/activation-funnel-af10-causal-cut]
    paths:
      - 'experiments/activation_funnel_af10/**'
      - 'docs/research/AF10_CAUSAL_CUT_THEOREM.md'
      - '.github/workflows/activation-funnel-af10.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'

concurrency:
  group: af10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/activation_funnel
            experiments/activation_funnel_af02
            experiments/activation_funnel_af05
            experiments/activation_funnel_af06
            experiments/activation_funnel_af07
            experiments/activation_funnel_af08
            experiments/activation_funnel_af09
            experiments/activation_funnel_af10
            experiments/lean_reasoner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU source runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Test exact causal code and run in optimized mode
        run: |
          set -euo pipefail
          python -m unittest discover -s experiments/activation_funnel_af10/tests -p 'test_*.py' -v
          python -O -m unittest discover -s experiments/activation_funnel_af10/tests -p 'test_*.py' -v
      - name: Install checksum-pinned Lean 4.19.0
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/lean-4.19.0-linux.tar.zst" \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo "6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  $RUNNER_TEMP/lean-4.19.0-linux.tar.zst" | sha256sum --check --strict
          tar --zstd -xf "$RUNNER_TEMP/lean-4.19.0-linux.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Kernel-check coordinate-cut theorem on original toolchain
        run: |
          lean experiments/activation_funnel_af10/CausalCut.lean

  diagnostic:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        seed: [17, 29]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/activation_funnel
            experiments/activation_funnel_af02
            experiments/activation_funnel_af05
            experiments/activation_funnel_af06
            experiments/activation_funnel_af07
            experiments/activation_funnel_af08
            experiments/activation_funnel_af09
            experiments/activation_funnel_af10
            experiments/lean_reasoner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original registered CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Download and verify original frozen AF-09 training ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/af10/source
          if [ "$SEED" = "17" ]; then
            ID=14148947456
            HASH=c29f63fec6c66dc1ae62b820bb7fa12a12e744bd49933de397c4e7bace16c488
          else
            ID=14148897762
            HASH=ef4fb7b2a45fd643e25959b7d1d20142d5063dfe86d8da19fb069dd01a0bcc5c
          fi
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/MoralityLabAI/LoopedTransformers/actions/artifacts/$ID/zip" \
            -o artifacts/af10/source/original.zip
          echo "$HASH  artifacts/af10/source/original.zip" | sha256sum --check --strict
      - name: Full source-validated diagnostic and independent numerical verifier
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/af10/evaluation
          git rev-parse HEAD > artifacts/af10/evaluation/source_revision.txt
          python --version > artifacts/af10/evaluation/python_version.txt
          python -m experiments.activation_funnel_af10.diagnostic \
            --source-zip artifacts/af10/source/original.zip --seed "$SEED" \
            --out artifacts/af10/evaluation/scored
          python -m experiments.activation_funnel_af10.verify \
            --source-zip artifacts/af10/source/original.zip --seed "$SEED" \
            --evaluation artifacts/af10/evaluation/scored \
            --out artifacts/af10/evaluation/scored/independent_audit.json
      - name: Retain source-binding and complete causal-cut replay records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af10-seed-${{ matrix.seed }}
          path: artifacts/af10/evaluation/scored/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/activation_funnel_af10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: af10-seed-*
          path: artifacts/af10
          merge-multiple: false
      - name: Reconcile exact two-seed original-model diagnostic
        run: |
          mkdir -p artifacts/af10/aggregate
          git rev-parse HEAD > artifacts/af10/aggregate/source_revision.txt
          python -m experiments.activation_funnel_af10.aggregate \
            --root artifacts/af10 --out artifacts/af10/aggregate/aggregate.json
          sha256sum artifacts/af10/aggregate/aggregate.json > artifacts/af10/aggregate/aggregate.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: af10-aggregate
          path: artifacts/af10/aggregate/
          retention-days: 30
