name: NEC-03V-B root4 strict replay diagnostics (CPU source-only)

on:
  push:
    branches: ["research/nec03v-root4-independent-replay-debug-20261122"]
    paths:
      - ".github/workflows/nec03v-root4-independent-debug.yml"
      - "mechinterp/neuron_communities/NEC03V_BEHAVIOR_METHOD_LOCK.json"
  pull_request:
    paths: [".github/workflows/nec03v-root4-independent-debug.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-root4-strict-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check exact source-only behavior method blob SHA pins and original root scope
        run: |
          python - <<'PY'
          from mechinterp.neuron_communities.nec03v_behavior_source import load_locks
          panel,method=load_locks()
          assert method["registered_revision"]==3
          assert method["recruited_or_confirmation_worlds_allowed"] is False
          assert method["replayed_behavior_logit_tolerance"]=={"abs":.0001,"relative":.00002}
          assert panel["fixed_ITT_zero_roots"]==[3,5]
          print("NEC03V_DIAGNOSTIC_AUDIT_V3_PINNED_NO_TOLERANCE_CHANGE")
          PY
      - name: Install CPU-only Torch
        run: python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44913605626
          name: nec03t-source-root-4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec03v/t
      - uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44900628360
          name: nec03ob-source-root-4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec03v/source
      - uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44992827210
          name: nec03v-original-world-4-registered-source-codes
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec03v/geometry
      - name: Execute original source-only pilot with exactly frozen G/sham choices
        run: |
          python -m mechinterp.neuron_communities.nec03v_behavior_source \
            --world-index 4 --source-root /tmp/nec03v/source --nec03t-root /tmp/nec03v/t \
            --geometry-pack /tmp/nec03v/geometry/pack \
            --physical-preflight /tmp/nec03v/geometry/physical-preflight.json \
            --independent-physical-audit /tmp/nec03v/geometry/physical-audit.json \
            --independent-activation-audit /tmp/nec03v/geometry/activation-audit.json \
            --out /tmp/nec03v/behavior --execute-registered-source-scoring
      - name: Recheck unchanged strict 1e-4 original-source logit gate, printing exact mismatch
        run: |
          python -m mechinterp.neuron_communities.nec03v_behavior_independent_audit \
            --world-index 4 --source-root /tmp/nec03v/source --nec03t-root /tmp/nec03v/t \
            --geometry-pack /tmp/nec03v/geometry/pack \
            --physical-preflight /tmp/nec03v/geometry/physical-preflight.json \
            --source-behavior /tmp/nec03v/behavior \
            --out /tmp/nec03v/independent-audit.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nec03v-UNVERIFIED-root4-strict-logit-replay-diagnostic
          path: |
            /tmp/nec03v/behavior/source_behavior_raw.jsonl
            /tmp/nec03v/behavior/source_behavior_report.json
            /tmp/nec03v/independent-audit.json
          if-no-files-found: warn
          retention-days: 30
