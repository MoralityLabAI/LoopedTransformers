name: BPD-LG-01 generated Lean tactic curriculum

on:
  push:
    paths:
      - 'experiments/bpd_lean_curriculum/**'
      - '.github/workflows/bpd-lean-curriculum.yml'
  pull_request:
    paths:
      - 'experiments/bpd_lean_curriculum/**'
      - '.github/workflows/bpd-lean-curriculum.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-source-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and audit counterfactual curriculum
        run: |
          python -m unittest experiments.bpd_lean_curriculum.test_bpd_lean_curriculum -v
          python -m experiments.bpd_lean_curriculum.generate --out /tmp/bpd-lg01
          python -m experiments.bpd_lean_curriculum.bridge --out /tmp/bpd-lg01/fc12_train_probe_plan.json
      - name: Install pinned Lean 4.19.0
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/lean.tar.zst
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo '/tmp/lean-4.19.0-linux/bin' >> "$GITHUB_PATH"
      - name: Kernel-check every positive generated theorem in every split
        run: |
          lean /tmp/bpd-lg01/train_positives.lean
          lean /tmp/bpd-lg01/dev_positives.lean
          lean /tmp/bpd-lg01/test_positives.lean
      - name: Archive exact source and negative cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-lg01-${{ github.run_id }}
          path: /tmp/bpd-lg01/
          retention-days: 21
          if-no-files-found: warn
