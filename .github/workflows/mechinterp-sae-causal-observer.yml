name: LS-SAE01 causal SAE observer and exact loop-depth witness

on:
  push:
    paths:
      - 'mechinterp/sae_causal_transfer/**'
      - 'mechinterp/README.md'
      - '.github/workflows/mechinterp-sae-causal-observer.yml'
  pull_request:
    paths:
      - 'mechinterp/sae_causal_transfer/**'
      - 'mechinterp/README.md'
      - '.github/workflows/mechinterp-sae-causal-observer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-numerical-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only NumPy observer dependency
        run: python -m pip install numpy==2.1.3
      - name: Compile and test observer, source receipt index and exact recurrence witness
        run: |
          python -m compileall -q mechinterp/sae_causal_transfer
          python -m unittest discover -s mechinterp/sae_causal_transfer/tests -p 'test_*.py' -v
      - name: Regenerate exact-rational six-dimensional loop-depth receipt
        run: python -m mechinterp.sae_causal_transfer.loop_depth --out runs/ls_sae01_exact_toy.json
      - name: Retain exact toy witness (no checkpoint claims)
        uses: actions/upload-artifact@v4
        with:
          name: ls-sae01-exact-toy-observer
          path: runs/ls_sae01_exact_toy.json
          if-no-files-found: error
          retention-days: 90
