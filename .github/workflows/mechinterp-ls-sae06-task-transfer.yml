name: LS-SAE06 native full81 Sudoku causal task transfer
on:
  pull_request:
    paths:
      - 'mechinterp/sae_causal_transfer/native_task_transfer_v1/**'
      - '.github/workflows/mechinterp-ls-sae06-task-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cpu-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed CPU-native numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify full81 Sudoku truth, logit gauge and native JVP/VJP controls
        run: |
          python -m compileall -q mechinterp/sae_causal_transfer/native_task_transfer_v1
          python -m unittest discover -s mechinterp/sae_causal_transfer/native_task_transfer_v1 -p 'test_*.py' -v
  original-source-pinned-pilot:
    needs: native-cpu-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download original source-fit-only calibration artifact from sealed LS-SAE04 job
        uses: actions/download-artifact@v4
        with:
          name: ls-sae04-original-preheldout-calibration-only
          run-id: 43818817318
          github-token: ${{ github.token }}
          path: runs/ls_sae06/source
      - name: SHA-pinned 2+2 pilot of full81 native Sudoku/logit controls
        run: python -m mechinterp.sae_causal_transfer.native_task_transfer_v1.run_native --pilot --source-dir runs/ls_sae06/source --out runs/ls_sae06/pilot.json
      - name: Independent source/signed-logit/Sudoku-truth pilot replay
        run: python -m mechinterp.sae_causal_transfer.native_task_transfer_v1.audit --input runs/ls_sae06/pilot.json --out runs/ls_sae06/pilot-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae06-native-full81-pilot-and-audit
          path: runs/ls_sae06/pilot*.json
          if-no-files-found: warn
          retention-days: 90
  full-16-novel-sudoku:
    needs: original-source-pinned-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download identical original preheldout LS-SAE04 source calibration
        uses: actions/download-artifact@v4
        with:
          name: ls-sae04-original-preheldout-calibration-only
          run-id: 43818817318
          github-token: ${{ github.token }}
          path: runs/ls_sae06/source
      - name: Source-locked full 8+8 unseen Sudoku all81 logits and exact correctness
        run: python -m mechinterp.sae_causal_transfer.native_task_transfer_v1.run_native --source-dir runs/ls_sae06/source --out runs/ls_sae06/full.json
      - name: Independent per-cell margin, exact Sudoku and clustered gate replay
        run: python -m mechinterp.sae_causal_transfer.native_task_transfer_v1.audit --input runs/ls_sae06/full.json --out runs/ls_sae06/full-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae06-complete81-native-task-causal-receipts
          path: runs/ls_sae06/full*.json
          if-no-files-found: warn
          retention-days: 90
