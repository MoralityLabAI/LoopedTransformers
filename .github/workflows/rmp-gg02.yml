name: RMP GG-02 Causal Subspaces

on:
  push:
    branches: ['research/rmp-gg02-causal-subspaces-20261111']
    paths:
      - 'docs/rmp_goal_guarding_causal_v0_2.md'
      - 'research_gym/interp/goal_guarding_subspace.py'
      - 'research_gym/scripts/bench_goal_guarding_subspaces.py'
      - 'tests/test_goal_guarding_subspace.py'
      - '.github/workflows/rmp-gg02.yml'
  pull_request:
    paths:
      - 'docs/rmp_goal_guarding_causal_v0_2.md'
      - 'research_gym/interp/goal_guarding_subspace.py'
      - 'research_gym/scripts/bench_goal_guarding_subspaces.py'
      - 'tests/test_goal_guarding_subspace.py'
      - '.github/workflows/rmp-gg02.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gg02-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-rank-interchange:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyTorch CPU and pytest
        run: |
          python -m pip install pytest
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify exact oracle, panel isolation, and native patch
        run: python -m pytest -q tests/test_goal_guarding_subspace.py
      - name: Frozen GG-02 two-seed full causal subspace experiment
        run: |
          mkdir -p /tmp/gg02
          python -m research_gym.scripts.bench_goal_guarding_subspaces \
            --out /tmp/gg02/gg02.json \
            --checkpoint-dir /tmp/gg02/checkpoints \
            > /tmp/gg02/summary.json
          cat /tmp/gg02/summary.json
      - name: Validate locked panel and source-bound experiment receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/gg02/gg02.json').read_text())
          assert data['protocol']=='RMP-GG-02'
          assert data['train_steps']==400
          assert data['fit_steps']==120
          assert data['split_sizes']=={'calibration':256,'validation':128,'locked':256}
          assert data['seeds']==[11,17] and len(data['results'])==2
          for row in data['results']:
              assert row['selected_rank_from_validation'] in (2,4,8)
              assert row['base_training']['updates']==400
              assert set(row['validation_rank_metrics'])=={'2','4','8'}
              assert set(row['locked_rank_metrics'])=={'2','4','8'}
              assert row['locked_eligible']<=256
              for rank,rec in row['locked_rank_metrics'].items():
                  assert len(rec['loss_trace'])>0
                  if rec['status']=='MEASURED':
                      assert len(rec['random_controls'])==8
                      assert 0 <= rec['inside_clean_norm_ceiling'] <= 1
                  assert len(rec['basis_sha256'])==64
              print('GG-02 seed',row['seed'],'selected rank',
                    row['selected_rank_from_validation'],
                    'eligible',row['locked_eligible'],
                    'support',row['selected_rank_causal_gate'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg02-locked-causal-subspace-weights-and-receipt
          path: /tmp/gg02
          if-no-files-found: warn
          retention-days: 14
