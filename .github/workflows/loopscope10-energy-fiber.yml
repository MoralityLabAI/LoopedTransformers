name: LGA-07 energy-tangent source-only native instrument
on:
  pull_request:
    paths:
      - 'mechinterp/loopscope10/**'
      - '.github/workflows/loopscope10-energy-fiber.yml'
  push:
    paths:
      - 'mechinterp/loopscope10/**'
      - '.github/workflows/loopscope10-energy-fiber.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU Torch only; do not download original model bundles
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run synthetic and excluded-61059 native tests (reserved 31059 remains unopened)
        run: |
          python -m compileall -q mechinterp/loopscope10
          python -m unittest discover -s mechinterp/loopscope10/tests -p 'test_energy_fiber.py' -v
