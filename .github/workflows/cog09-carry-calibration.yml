name: COG-09 matched carry calibration
on:
  pull_request:
    paths:
      - 'research/cog09_carry_causality/**'
      - '.github/workflows/cog09-carry-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/DataGoblin
          ref: ae0dbecffc1d246778ee47d8f3d8ec59b5948f2b
          path: upstream-cog02
          sparse-checkout: src/datagoblin/training_gym/rlt_gym
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/EvalMath
          ref: 606056d60f51a680512afb6603ba03c92e8d02f3
          path: upstream-cog08
          sparse-checkout: |
            src/spiral_ln
            skills/evalmath-mechinterp-power
          persist-credentials: false
      - name: Verify source pins
        run: |
          test "$(git -C upstream-cog02 rev-parse HEAD)" = ae0dbecffc1d246778ee47d8f3d8ec59b5948f2b
          test "$(git -C upstream-cog08 rev-parse HEAD)" = 606056d60f51a680512afb6603ba03c92e8d02f3
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check interventions
        run: python -m unittest discover -s research/cog09_carry_causality/tests -v
      - name: Run development-only matched-sham pilot
        run: >-
          python -m research.cog09_carry_causality.run
          --generator upstream-cog02/src/datagoblin/training_gym/rlt_gym/cogentic_ledger.py
          --evalmath upstream-cog08
          --output "$RUNNER_TEMP/cog09"
          --threads 2
      - name: Preserve raw attempts, calibration and preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog09-calibration
          path: ${{ runner.temp }}/cog09/
          if-no-files-found: warn
          retention-days: 30
