name: LBF-20F shared witness constraints
on:
  pull_request:
    paths:
      - "research/lite_braille_fresco/lbf20f_*.py"
      - "research/lite_braille_fresco/lean/LBF20CSP.lean"
      - "research/lite_braille_fresco/LBF_20F_REGISTRATION.md"
      - ".github/workflows/lbf20f-witness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - name: Prove propagation soundness and odd-cycle obstruction
        run: |
          mkdir -p "$RUNNER_TEMP/lbf20f-theory"
          lean_bin="$HOME/.elan/toolchains/leanprover--lean4---v4.19.0/bin/lean"
          "$lean_bin" --threads=1 research/lite_braille_fresco/lean/LBF20CSP.lean > "$RUNNER_TEMP/lbf20f-theory/theory.log" 2>&1 || { cat "$RUNNER_TEMP/lbf20f-theory/theory.log"; exit 1; }
          cat "$RUNNER_TEMP/lbf20f-theory/theory.log"
          test "$(grep -c 'does not depend on any axioms' "$RUNNER_TEMP/lbf20f-theory/theory.log")" -eq 6
      - name: Independent finite audit, matched learning and search
        run: python research/lite_braille_fresco/lbf20f_learning.py --out "$RUNNER_TEMP/lbf20f-synthetic"
      - name: Native shared existential proofs
        run: python research/lite_braille_fresco/lbf20f_native.py --fit-dir "$RUNNER_TEMP/lbf20f-synthetic" --out "$RUNNER_TEMP/lbf20f-native"
      - name: Independently compile all native certificates
        run: |
          lean_bin="$HOME/.elan/toolchains/leanprover--lean4---v4.19.0/bin/lean"
          "$lean_bin" --threads=1 "$RUNNER_TEMP/lbf20f-native/Witnesses.lean" > "$RUNNER_TEMP/lbf20f-native/witnesses.log" 2>&1 || { tail -100 "$RUNNER_TEMP/lbf20f-native/witnesses.log"; exit 1; }
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])
          s=json.loads((d/"lbf20f-native/summary.json").read_text())
          t=json.loads((d/"lbf20f-synthetic/summary.json").read_text())
          names=re.findall(r"'(lbf20f_[A-Za-z0-9_]+)' does not depend on any axioms",(d/"lbf20f-native/witnesses.log").read_text())
          assert len(names)==s["native_kernel_certificates"] and len(set(names))==len(names)
          assert s["episodes"]==84 and len(t["fits"])==9
          assert s["metavariable_audit"]["wrong_tuple_rejected"] and s["metavariable_audit"]["correct_tuple_kernel_closed"]
          print("Standalone axiom-free certificates:",len(names))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbf20f-shared-witness-receipts
          path: |
            ${{ runner.temp }}/lbf20f-synthetic/
            ${{ runner.temp }}/lbf20f-native/
            ${{ runner.temp }}/lbf20f-theory/
          if-no-files-found: warn
