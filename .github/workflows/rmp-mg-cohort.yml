name: RMP-MG-01 trained cohort adapter
on:
  pull_request:
    paths:
      - 'research_gym/scripts/loopscope_mg_cohort.py'
      - 'tests/test_loopscope_mg_cohort.py'
      - 'tests/test_loopscope_mg_cohort_native.py'
      - '.github/workflows/rmp-mg-cohort.yml'
  push:
    branches:
      - research/rmp-mg01-trained-cohort-runner
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-integrity-and-native-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check original-receipt and resume contracts
        run: python -m unittest discover -s tests -p test_loopscope_mg_cohort.py -v
      - name: Train isolated CPU fixture and execute both native assays
        run: python -m unittest discover -s tests -p test_loopscope_mg_cohort_native.py -v
