name: AF-21 greedy STOP margin and shortest-rule ranking
on:
  push:
    branches: [feat/activation-funnel-af21-greedy-stop-margin]
    paths:
      - 'experiments/activation_funnel_af21/**'
      - '.github/workflows/activation-funnel-af21.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: af21-${{ github.ref }}
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Source and exact heldout-manifest audit
        run: |
          set -euo pipefail
          python -m unittest discover -s experiments/activation_funnel_af21/tests -p 'test_*.py' -v
          python -O -m unittest discover -s experiments/activation_funnel_af21/tests -p 'test_*.py' -v
          python -m experiments.activation_funnel_af21.experiment manifest --out /tmp/af21_manifest.json
          cmp /tmp/af21_manifest.json experiments/activation_funnel_af21/fresh_manifest.json
      - name: Lean 4.19.0 Bellman-descent proof
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  /tmp/lean-4.19.0-linux.tar.zst' | sha256sum --check --strict
          tar --zstd -xf /tmp/lean-4.19.0-linux.tar.zst -C /tmp
          /tmp/lean-4.19.0-linux/bin/lean experiments/activation_funnel_af21/GreedyStop.lean
  train-evaluate:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [17,29,43,61,73,89,103,131]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Fit, score and independently replay
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          mkdir -p "artifacts/af21/s${SEED}"
          git rev-parse HEAD > "artifacts/af21/s${SEED}/source_revision.txt"
          python -m experiments.activation_funnel_af21.experiment train --seed "$SEED" --out "artifacts/af21/s${SEED}/training"
          python -m experiments.activation_funnel_af21.experiment evaluate --seed "$SEED" --training "artifacts/af21/s${SEED}/training" --out "artifacts/af21/s${SEED}/evaluation"
          python -m experiments.activation_funnel_af21.verify --seed "$SEED" --training "artifacts/af21/s${SEED}/training" --evaluation "artifacts/af21/s${SEED}/evaluation" --out "artifacts/af21/s${SEED}/independent_audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: af21-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: artifacts/af21/s${{ matrix.seed }}
          retention-days: 30
  aggregate:
    needs: train-evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install aggregation dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - uses: actions/download-artifact@v4
        with:
          pattern: af21-seed-*-${{ github.run_id }}
          merge-multiple: false
          path: artifacts/af21/batches
      - name: Verify all eight original seed receipts
        run: |
          set -euo pipefail
          for seed in 17 29 43 61 73 89 103 131; do
            mv "artifacts/af21/batches/af21-seed-${seed}-${GITHUB_RUN_ID}" "artifacts/af21/s${seed}"
          done
          python -m experiments.activation_funnel_af21.aggregate --root artifacts/af21 --out artifacts/af21/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: af21-results-${{ github.run_id }}
          path: artifacts/af21/results.json
          retention-days: 30
