name: OLR-06B paid relation allocation CPU
on:
  pull_request:
    paths:
      - "research/lean_cgrt_hrm400/ppt_gym/olr06_quer*.py"
      - "research/lean_cgrt_hrm400/ppt_gym/olr06_exact_ledger.py"
      - "research/lean_cgrt_hrm400/ppt_gym/tests/test_olr06*.py"
      - ".github/workflows/olr06b-query.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paid-query:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Exact signed closure and Bellman reference tests
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m unittest discover -s ppt_gym/tests -p "test_olr06*.py" -v
      - name: Freeze public root signatures and fit source action values
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: |
          python -m ppt_gym.olr06_query_campaign freeze --out runs/olr06b-bank
          python -m ppt_gym.olr06_query_campaign fit --bank runs/olr06b-bank --out runs/olr06b-fit
      - name: Frozen expected-utility and actual receipt scoring
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: |
          python -m ppt_gym.olr06_query_campaign score --bank runs/olr06b-bank --fit runs/olr06b-fit --out runs/olr06b-eval
          python - <<'PY'
          import json
          m=json.load(open("runs/olr06b-eval/manifest.json",encoding="utf-8"))
          assert m["query_roots"]==80 and m["policy_trials"]==1520,m
          assert m["frozen_neural_state_tables"]==1200,m
          assert m["delayed_example"]["optimal"]["resolved"]==8,m
          assert m["delayed_example"]["lookahead2"]["resolved"]==6,m
          assert m["native_lean"] is False and m["architecture_promotion_eligible"] is False
          print("OLR06B exact expectation scorecard",json.dumps(m["scorecard"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olr06b-paid-relation
          path: |
            research/lean_cgrt_hrm400/runs/olr06b-bank
            research/lean_cgrt_hrm400/runs/olr06b-fit
            research/lean_cgrt_hrm400/runs/olr06b-eval
          if-no-files-found: ignore
