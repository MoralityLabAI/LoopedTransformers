name: AF-06 staged proof-state interchange and independent audit

on:
  push:
    branches:
      - feat/activation-funnel-af06-staged-causal
    paths:
      - 'experiments/activation_funnel_af06/**'
      - '.github/workflows/activation-funnel-af06.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'

concurrency:
  group: af06-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install registered CPU torch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Exact corpus, native gradients, schedule, smoke and replay
        run: |
          set -euo pipefail
          mkdir -p artifacts/af06/preflight
          git rev-parse HEAD > artifacts/af06/preflight/source_revision.txt
          python -m unittest discover -s experiments/activation_funnel_af06/tests -p 'test_*.py' -v 2>&1 | tee artifacts/af06/preflight/tests.log
          python -O -m unittest discover -s experiments/activation_funnel_af06/tests -p 'test_*.py' -v 2>&1 | tee artifacts/af06/preflight/optimized.log
          python -m experiments.activation_funnel_af06.experiment manifest --out artifacts/af06/preflight/corpus_manifest.json
          cmp artifacts/af06/preflight/corpus_manifest.json experiments/activation_funnel_af06/corpus_manifest.json
          python -m pip freeze > artifacts/af06/preflight/python_packages.txt
      - name: Install checksum-pinned Lean 4.19.0
        run: |
          LEAN_ARCHIVE="$RUNNER_TEMP/af06-lean-4.19.0-linux.tar.zst"
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o "$LEAN_ARCHIVE"
          echo "6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  $LEAN_ARCHIVE" | sha256sum --check --strict
          tar --zstd -xf "$LEAN_ARCHIVE" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Certify fixed Horn corpus oracle
        run: |
          set -euo pipefail
          for split in train dev held_composition held_layout held_depth4 held_depth5; do
            python -m experiments.activation_funnel_af06.experiment lean --split "$split" --out "artifacts/af06/preflight/${split}.lean"
            lean "artifacts/af06/preflight/${split}.lean" 2>&1 | tee "artifacts/af06/preflight/${split}.lean.log"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af06-preflight-${{ github.run_id }}
          path: artifacts/af06/preflight/
          retention-days: 30

  train:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [17, 29, 43]
        width: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install registered CPU torch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Train fixed shared warm-up and matched continuation matrix
        run: |
          set -euo pipefail
          OUT="artifacts/af06/s${{ matrix.seed }}-w${{ matrix.width }}"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source_revision.txt"
          python -m experiments.activation_funnel_af06.experiment train \
            --seed ${{ matrix.seed }} --width ${{ matrix.width }} --out "$OUT/train" 2>&1 | tee "$OUT/train.log"
          python -m pip freeze > "$OUT/python_packages.txt"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af06-train-s${{ matrix.seed }}-w${{ matrix.width }}-${{ github.run_id }}
          path: artifacts/af06/s${{ matrix.seed }}-w${{ matrix.width }}/
          retention-days: 30

  evaluate:
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [17, 29, 43]
        width: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: af06-train-s${{ matrix.seed }}-w${{ matrix.width }}-${{ github.run_id }}
          path: artifacts/af06/training
      - name: Install registered CPU torch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Evaluate immutable models and independently replay patches
        run: |
          set -euo pipefail
          mkdir -p artifacts/af06/score
          python -m experiments.activation_funnel_af06.experiment evaluate \
            --training artifacts/af06/training/train --out artifacts/af06/score \
            --seed ${{ matrix.seed }} --width ${{ matrix.width }} 2>&1 | tee artifacts/af06/eval.log
          python -m experiments.activation_funnel_af06.verify \
            --train artifacts/af06/training/train --evaluation artifacts/af06/score \
            --seed ${{ matrix.seed }} --width ${{ matrix.width }} \
            --out artifacts/af06/score/independent_audit.json 2>&1 | tee artifacts/af06/verify.log
          cp artifacts/af06/training/train/train_receipt.json artifacts/af06/score/train_receipt.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af06-eval-s${{ matrix.seed }}-w${{ matrix.width }}-${{ github.run_id }}
          path: artifacts/af06/score/
          retention-days: 30

  aggregate:
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: af06-eval-*-${{ github.run_id }}
          path: artifacts/af06/collected
          merge-multiple: false
      - name: Reconcile complete six-way source and metric matrix
        run: |
          set -euo pipefail
          mkdir -p artifacts/af06/report
          python -m experiments.activation_funnel_af06.aggregate \
            --root artifacts/af06/collected \
            --out artifacts/af06/report/results.json \
            --report artifacts/af06/report/RESULTS.md
          git rev-parse HEAD > artifacts/af06/report/source_revision.txt
          sha256sum artifacts/af06/report/results.json > artifacts/af06/report/results.sha256
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af06-results-${{ github.run_id }}
          path: artifacts/af06/report/
          retention-days: 30
