name: NEC-03V registered source-fit SAE activation recovery (CPU-only)

on:
  pull_request:
    paths:
      - ".github/workflows/nec03v-source-activation-recovery.yml"
      - "mechinterp/neuron_communities/nec03v_activation_extract.py"
      - "mechinterp/neuron_communities/nec03v_independent_activation_audit.py"
      - "mechinterp/neuron_communities/NEC03V_ACTIVATION_EXTRACT_LOCK.json"
      - "mechinterp/neuron_communities/test_nec03v_activation_extract.py"
  push:
    branches:
      - "research/nec03v-source-group-redesign-20261122"
    paths:
      - ".github/workflows/nec03v-source-activation-recovery.yml"
      - "mechinterp/neuron_communities/NEC03V_ACTIVATION_EXTRACT_LOCK.json"
      - "mechinterp/neuron_communities/test_nec03v_activation_extract.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nec03v-activation-original-source-registered-pilot
  cancel-in-progress: false

jobs:
  registered-source-only-method:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source-only extraction modules and verify immutable method blob registrations
        run: |
          python - <<'PY'
          from pathlib import Path
          from mechinterp.neuron_communities.nec03v_activation_extract import registered_lock
          lock=registered_lock()
          names=[
            "mechinterp/neuron_communities/nec03v_activation_extract.py",
            "mechinterp/neuron_communities/nec03v_independent_activation_audit.py",
            "mechinterp/neuron_communities/nec03v_geometry.py",
            "mechinterp/neuron_communities/nec03v_independent_geometry_audit.py",
          ]
          for name in names:
              compile(Path(name).read_text(),name,"exec")
          assert lock["allow_new_native_inference"] is True
          assert lock["source_fit_groups"] == list(range(40))
          assert lock["source_case_groups"] == list(range(24,32))
          assert lock["forbid_heldout_or_recruited_inputs"] is True
          assert lock["new_nec03v_behavioral_scoring"] is False
          print("NEC03V_ACTIVATION_SOURCE_ONLY_METHOD_FROZEN_BEFORE_FORWARDS")
          PY
      - name: Test positive SAE source-support and registered pack custody, no native inference
        run: python -m unittest mechinterp.neuron_communities.test_nec03v_activation_extract -v

  original-root0-live-source-inference:
    needs: registered-source-only-method
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch for original frozen source-only forward hooks
        run: python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Original NEC03T source-only case archive 0
        uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44913605626
          name: nec03t-source-root-0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec03v/original-t
      - name: Original independently audited source-trained native and SAE 0
        uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44899750508
          name: nec03o-refit-source-root-0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec03v/original-source
      - name: Original reset1800 native checkpoint 0
        uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44898361742
          name: nec03nb-warm-source-root-0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec03v/original-reset
      - name: Independently audited original decoder32 columns, frozen prior run 0
        uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44983824946
          name: nec03v-frozen-decoder32-original-world-0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec03v/original-decoder
      - name: Check exact pinned method, source-only roster and dry-run without inference
        run: |
          python -m mechinterp.neuron_communities.nec03v_activation_extract \
            --world-index 0 --source-root /tmp/nec03v/original-source \
            --nec03t-root /tmp/nec03v/original-t \
            --reset-root /tmp/nec03v/original-reset \
            --decoder-columns /tmp/nec03v/original-decoder/projected-columns.json \
            --decoder-audit /tmp/nec03v/original-decoder/decoder-audit.json \
            --out /tmp/nec03v/original-source0-pack
      - name: Execute registered 40 source-fit groups only, frozen CPU model
        run: |
          python -m mechinterp.neuron_communities.nec03v_activation_extract \
            --world-index 0 --source-root /tmp/nec03v/original-source \
            --nec03t-root /tmp/nec03v/original-t \
            --reset-root /tmp/nec03v/original-reset \
            --decoder-columns /tmp/nec03v/original-decoder/projected-columns.json \
            --decoder-audit /tmp/nec03v/original-decoder/decoder-audit.json \
            --out /tmp/nec03v/original-source0-pack \
            --allow-registered-source-forwards
      - name: Independently recompute 1280 original source-fit code lists and 256 intervention coefficients
        run: |
          python -m mechinterp.neuron_communities.nec03v_independent_activation_audit \
            --world-index 0 --source-root /tmp/nec03v/original-source \
            --nec03t-root /tmp/nec03v/original-t \
            --reset-root /tmp/nec03v/original-reset \
            --decoder-columns /tmp/nec03v/original-decoder/projected-columns.json \
            --decoder-audit /tmp/nec03v/original-decoder/decoder-audit.json \
            --pack /tmp/nec03v/original-source0-pack \
            --out /tmp/nec03v/original-activation-audit.json
      - name: Source-only coherent-group 32D physical preflight and separate auditor
        run: |
          python -m mechinterp.neuron_communities.nec03v_geometry preflight \
            --pack /tmp/nec03v/original-source0-pack \
            --out /tmp/nec03v/original-physical-preflight.json
          python -m mechinterp.neuron_communities.nec03v_independent_geometry_audit \
            --pack /tmp/nec03v/original-source0-pack \
            --preflight /tmp/nec03v/original-physical-preflight.json \
            --out /tmp/nec03v/original-physical-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/nec03v")
          source=json.loads((p/"original-source0-pack/extraction_receipt.json").read_text())
          coeff=json.loads((p/"original-activation-audit.json").read_text())
          phys=json.loads((p/"original-physical-audit.json").read_text())
          assert source["native_model_forward_calls"]==80
          assert coeff["independent_activation_audit_passed"]
          assert coeff["independent_source_only_native_forward_calls"]==80
          assert phys["geometry_audit_passed"] and phys["case_arm_records"]==512
          assert source["task_labels_accessed"] == coeff["task_labels_read"] == 0
          assert source["recruited_or_reserved_queries"]==0
          assert source["embargoed_or_confirmation_queries"]==0
          assert not source["behavioral_necessity_scoring"]
          print("NEC03V_REAL_SOURCE_ONLY_ROOT0_ACTIVATIONS_AND_PHYSICAL_QA_PASS",phys["arms"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nec03v-original-source0-positive-TopK-registered-and-independently-audited
          path: |
            /tmp/nec03v/original-source0-pack/manifest.json
            /tmp/nec03v/original-source0-pack/composed.json
            /tmp/nec03v/original-source0-pack/additive.json
            /tmp/nec03v/original-source0-pack/extraction_receipt.json
            /tmp/nec03v/original-activation-audit.json
            /tmp/nec03v/original-physical-preflight.json
            /tmp/nec03v/original-physical-audit.json
          if-no-files-found: error
          retention-days: 30
