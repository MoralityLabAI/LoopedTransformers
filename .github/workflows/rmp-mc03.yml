name: RMP MC-03
on:
  push:
    branches: ['research/rmp-mc03-trained-pilot']
    paths:
      - 'research_gym/scripts/mc03_trained_pilot.py'
      - 'tests/test_mc03_trained_pilot.py'
      - '.github/workflows/rmp-mc03.yml'
  pull_request:
    paths:
      - 'research_gym/scripts/mc03_trained_pilot.py'
      - 'tests/test_mc03_trained_pilot.py'
      - '.github/workflows/rmp-mc03.yml'
permissions:
  contents: read
concurrency:
  group: mc03-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  native-trained-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU dependencies
        run: |
          python -m pip install numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Existing and pilot tests
        run: |
          python -m unittest discover -s tests -p 'test_*certificate.py' -v
          python -O -m unittest discover -s tests -p 'test_*certificate.py' -v
          python -m unittest discover -s tests -p 'test_mc03_trained_pilot.py' -v
          python -O -m unittest discover -s tests -p 'test_mc03_trained_pilot.py' -v
      - name: Reproduce the fixed two-seed CPU pilot
        run: python -u -m research_gym.scripts.mc03_trained_pilot --out /tmp/mc03-trained
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc03-trained-evidence
          path: /tmp/mc03-trained
          if-no-files-found: error
