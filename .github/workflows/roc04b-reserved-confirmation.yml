name: ROC-04B one-shot reserved 384-permutation confirmation

# The 384 labels are first produced only after frozen registration f032c52.
# This workflow is source-locked to the twelve ROC04A checkpoints and
# uploads raw 4,608 per-case predictions plus an independent audit.
on:
  push:
    paths:
      - '.github/workflows/roc04b-reserved-confirmation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reserved-confirmation:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen CPU-only neural replay dependency
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m compileall -q research_gym/analysis/roc04b_*.py
      - name: Download the original ROC04A SHA-pinned 12-model artifact
        run: |
          mkdir -p /tmp/roc04a_checkpoint_archive
          gh run download 44085250022 \
            --name ROC04A-complete-6-seed-permutation-transfer-replay \
            --dir /tmp/roc04a_checkpoint_archive
          test -f /tmp/roc04a_checkpoint_archive/ROC04A_six_seed_permutation_transfer.zip
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          cfg=json.loads(Path('configs/roc04b_reserved_permutation_confirmation_v1.json').read_text())
          p=Path('/tmp/roc04a_checkpoint_archive/ROC04A_six_seed_permutation_transfer.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==cfg['parent_roc04a']['model_archive_sha256']
          with zipfile.ZipFile(p) as z:
              for seed,arms in cfg['frozen_model_weights_sha256'].items():
                  for arm,expected in arms.items():
                      assert len(expected)==64,(seed,arm,'truncated checkpoint checksum')
                      original=z.read(f'roc04_{arm}_S{seed}_step1920.pt')
                      assert hashlib.sha256(original).hexdigest()==expected,(seed,arm)
          print('Frozen archive SHA and all twelve exact model checkpoint SHA verified BEFORE ROC04B test generation')
          print('Original truncated seed1719 low checkpoint pin repaired in 2624b30, no model or criterion changed')
          PY
      - name: One-shot generate and evaluate 384 reserved rule permutations
        run: |
          python -m research_gym.analysis.roc04b_reserved_test \
            --config configs/roc04b_reserved_permutation_confirmation_v1.json \
            --roc04a-archive /tmp/roc04a_checkpoint_archive/ROC04A_six_seed_permutation_transfer.zip \
            --out-dir /tmp/roc04b_confirmed
      - name: Independent 4,608-row source and exact six-seed audit
        run: |
          python -m research_gym.analysis.roc04b_independent_audit \
            --result-dir /tmp/roc04b_confirmed \
            --out /tmp/roc04b_confirmed/ROC04B_INDEPENDENT_AUDIT.json
      - name: Produce complete source-and-checkpoint verified reproduction archive
        run: |
          python - <<'PY'
          import hashlib,json,zipfile,shutil
          from pathlib import Path
          root=Path('/tmp/roc04b_complete')
          root.mkdir(parents=True,exist_ok=True)
          for p in Path('/tmp/roc04b_confirmed').glob('*'):
              if p.is_file():shutil.copy2(p,root/p.name)
          parent=Path('/tmp/roc04a_checkpoint_archive/ROC04A_six_seed_permutation_transfer.zip')
          shutil.copy2(parent,root/'ROC04A_six_seed_permutation_transfer.zip')
          source=[
            'configs/roc04b_reserved_permutation_confirmation_v1.json',
            'configs/roc04_permutation_diversity_transfer_v1.json',
            'experiments/roc04_permutation_transfer/ROC04B_PROSPECTIVE_PROTOCOL.md',
            'research_gym/analysis/roc04b_reserved_test.py',
            'research_gym/analysis/roc04b_independent_audit.py',
            'research_gym/analysis/roc04_permutation_source.py',
            'research_gym/analysis/roc03b_query_table_memory.py',
            'research_gym/analysis/roc02_tied_train.py',
            'research_gym/analysis/roc02_delayed_rule_source.py',
          ]
          for name in source:
              p=Path(name);dest=root/p
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,dest)
          files=sorted(p for p in root.rglob('*') if p.is_file())
          manifest={'study':'ROC-04B-independent-384-permutation-confirmation',
                    'original_roc02_sealed_families_6_7_accessed':False,
                    'input_cases_generated_after_frozen_protocol':True,
                    'original_frozen_models':12,'test_source_records':384,
                    'files':[{'path':str(p.relative_to(root)),
                              'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                              'bytes':p.stat().st_size} for p in files]}
          (root/'ROC04B_REPRODUCIBILITY_MANIFEST.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          dest=Path('/tmp/ROC04B_reserved_384_confirmatory_replay.zip')
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  info=zipfile.ZipInfo(str(p.relative_to(root)),(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(info,p.read_bytes())
          print('ROC-04B complete archive SHA256',hashlib.sha256(dest.read_bytes()).hexdigest())
          print('SHA-indexed members',len(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ROC04B-independent-reserved-permutation-replay
          path: |
            /tmp/ROC04B_reserved_384_confirmatory_replay.zip
            /tmp/roc04b_confirmed/ROC04B_RESERVED_TEST_SUMMARY.json
            /tmp/roc04b_confirmed/ROC04B_INDEPENDENT_AUDIT.json
          retention-days: 90
