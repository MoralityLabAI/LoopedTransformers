name: Learned factor SAE cross-reference contracts
on:
  push:
    branches: [research/nanbeige-bpd-gym-suite-towers]
    paths: ['experiments/nan_xref17/**', '.github/workflows/nan-xref17-cpu.yml']
  pull_request:
    paths: ['experiments/nan_xref17/**', '.github/workflows/nan-xref17-cpu.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.26,<3'
      - run: python -B -m unittest discover -s experiments/nan_xref17/tests -v
      - run: python -B -S -c "from experiments.nan_xref17.common import verify; verify('git')"
