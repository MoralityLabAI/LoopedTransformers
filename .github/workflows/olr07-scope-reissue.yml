name: OLR-07 exact pre-command receipt reissue
on:
  push:
    branches: ['research/olr-obligation-ledger-20261123']
    paths:
      - 'research/lean_cgrt_hrm400/lean/Trace.lean'
      - 'research/lean_cgrt_hrm400/ppt_gym/olr07_reissue.py'
      - '.github/workflows/olr07-scope-reissue.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: olr07-reissue-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reissue:
    strategy:
      fail-fast: false
      matrix:
        kind: ['07a','07b']
    name: Native exact registry ${{ matrix.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: leanprover/lean4
          ref: 6caaee842e9495688c1567e78c0e68dbb96942aa
          path: lean4-source
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy
      - name: Retrieve original 07A archive
        if: matrix.kind == '07a'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }}/actions/artifacts/14890402416/zip > "$RUNNER_TEMP/original.zip"
      - name: Use original immutable 07B audit
        if: matrix.kind == '07b'
        run: cp research/lean_cgrt_hrm400/results/olr07b/olr07b-full_AUDIT.zip "$RUNNER_TEMP/original.zip"
      - name: Native self and future theorem visibility regression
        working-directory: research/lean_cgrt_hrm400
        run: python -m ppt_gym.olr07_reissue --source "${{ github.workspace }}/lean4-source" --out runs/scope-sentinel-${{ matrix.kind }} --sentinel-only
      - name: Reissue exact original registry, double native replay and paired counts
        working-directory: research/lean_cgrt_hrm400
        run: python -m ppt_gym.olr07_reissue --source "${{ github.workspace }}/lean4-source" --kind "${{ matrix.kind }}" --old "$RUNNER_TEMP/original.zip" --out runs/scope-reissue-${{ matrix.kind }} --workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olr07-scope-reissue-${{ matrix.kind }}
          path: |
            research/lean_cgrt_hrm400/runs/scope-sentinel-${{ matrix.kind }}
            research/lean_cgrt_hrm400/runs/scope-reissue-${{ matrix.kind }}
          if-no-files-found: ignore
