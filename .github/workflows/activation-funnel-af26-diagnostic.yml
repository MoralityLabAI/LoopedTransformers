name: AF-26 original-score parity diagnostic (no scientific scoring)
on:
  push:
    branches: [feat/activation-funnel-af26-stop-rule-factorial]
    paths:
      - 'experiments/activation_funnel_af26/PARITY_DIAG.json'
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact original AF25 CPU runtime
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Recover original seed29 AF23 checkpoint and AF25 episode traces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p originals
          curl --fail --location --show-error --retry 3             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14201501545/zip"             -o originals/af23-branch-seed-29.zip
          echo '040c48cb4b5e2e02e6b8419521e570a0d68f325bcc8c480c80669c5d57b7bd86  originals/af23-branch-seed-29.zip' | sha256sum -c -
          curl --fail --location --show-error --retry 3             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14207418176/zip"             -o originals/af25-seed-29-original.zip
          echo '28d82740b0c9b72d304fb236a4ca71919d839dc1deb2a1e787e489f93b282618  originals/af25-seed-29-original.zip' | sha256sum -c -
      - name: Compare original AF25 source policy per-state score margins
        run: |
          set -euo pipefail
          python -m experiments.activation_funnel_af26.diagnose_source_parity             --seed 29 --original-zip-dir originals             --af25-episode-zip originals/af25-seed-29-original.zip             --out af26_source_parity_seed29.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: af26-original-score-parity-diagnostic
          path: af26_source_parity_seed29.json
          retention-days: 60
