name: FC-04 calibrated recurrent halting (frozen training and test)

on:
  push:
    paths:
      - 'experiments/refutation_transfer/fc04_adaptive.py'
      - 'experiments/refutation_transfer/test_fc04_adaptive.py'
      - 'experiments/refutation_transfer/FC04_RESULTS.md'
      - '.github/workflows/refutation-fc04-adaptive.yml'
  pull_request:
    paths:
      - 'experiments/refutation_transfer/fc04_adaptive.py'
      - 'experiments/refutation_transfer/test_fc04_adaptive.py'
      - '.github/workflows/refutation-fc04-adaptive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      FC02_ROOT: ${{ github.workspace }}/_fc02_only
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout frozen model implementation
        uses: actions/checkout@v4
      - name: Checkout FC-02 training data, without access to FC-04
        uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/Compactification-Theory
          ref: 7aca2bc3fc5586c5b7997fba868bd179db761121
          path: _fc02_only
          persist-credentials: false
      - name: Check training source and test isolation
        run: |
          test "$(git -C "$FC02_ROOT" rev-parse HEAD)" = 7aca2bc3fc5586c5b7997fba868bd179db761121
          test ! -e "$FC02_ROOT/research/refutation_bench/fc04/generator.py"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Check frozen halting algorithm and exact release safety
        run: |
          python -m unittest discover -s experiments/refutation_transfer \
            -p 'test_fc04_adaptive.py' -v
      - name: Train tied weights and calibrate only on FC-02 development
        run: |
          python experiments/refutation_transfer/fc04_adaptive.py train \
            --fc02-root "$FC02_ROOT" \
            --out "$RUNNER_TEMP/fc04_weights"
      - name: Upload frozen checkpoints and chosen thresholds
        uses: actions/upload-artifact@v4
        with:
          name: fc04-weights-and-calibration
          path: ${{ runner.temp }}/fc04_weights/
          retention-days: 30
          if-no-files-found: error

  evaluate-frozen:
    needs: [train-calibrate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FC04_ROOT: ${{ github.workspace }}/_fc04_tests
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout frozen halting model implementation
        uses: actions/checkout@v4
      - name: Checkout FC-04 test generator after training completed
        uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/Compactification-Theory
          ref: 1b85412aa237d7522341c40d029654052e1d3267
          path: _fc04_tests
          persist-credentials: false
      - name: Assert frozen test generator SHA and preregistration
        run: |
          test "$(git -C "$FC04_ROOT" rev-parse HEAD)" = 1b85412aa237d7522341c40d029654052e1d3267
          test -f "$FC04_ROOT/research/refutation_bench/fc04/PREREGISTRATION.md"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned inference runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Download frozen model artifacts and validated threshold
        uses: actions/download-artifact@v4
        with:
          name: fc04-weights-and-calibration
          path: ${{ runner.temp }}/fc04_weights
      - name: Evaluate frozen stopping rule with actual early exit and checker time
        run: |
          python experiments/refutation_transfer/fc04_adaptive.py eval \
            --fc04-root "$FC04_ROOT" \
            --weights "$RUNNER_TEMP/fc04_weights" \
            --out "$RUNNER_TEMP/fc04_results"
      - name: Save complete per-case stopping traces and model score report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc04-selective-${{ github.run_id }}
          path: ${{ runner.temp }}/fc04_results/
          retention-days: 30
          if-no-files-found: warn
