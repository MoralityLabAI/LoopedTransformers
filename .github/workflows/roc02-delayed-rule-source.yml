name: ROC-02 delayed-rule exact source and sealed split gate

on:
  push:
    paths:
      - 'configs/roc02_delayed_rule_source_impl_v1.json'
      - 'research_gym/analysis/roc02_delayed_rule_source.py'
      - 'research_gym/analysis/roc02_dataset_archive.py research_gym/analysis/roc02_checkpoint_archive.py'
      - 'experiments/roc02_delayed_rule_v1/**'
      - 'tests/test_roc02_delayed_rule_source.py'
      - 'tests/test_roc02_dataset_archive.py'
      - '.github/workflows/roc02-delayed-rule-source.yml'
  pull_request:
    paths:
      - 'configs/roc02_delayed_rule_source_impl_v1.json'
      - 'research_gym/analysis/roc02_delayed_rule_source.py'
      - 'research_gym/analysis/roc02_dataset_archive.py'
      - 'experiments/roc02_delayed_rule_v1/**'
      - 'tests/test_roc02_delayed_rule_source.py'
      - 'tests/test_roc02_dataset_archive.py'
      - '.github/workflows/roc02-delayed-rule-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact oracle, sample-seal and binary case digests
        run: |
          python -m compileall -q research_gym/analysis/roc02_delayed_rule_source.py research_gym/analysis/roc02_dataset_archive.py research_gym/analysis/roc02_tied_train.py
          python -m unittest tests.test_roc02_delayed_rule_source tests.test_roc02_dataset_archive -v
          python -m unittest tests.test_roc02_checkpoint_archive -v
