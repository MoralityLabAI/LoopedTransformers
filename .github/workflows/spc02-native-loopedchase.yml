name: SPC-02 native LoopedChase periodic-proxy falsification smoke

on:
  push:
    paths:
      - 'experiments/spectral_state_cost_v0/native_phase_smoke.py'
      - 'experiments/spectral_state_cost_v0/phase_stability.py'
      - 'tests/test_phase_native_smoke.py'
      - '.github/workflows/spc02-native-loopedchase.yml'
  pull_request:
    paths:
      - 'experiments/spectral_state_cost_v0/native_phase_smoke.py'
      - 'experiments/spectral_state_cost_v0/phase_stability.py'
      - 'tests/test_phase_native_smoke.py'
      - '.github/workflows/spc02-native-loopedchase.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-cpu-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run native structural test and emit receipt
        run: |
          python -m unittest discover -s tests -p 'test_phase_native_smoke.py' -v
          python -m experiments.spectral_state_cost_v0.native_phase_smoke > spc02-native-receipt.json
          python -m json.tool spc02-native-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spc02-native-loopedchase-receipt
          path: spc02-native-receipt.json
          if-no-files-found: warn
