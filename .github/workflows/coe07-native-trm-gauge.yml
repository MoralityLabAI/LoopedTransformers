name: COE-07 native LoopScope phase-gauge validation
on:
  pull_request:
    paths:
      - 'mechinterp/phase_gauge07/**'
      - '.github/workflows/coe07-native-trm-gauge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
      - run: python -m unittest discover -s mechinterp/phase_gauge07 -p 'test_*.py' -v
  native-pretrained:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: exact-unit
    env:
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      HF_HUB_DOWNLOAD_TIMEOUT: 150
      HF_HUB_ETAG_TIMEOUT: 45
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only native inference dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'huggingface_hub>=0.30,<2'
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run SHA-pinned native TRM and eight-visit observer evaluation
        run: python -m mechinterp.phase_gauge07.run_native --threads 4 --out /tmp/coe07_native
      - name: Independent frozen-activation score replay
        run: python -m mechinterp.phase_gauge07.replay --input /tmp/coe07_native/native_activations.npz --receipt /tmp/coe07_native/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coe07-native-trm-verified-receipts
          path: /tmp/coe07_native/
          if-no-files-found: warn
