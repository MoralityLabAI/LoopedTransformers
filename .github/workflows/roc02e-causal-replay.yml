name: ROC-02E twelve-model matched causal replay and independent audit

on:
  push:
    paths:
      - 'research_gym/analysis/roc02e_*.py'
      - 'configs/roc02e_rule_vs_cue_causal_dev_v1.json'
      - 'experiments/roc02_delayed_rule_v1/roc02e_calibration/**'
      - '.github/workflows/roc02e-causal-replay.yml'
  pull_request:
    paths:
      - 'research_gym/analysis/roc02e_*.py'
      - 'configs/roc02e_rule_vs_cue_causal_dev_v1.json'
      - 'experiments/roc02_delayed_rule_v1/roc02e_calibration/**'
      - '.github/workflows/roc02e-causal-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-calibration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      ROC02E_ROOT: /tmp/roc02e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin CPU PyTorch and source-only checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m compileall -q research_gym/analysis/roc02e_matched_causal.py research_gym/analysis/roc02e_independent_audit.py
          python -m unittest discover -s tests -p 'test_roc02e_source_pairs.py' -v
      - name: Generate only original training and calibration files under frozen hashes
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from research_gym.analysis.roc02_delayed_rule_source import build_split
          root=Path(os.environ['ROC02E_ROOT'])/'original_models'/'data'
          root.mkdir(parents=True,exist_ok=True)
          m=json.loads(Path('experiments/roc02_delayed_rule_v1/source_manifest.json').read_text())
          for split in ('train','calibration'):
              rows=build_split(split)
              data=''.join(json.dumps(r,sort_keys=True,separators=(',',':'))+'\n' for r in rows).encode()
              expected=m['splits'][split]['file_sha256']
              assert hashlib.sha256(data).hexdigest()==expected,(split,'source hash mismatch')
              (root/f'{split}_inputs.jsonl').write_bytes(data)
              print(split,len(rows),expected)
          print('Sealed source-family inputs were neither generated nor read.')
          PY
      - name: Extract exact frozen twelve-model binary checkpoint receipts
        run: |
          python -m research_gym.analysis.roc02_checkpoint_archive \
            --archive-dir experiments/roc02_delayed_rule_v1/checkpoints \
            --index experiments/roc02_delayed_rule_v1/checkpoints/roc02_checkpoint_archive_index.json \
            --summary experiments/roc02_delayed_rule_v1/roc02_train_calibration_summary.json \
            --destination "$ROC02E_ROOT/original_models"
      - name: Replay all rank-7/8 observers and 256-case matched interventions
        run: |
          mkdir -p "$ROC02E_ROOT/results"
          set -eu
          for d in 8 16; do
            for s in 2026111601 2026111603 2026111607 2026111609 2026111613 2026111619; do
              echo "$d $s"
            done
          done | xargs -P 3 -n 2 bash -c '
            set -eu
            python -m research_gym.analysis.roc02e_matched_causal \
              --seed "$1" --depth "$0" \
              --source-dir "$ROC02E_ROOT/original_models" \
              --checkpoint-dir "$ROC02E_ROOT/original_models/checkpoints" \
              --receipt-file experiments/roc02_delayed_rule_v1/roc02c_calibration/roc02c_full_receipts.jsonl \
              --out-dir "$ROC02E_ROOT/results"'
          python -m research_gym.analysis.roc02e_matched_causal \
            --summarize --out-dir "$ROC02E_ROOT/results"
      - name: Audit all 516096 public per-case receipts independently
        run: |
          python -m research_gym.analysis.roc02e_independent_audit \
            --receipt-dir "$ROC02E_ROOT/results" \
            --out "$ROC02E_ROOT/results/roc02e_independent_audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['ROC02E_ROOT'])/'results'
          a=json.loads((out/'roc02e_independent_audit.json').read_text())
          assert a['total_per_case_rows']==516096
          assert a['primary_positive_seeds']==3
          assert a['primary_exact_six_sign_flip_p']==.375
          assert abs(a['primary_mean_joint_minus_task']-.0001414833510959094)<1e-8
          assert not a['sealed_test_evaluated']
          print('All 516096 rows and exact six-seed statistic PASS')
          PY
      - name: Write public manifest and archive source code
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROC02E_ROOT'])/'results'
          src=Path('research_gym/analysis')
          for name in ('roc02e_matched_causal.py','roc02e_independent_audit.py','roc02e_source_pairs.py'):
              (root/name).write_bytes((src/name).read_bytes())
          m={'study':'ROC-02E-calibration-only-256-paired-cases',
             'source_parent_pr':144,'protocol_pr':147,
             'source_families':[4,5],'sealed_test_evaluated':False,
             'files':[{'name':p.name,'bytes':p.stat().st_size,
                       'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                       for p in sorted(root.iterdir()) if p.is_file()]}
          (root/'ROC02E_ARTIFACT_MANIFEST.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          print('Manifested files:',len(m['files']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ROC02E-full-calibration-causal-replay
          path: /tmp/roc02e/results/
          retention-days: 30
