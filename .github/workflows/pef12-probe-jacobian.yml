name: PEF-12 frozen probe-Jacobian and Gaussian forecast invariants

on:
  pull_request:
    paths:
      - 'research/pef12/**'
      - '.github/workflows/pef12-probe-jacobian.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-jacobian-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      DNNL_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU neural test stack
        run: |
          python -m pip install pytest
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run model-independent and frozen-Jacobian tests
        run: python -m pytest research/pef12/test_pef12.py -q
      - name: Syntax verification
        run: python -m compileall -q research/pef12
