name: LS-SAE10 fixed-puzzle native replay forensics
on:
  pull_request:
    paths:
      - 'mechinterp/sae_causal_transfer/native_replay_v1/**'
      - '.github/workflows/mechinterp-ls-sae10-replay-forensics.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-exact-and-numeric-unit-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run source-registered numerical replay unit tests
        run: |
          python -m compileall -q mechinterp/sae_causal_transfer/native_replay_v1
          python -m unittest discover -s mechinterp/sae_causal_transfer/native_replay_v1 -p 'test_*.py' -v
      - name: Download exact original LS-SAE08 source-locked 16-puzzle native evidence
        uses: actions/download-artifact@v4
        with:
          name: ls-sae08-hard-52-54-native-all81-causal-evidence-and-audit
          run-id: 43851165980
          github-token: ${{ github.token }}
          path: runs/ls_sae10/original
      - name: Independent audit of original scientific FAIL and checksum
        run: |
          python -m mechinterp.sae_causal_transfer.native_hard_task_v2.audit --input runs/ls_sae10/original/full.json --out runs/ls_sae10/original/replayed-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: ls-sae10-original-LS-SAE08-fail-audit
          path: runs/ls_sae10/original/replayed-audit.json
          retention-days: 90
          if-no-files-found: error

  two-native-replay-sentinels:
    runs-on: ubuntu-latest
    needs: source-exact-and-numeric-unit-audit
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Original LS-SAE08 archived 81x9 logits and frozen 512D directions
        uses: actions/download-artifact@v4
        with:
          name: ls-sae08-hard-52-54-native-all81-causal-evidence-and-audit
          run-id: 43851165980
          github-token: ${{ github.token }}
          path: runs/ls_sae10/original
      - name: Historical forward twice, instrumented, and single-source-batch counterfactual
        run: |
          python -m mechinterp.sae_causal_transfer.native_replay_v1.run_native --baseline runs/ls_sae10/original/full.json --out runs/ls_sae10/two_sentinels.json
      - name: Independent stdlib original-versus-fresh full-81 signed logit audit
        run: |
          python -m mechinterp.sae_causal_transfer.native_replay_v1.audit --input runs/ls_sae10/two_sentinels.json --baseline runs/ls_sae10/original/full.json --out runs/ls_sae10/two_sentinels_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae10-2sentinel-archive-vs-native-drift-receipts-and-audit
          path: runs/ls_sae10/two_sentinels*.json
          if-no-files-found: warn
          retention-days: 90
