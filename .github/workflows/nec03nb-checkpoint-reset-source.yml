name: NEC-03N-B frozen 900 checkpoint with reset AdamW source-only calibration

on:
  push:
    branches: ['research/nec03nb-frozen900-reset-adam-20261121']
    paths:
      - '.github/workflows/nec03nb-checkpoint-reset-source.yml'
      - 'mechinterp/neuron_communities/NEC03NB_RESET_LOCK.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nec03nb-four-source-root-checkpoint-warm-reset
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  DNNL_MAX_CPU_ISA: AVX2
  PYTHONHASHSEED: '0'

jobs:
  registered-checkpoint-reset-source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source and CPU tensor test stack
        run: |
          python -m pip install pytest==8.4.2 networkx==3.4.2 numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify exact registered reset condition and both old source registries
        run: |
          python - <<'PY'
          from mechinterp.neuron_communities.nec03nb_checkpoint_reset import verify_lock
          from mechinterp.neuron_communities.nec03l_five_input_worlds import registration
          from mechinterp.neuron_communities.nec03g_worlds import registry
          r=verify_lock()
          assert r['original_five_input_registry_sha256']==registration()['registry_sha256']
          assert r['original_four_input_confirmation_spec_sha256']==registry()['confirmation_full_spec_sha256']
          assert r['optimizer_moments_reset_at_original_checkpoint']
          assert r['exact_900_retraining_replay_required'] is False
          assert r['original_four_input_confirmation_worlds_scored']==0
          print('NEC03NB_FROZEN_SOURCE_CHECKPOINT_RESET_RECIPE_AND_SEALS_VERIFIED')
          PY
          python -m pytest -q mechinterp/neuron_communities/test_nec03nb_checkpoint_reset.py
      - name: Validate source-only trainer and independent checker
        run: |
          python -m compileall -q mechinterp/neuron_communities/nec03nb_checkpoint_reset.py \
            mechinterp/neuron_communities/nec03nb_source_audit.py

  four-fixed-checkpoint-source-roots:
    needs: registered-checkpoint-reset-source-contracts
    strategy:
      fail-fast: false
      matrix:
        index: [0,1,2,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native model CPU stack
        run: |
          python -m pip install networkx==3.4.2 numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore original 900 frozen checkpoint/source receipts by immutable run ID
        uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44894980345
          name: nec03m-source-world-${{ matrix.index }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec03nb/original
      - name: Run exactly 900 source-training updates with reset AdamW from the old checkpoint
        timeout-minutes: 15
        run: |
          python -m mechinterp.neuron_communities.nec03nb_checkpoint_reset \
            --world-index ${{ matrix.index }} --old-root /tmp/nec03nb/original \
            --out /tmp/nec03nb/new
      - name: Independently audit original and new source models, full labels and sample stream
        timeout-minutes: 7
        run: |
          python -m mechinterp.neuron_communities.nec03nb_source_audit \
            --old-root /tmp/nec03nb/original --new-root /tmp/nec03nb/new
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('/tmp/nec03nb/new')
          r=json.loads((folder/'independent_warmstart_audit.json').read_text())
          assert r['two_native_models_audited']
          assert r['original_900_models_reused_as_immutable_anchored_weights']
          assert r['native_optimizer_moments_reset_at_900']
          assert not r['exact_continuous_1800_claim']
          assert r['five_input_development_evaluation_groups_scored']==0
          assert r['original_four_input_confirmation_worlds_scored']==0
          print('NEC03NB_SOURCE_CHECKPOINT_RESET_INDEPENDENTLY_AUDITED',r['world_id'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nec03nb-warm-source-root-${{ matrix.index }}
          path: /tmp/nec03nb/new/
          retention-days: 60
          if-no-files-found: warn

  independently-aggregate-source-competence:
    needs: four-fixed-checkpoint-source-roots
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve four checkpoint-anchored, source-only independently audited roots
        uses: actions/download-artifact@v4
        with:
          pattern: nec03nb-warm-source-root-*
          merge-multiple: false
          path: /tmp/nec03nb/roots
      - name: Verify four distinct five-input roots and both original source/confirmation seals
        run: |
          python -m mechinterp.neuron_communities.nec03nb_source_audit \
            --roots /tmp/nec03nb/roots --out /tmp/nec03nb/summary
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/nec03nb/summary/nec03nb_four_root_fixed_reset_900_vs_1800.json').read_text())
          assert r['number_of_five_input_world_roots']==4
          assert r['native_model_arms']==8
          assert r['original_step900_native_models_verified']==8
          assert r['additional_updates_per_arm']==900
          assert r['new_optimizer_moments_reset_at_original900']
          assert r['exact_continuous1800_claim'] is False
          assert r['new_SAE_dictionaries_trained']==0
          assert r['development_evaluation_worlds_scored']==0
          assert r['original_four_input_confirmation_worlds_scored']==0
          assert r['scientific_gate']=='REDESIGN_OR_PILOT_ONLY'
          print('NEC03NB_FOUR_ROOT_IN_SAMPLE_SOURCE_RESET_SUMMARY_AUDITED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nec03nb-four-source-worlds-frozen900-resetAdamW-900
          path: /tmp/nec03nb/summary/
          retention-days: 60
          if-no-files-found: warn
