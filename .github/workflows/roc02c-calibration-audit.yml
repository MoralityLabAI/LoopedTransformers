name: ROC-02C equal-budget calibration receipts

on:
  push:
    paths:
      - 'configs/roc02c_calibration_equal_budget_v1.json'
      - 'research_gym/analysis/roc02c_*.py'
      - 'experiments/roc02_delayed_rule_v1/roc02c_calibration/**'
      - 'tests/test_roc02c_*.py'
      - '.github/workflows/roc02c-calibration-audit.yml'
  pull_request:
    paths:
      - 'configs/roc02c_calibration_equal_budget_v1.json'
      - 'research_gym/analysis/roc02c_*.py'
      - 'experiments/roc02_delayed_rule_v1/roc02c_calibration/**'
      - 'tests/test_roc02c_*.py'
      - '.github/workflows/roc02c-calibration-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source syntax and all twelve raw receipts
        run: |
          python -m compileall -q research_gym/analysis/roc02c_equal_budget.py research_gym/analysis/roc02c_summarize.py
          python -m unittest tests.test_roc02c_public -v
