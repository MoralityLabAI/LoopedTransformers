name: RAM-04 CPU train-only Lean gym and fresh-family evaluation

on:
  push:
    paths:
      - '.github/workflows/lean-ram04-prospective.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  LEAN_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
  PYTHONPATH: ${{ github.workspace }}/_ram04_gym
  RAM04_CONFIG: experiments/lean_ram04/config.json

jobs:
  train-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned research source
        uses: actions/checkout@v4
        with:
          repository: patrickdugan/MathCan
          ref: c84e2025334e9a967c1297425a490f98d5b3d189
          path: _mathcan
          persist-credentials: false
      - name: Checkout pinned original FC12 gym
        uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/Compactification-Theory
          ref: e8a780254b5cf41d479095f4f22bcfc4aa76ed72
          path: _ram04_gym
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch, process memory monitor, Lean4.35
        run: |
          python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check psutil==7.1.3
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o /tmp/lean435.tar.zst
          tar --zstd -xf /tmp/lean435.tar.zst -C /tmp
          echo /tmp/lean-4.35.0-linux/bin >> "$GITHUB_PATH"
      - name: Build immutable MathCan dependencies and persistent Lean prover
        run: |
          test "$(git -C _mathcan rev-parse HEAD)" = c84e2025334e9a967c1297425a490f98d5b3d189
          test "$(git -C _ram04_gym rev-parse HEAD)" = e8a780254b5cf41d479095f4f22bcfc4aa76ed72
          (cd _mathcan && lake build MathCan)
          echo "LEAN_PATH=$GITHUB_WORKSPACE/experiments/lean_ram03:$(cd _mathcan && lake env printenv LEAN_PATH)" >> "$GITHUB_ENV"
          export LEAN_PATH="$GITHUB_WORKSPACE/experiments/lean_ram03:$(cd _mathcan && lake env printenv LEAN_PATH)"
          lean experiments/lean_ram03/ProbeServer.lean -o experiments/lean_ram03/ProbeServer.olean
      - name: Freeze source families and run prospective contract tests
        run: |
          python -m unittest discover -s experiments/lean_ram04 -p 'test_*.py' -v
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          f=Path('experiments/lean_ram04/config.json')
          x=json.loads(f.read_text())
          assert x['registration']=='ae7be99b6367434f0dd724ae232cfa218ed99342'
          assert len(x['prospective'])==4 and sum(map(len,x['prospective'].values()))==12
          print('RAM04_TRAIN_FREEZE_CONFIG_SHA256',hashlib.sha256(f.read_bytes()).hexdigest())
          PY
      - name: Download exact FC12 train-only original Lean compiler evidence
        uses: actions/download-artifact@v4
        with:
          name: fc12-frozen-typed-lean-models
          run-id: 43547762837
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/ram04_original_fc12/
      - name: Verify immutable source-state SHA and original trained-label artifact
        run: |
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'ram04_original_fc12'
          assert hashlib.sha256((root/'train_source/actual_goal_states.jsonl').read_bytes()).hexdigest()=='403331aba9c9f127f6ac169bb8b732de8a7b56e934f6cb78b4375d1c59732bf0'
          assert (root/'train_probes/train_candidate_outcomes.jsonl').is_file()
          print('RAM04_REAL_LEAN_TRAIN_INPUT_VERIFIED')
          PY
      - name: Collect the original 27 train roots and independently replay every real Lean candidate
        run: |
          python experiments/lean_ram03/collect.py \
            --data "$RUNNER_TEMP/ram04_original_fc12" --mathcan _mathcan \
            --lean lean --config "$RAM04_CONFIG" --out "$RUNNER_TEMP/ram04_data"
      - name: Fit original recurrent and flat architectures from audited train-only states
        run: |
          python experiments/lean_ram03/train_local.py \
            --data "$RUNNER_TEMP/ram04_data" --config "$RAM04_CONFIG" \
            --out "$RUNNER_TEMP/ram04_weights"
      - name: Audit 9 frozen checkpoints, compiler effect labels and train-only split
        run: |
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])
          report=json.loads((p/'ram04_weights/training_report.json').read_text())
          audit=json.loads((p/'ram04_data/independent_audit.json').read_text())
          assert report['status']=='complete' and len(report['models'])==9
          assert audit['status']=='passed'
          assert audit['checked']==len((p/'ram04_data/transitions.jsonl').read_text().splitlines())
          assert set(report['selected'])=={'loop32','loop64','flat64'}
          for r in report['models']:
              f=Path(r['checkpoint'])
              assert hashlib.sha256(f.read_bytes()).hexdigest()==r['checkpoint_sha256']
          print('RAM04_TRAIN_FROZEN',json.dumps({k:{'seed':v['seed'],'sha256':v['checkpoint_sha256']} for k,v in report['selected'].items()},sort_keys=True))
          PY
      - name: Stage immutable trained CPU checkpoints and independently audited data
        run: |
          mkdir -p "$RUNNER_TEMP/ram04_bundle/data" "$RUNNER_TEMP/ram04_bundle/training"
          cp "$RUNNER_TEMP/ram04_data/transitions.jsonl" "$RUNNER_TEMP/ram04_bundle/data/"
          cp "$RUNNER_TEMP/ram04_data/independent_audit.json" "$RUNNER_TEMP/ram04_bundle/data/"
          cp "$RUNNER_TEMP/ram04_data/collection_report.json" "$RUNNER_TEMP/ram04_bundle/data/"
          cp -a "$RUNNER_TEMP/ram04_weights/." "$RUNNER_TEMP/ram04_bundle/training/"
      - name: Upload frozen weights and observed labels before any heldout evaluation
        uses: actions/upload-artifact@v4
        with:
          name: ram04-frozen-audited-train-${{ github.run_id }}
          path: ${{ runner.temp }}/ram04_bundle/
          retention-days: 30
          if-no-files-found: error
      - name: Preserve all partial/failed collection evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ram04-training-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ram04_data/
            ${{ runner.temp }}/ram04_weights/
          retention-days: 30
          if-no-files-found: warn

  test-fresh-family:
    needs: train-only
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: patrickdugan/MathCan
          ref: c84e2025334e9a967c1297425a490f98d5b3d189
          path: _mathcan
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/Compactification-Theory
          ref: e8a780254b5cf41d479095f4f22bcfc4aa76ed72
          path: _ram04_gym
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch and original Lean4.35
        run: |
          python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check psutil==7.1.3
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o /tmp/lean435.tar.zst
          tar --zstd -xf /tmp/lean435.tar.zst -C /tmp
          echo /tmp/lean-4.35.0-linux/bin >> "$GITHUB_PATH"
      - name: Build source proof context and persistent Lean server
        run: |
          (cd _mathcan && lake build MathCan)
          echo "LEAN_PATH=$GITHUB_WORKSPACE/experiments/lean_ram03:$(cd _mathcan && lake env printenv LEAN_PATH)" >> "$GITHUB_ENV"
          export LEAN_PATH="$GITHUB_WORKSPACE/experiments/lean_ram03:$(cd _mathcan && lake env printenv LEAN_PATH)"
          lean experiments/lean_ram03/ProbeServer.lean -o experiments/lean_ram03/ProbeServer.olean
      - name: Download frozen pretest training checkpoints and labels
        uses: actions/download-artifact@v4
        with:
          name: ram04-frozen-audited-train-${{ github.run_id }}
          path: ${{ runner.temp }}/ram04_frozen/
      - name: Verify nine checkpoint hashes prior to opening any original test theorem
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'ram04_frozen/training'
          r=json.loads((p/'training_report.json').read_text())
          assert r['status']=='complete' and len(r['models'])==9
          for row in r['models']:
              f=p/f"{row['name']}_s{row['seed']}"/'best.pt'
              assert hashlib.sha256(f.read_bytes()).hexdigest()==row['checkpoint_sha256']
          print('RAM04_NINE_IMMUTABLE_CPU_CHECKPOINTS_VERIFIED')
          PY
      - name: Run prospective original-Lean source-family transfer with strict native control
        run: |
          python experiments/lean_ram04/evaluate.py \
            --mathcan _mathcan --data "$RUNNER_TEMP/ram04_frozen/data" \
            --training "$RUNNER_TEMP/ram04_frozen/training" \
            --config "$RAM04_CONFIG" --lean lean \
            --out "$RUNNER_TEMP/ram04_prospective"
      - name: Independently recompile every accepted source certificate and audit all policy cases
        run: |
          python experiments/lean_ram04/audit_results.py \
            --results "$RUNNER_TEMP/ram04_prospective" \
            --lean lean --out "$RUNNER_TEMP/ram04_audit"
      - name: Preserve every original script, compiler response, time and replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ram04-first-prospective-evaluation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ram04_prospective/
            ${{ runner.temp }}/ram04_audit/
          retention-days: 30
          if-no-files-found: warn
