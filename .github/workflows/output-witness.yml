name: Exact output witness controls
on:
  pull_request:
    paths:
      - 'research_gym/scripts/loopscope_output_witness.py'
      - 'tests/test_loopscope_output_witness.py'
      - '.github/workflows/output-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: output-witness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU-only validation dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Native-checkout controls
        run: python -m unittest discover -s tests -p 'test_loopscope_output_witness.py' -v
      - name: Controls with Python assertions disabled
        run: python -O -m unittest discover -s tests -p 'test_loopscope_output_witness.py' -v
      - name: Untrained integration smoke only
        run: python -m research_gym.scripts.loopscope_output_witness --smoke --items 8 --max-loops 12 --horizon 3 --random-controls 2 --out /tmp/output-witness-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-witness-engineering-only
          path: /tmp/output-witness-smoke/
          if-no-files-found: ignore
