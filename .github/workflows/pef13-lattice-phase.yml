name: PEF-13 frozen lattice phase invariants

on:
  pull_request:
    paths:
      - 'research/pef13/**'
      - '.github/workflows/pef13-lattice-phase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-aware-algebra-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      DNNL_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install pytest
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify deterministic lattice and phase forecast invariants
        run: python -m pytest -q research/pef13/test_pef13.py
      - name: Verify source syntax
        run: python -m compileall -q research/pef13
