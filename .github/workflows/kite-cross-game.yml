name: KITE native cross-game adapters
on:
  pull_request:
    paths:
      - 'research_gym/benchmarks/kite01/cross_game/**'
      - '.github/workflows/kite-cross-game.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diplomacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: looped
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/AI_Diplomacy
          ref: 0bdf7428d1b273da30ea4b7b916efb3a08fc5ebc
          path: diplomacy-native
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native engine dependencies
        run: python -m pip install coloredlogs bcrypt tornado pytz python-dateutil ujson tqdm
      - name: Synthetic checker admission
        run: |
          node looped/research_gym/benchmarks/kite01/cross_game/test_report.mjs
          node looped/research_gym/benchmarks/kite01/cross_game/test_sparse_joint.mjs
      - name: Native counterfactual adjudication
        working-directory: diplomacy-native
        run: |
          PYTHONPATH="$PWD" python ../looped/research_gym/benchmarks/kite01/cross_game/export_diplomacy.py --out ../dip-roots.json --cap 4
      - name: Exact certificate evaluation
        run: node looped/research_gym/benchmarks/kite01/cross_game/report.mjs dip-roots.json dip-report.json
      - name: Plan seven-player mixed frontier
        run: node looped/research_gym/benchmarks/kite01/cross_game/native_joint.mjs plan dip-roots.json dip-report.json dip-joint-plan.json
      - name: Adjudicate mixed frontier
        working-directory: diplomacy-native
        run: PYTHONPATH="$PWD" python ../looped/research_gym/benchmarks/kite01/cross_game/export_joint_diplomacy.py ../dip-joint-plan.json ../dip-joint-cells.json
      - name: Certify seven-player mixed regret
        run: node looped/research_gym/benchmarks/kite01/cross_game/native_joint.mjs audit dip-joint-plan.json dip-joint-cells.json dip-joint-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kite-native-diplomacy
          path: |
            dip-roots.json
            dip-report.json
            dip-joint-*.json
  theysing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: looped
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/TheySing
          ref: 0879110e12d66a584f89a8696a7292d5fa0dfb1c
          path: theysing-native
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build native TypeScript harness
        working-directory: theysing-native
        run: |
          npm ci --ignore-scripts
          npm run build:harness
      - name: Synthetic checker admission
        run: |
          node looped/research_gym/benchmarks/kite01/cross_game/test_report.mjs
          node looped/research_gym/benchmarks/kite01/cross_game/test_sparse_joint.mjs
      - name: Native counterfactual adjudication
        run: node looped/research_gym/benchmarks/kite01/cross_game/export_theysing.cjs theysing-native/dist-harness/engine/TheySingEngine.js sing-roots.json
      - name: Exact certificate evaluation
        run: node looped/research_gym/benchmarks/kite01/cross_game/report.mjs sing-roots.json sing-report.json
      - name: Plan seven-player mixed frontier
        run: node looped/research_gym/benchmarks/kite01/cross_game/native_joint.mjs plan sing-roots.json sing-report.json sing-joint-plan.json
      - name: Adjudicate mixed frontier
        run: node looped/research_gym/benchmarks/kite01/cross_game/export_joint_theysing.cjs theysing-native/dist-harness/engine/TheySingEngine.js sing-joint-plan.json sing-joint-cells.json
      - name: Certify seven-player mixed regret
        run: node looped/research_gym/benchmarks/kite01/cross_game/native_joint.mjs audit sing-joint-plan.json sing-joint-cells.json sing-joint-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kite-native-theysing
          path: |
            sing-roots.json
            sing-report.json
            sing-joint-*.json
