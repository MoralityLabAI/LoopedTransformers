name: AUX-GYM V2 native BPD engineering
on:
  pull_request:
    paths:
      - 'research_gym/interp/aux_gym_v2_native_bpd.py'
      - '.github/workflows/aux-gym-v2-native-bpd.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-bpd-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/BPD
          ref: 722613a80d80af0e80bb9f5ac1ce83eef111e4f7
          path: .native-bpd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy
      - name: Tiny independent teacher
        run: |
          python -m research_gym.interp.aux_gym_v2 build --out /tmp/aux-native/data --seed 2026112697 --train-quota 2 --eval-quota 1
          python -m research_gym.interp.aux_gym_v2 pilot --data /tmp/aux-native/data --out /tmp/aux-native/teacher --family modular_recurrence --arm LOOP-T --mode symbolic_trace --seed 1 --steps 8 --batch 8 --threads 2
      - name: Native behavioral factor fit
        run: python -m research_gym.interp.aux_gym_v2_native_bpd --bpd-checkout .native-bpd --data /tmp/aux-native/data --run /tmp/aux-native/teacher --out /tmp/aux-native/factors --seed 1 --components 8 --steps 2 --warmup 1 --batch 2 --smoke-no-null
      - name: Warm-start with native factor span
        run: python -m research_gym.interp.aux_gym_v2_memory train --data /tmp/aux-native/data --init-run /tmp/aux-native/teacher --factor-dir /tmp/aux-native/factors --family modular_recurrence --out /tmp/aux-native/memory --mode native_memory --mib 4 --rank 4 --seed 1 --steps 8 --batch 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aux-gym-v2-native-bpd-smoke
          path: /tmp/aux-native
          if-no-files-found: warn
