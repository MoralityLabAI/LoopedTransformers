name: Full development gym source and trace contracts
on:
  push:
    branches: [research/nanbeige-bpd-gym-suite-towers]
    paths: ['experiments/nan_full26/**', '.github/workflows/nan-full26-cpu.yml']
  pull_request:
    paths: ['experiments/nan_full26/**', '.github/workflows/nan-full26-cpu.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -S -m unittest discover -s experiments/nan_full26/tests -v
      - run: python -B -S -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('experiments/nan_full26').rglob('*.py')]"
