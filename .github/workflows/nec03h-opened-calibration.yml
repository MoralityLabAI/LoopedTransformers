name: NEC-03H opened-root fixed-900 competency and source-site calibration

on:
  push:
    branches: ['research/nec03h-source-fallback-900-20261121']
    paths:
      - '.github/workflows/nec03h-opened-calibration.yml'
      - 'mechinterp/neuron_communities/nec03h_engine.py'
      - 'mechinterp/neuron_communities/nec03h_calibration_audit.py'
      - 'mechinterp/neuron_communities/test_nec03h_engine.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nec03h-calibrate-opened-20261121
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  DNNL_MAX_CPU_ISA: AVX2

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test and CPU neural stack
        run: |
          python -m pip install pytest==8.4.2 networkx==3.4.2 numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test site-selection source provenance, 900-step stream and unopened-world refusal
        run: |
          python -m pytest -q \
            mechinterp/neuron_communities/test_nec03h_engine.py \
            mechinterp/neuron_communities/test_nec03g_worlds.py
      - name: Two-step engine smoke is excluded from statistical calibration
        run: |
          python -m mechinterp.neuron_communities.nec03h_engine \
            --development-world-index 0 --steps 2 --out /tmp/nec03h/smoke
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/nec03h/smoke')
          z=json.loads((root/'calibration.json').read_text())
          assert not z['full_calibration_recipe']
          assert z['training_steps']==2
          assert z['new_development_worlds_evaluated']==0
          assert z['confirmation_worlds_trained_or_scored']==0
          print('NEC03H_ENGINEERING_ONLY',z['world_id'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nec03h-opened-two-step-engineering-smoke
          path: /tmp/nec03h/smoke/
          if-no-files-found: warn

  calibrate:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        index: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned reproducible CPU stack
        run: |
          python -m pip install networkx==3.4.2 numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Recover original, already opened NEC-03G 450-step root evidence
        uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44870543545
          name: nec03g-development-root-${{ matrix.index }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec03h/original
      - name: Train both teacher models for exactly 900 updates from original seed
        run: |
          python -m mechinterp.neuron_communities.nec03h_engine \
            --development-world-index ${{ matrix.index }} --steps 900 \
            --out /tmp/nec03h/new
      - name: Independently verify old source, new frozen models, fallback and accuracy
        run: |
          python - <<'PY'
          from pathlib import Path
          from mechinterp.neuron_communities.nec03h_calibration_audit import audit_calibration
          r=audit_calibration(Path('/tmp/nec03h/new'),Path('/tmp/nec03h/original'))
          assert r['confirmation_worlds_scored']==0
          assert r['full_900_steps_from_original_seed']
          print('NEC03H_OPENED_ROOT_900_VERIFIED',r['world_id'],r['arms'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nec03h-calibration-${{ matrix.index }}
          path: /tmp/nec03h/new/
          retention-days: 45
          if-no-files-found: warn

  aggregate-calibration:
    needs: calibrate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore eight 900-step development-world artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nec03h-calibration-*
          merge-multiple: false
          path: /tmp/nec03h/900
      - name: Restore eight original untouched NEC-03G 450-step world artifacts
        uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44870543545
          pattern: nec03g-development-root-*
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: false
          path: /tmp/nec03h/450
      - name: Independently compare all paired 450-vs-900 clean competence and source-site coverage
        run: |
          python -m mechinterp.neuron_communities.nec03h_calibration_audit \
            --root /tmp/nec03h/900 --original /tmp/nec03h/450 \
            --out /tmp/nec03h/summary
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/nec03h/summary/opened_world_calibration_450_vs_900.json').read_text())
          assert len(z['worlds'])==8
          assert z['new_from_seed_900_world_count']==8
          assert z['new_development_worlds_scored']==0
          assert z['confirmation_worlds_trained_or_scored']==0
          print('NEC03H_CALIBRATION',z['models_above_clean_90pct_450'],
                z['models_above_clean_90pct_900'],
                z['models_using_fallback_900'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nec03h-opened-eight-world-450-vs-900-competence-and-selection
          path: /tmp/nec03h/summary/
          retention-days: 60
          if-no-files-found: warn
