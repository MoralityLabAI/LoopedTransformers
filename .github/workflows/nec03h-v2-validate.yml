name: NEC-03H-v2 source/primary admission validation (no new worlds)

on:
  push:
    branches: ['research/nec03h-source-fallback-900-20261121']
    paths:
      - '.github/workflows/nec03h-v2-validate.yml'
      - 'mechinterp/neuron_communities/nec03h_development.py'
      - 'mechinterp/neuron_communities/nec03h_audit.py'
      - 'mechinterp/neuron_communities/nec03h_preflight.py'
      - 'mechinterp/neuron_communities/test_nec03h_development.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-no-new-world-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      DNNL_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact CPU test stack
        run: |
          python -m pip install pytest==8.4.2 networkx==3.4.2 numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax validate complete source-runner/independent audit
        run: |
          python -m compileall -q mechinterp/neuron_communities/nec03h_engine.py \
            mechinterp/neuron_communities/nec03h_development.py \
            mechinterp/neuron_communities/nec03h_audit.py \
            mechinterp/neuron_communities/nec03h_preflight.py
      - name: V2 primary, native null, additive and confirmation hard-stop unit tests
        run: |
          python -m pytest -q \
            mechinterp/neuron_communities/test_nec03h_engine.py \
            mechinterp/neuron_communities/test_nec03h_development.py \
            mechinterp/neuron_communities/test_nec03g_worlds.py
      - name: Verify all 64 confirmation world-spec SHA256 commitments unchanged
        run: |
          python - <<'PY'
          from mechinterp.neuron_communities.nec03g_worlds import registry
          r=registry()
          assert r['registry_sha256']=='8816304a7db020bd0ad016acca7d9195dfd4633e3316a17bd8e4b8e912fd25b4'
          assert r['confirmation_full_spec_sha256']=='670ea6e1bb4fe86ab9691d0af4800d5623fe64e489ca7555561a80c9739f1f39'
          assert len(r['confirmation_commitments'])==64
          assert not r['confirmation_outcomes_exposed']
          print('NEC03H_V2_CONFIRM_WORLD_SPECS_SEALED',len(r['confirmation_commitments']))
          PY
