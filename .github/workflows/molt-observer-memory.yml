name: MOLT-07 observer memory
on:
  pull_request:
    paths:
      - 'lsa/observable_memory.py'
      - 'experiments/molt_goblin_v1/mms_observer.py'
      - 'tests/test_observable_memory.py'
      - '.github/workflows/molt-observer-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observer-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_observable_memory.py
      - run: python -m experiments.molt_goblin_v1.mms_observer --out /tmp/molt07.json
      - uses: actions/upload-artifact@v4
        with:
          name: molt07-observer-memory
          path: /tmp/molt07.json
          retention-days: 7
