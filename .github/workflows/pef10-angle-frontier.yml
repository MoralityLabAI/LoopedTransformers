name: PEF-10 ablation-angle frontier CPU invariants

on:
  pull_request:
    paths:
      - 'research/pef10/**'
      - '.github/workflows/pef10-angle-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pef10-algebra-and-split-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      DNNL_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install pytest
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify fixed angle protocol and ungated projector algebra
        run: python -m pytest -q research/pef10/test_pef10.py
      - name: Verify source syntax
        run: python -m compileall -q research/pef10
