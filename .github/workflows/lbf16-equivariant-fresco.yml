name: LBF-16 S6-equivariant horizon-separated meeting fresco
on:
  pull_request:
    paths:
      - "research/lite_braille_fresco/lbf16_equivariant_fresco.py"
      - "research/lite_braille_fresco/tests/test_lbf16_equivariant_fresco.py"
      - "research/lite_braille_fresco/LBF_16_EQUIVARIANT_FRESCO_REGISTRATION.md"
      - ".github/workflows/lbf16-equivariant-fresco.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lbf16-equivariant-fresco-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
      LBF14_UPSTREAM: "../../_lbf16_pinned_lsa02k/research/lean_cgrt_hrm400/ppt_gym/rewrite_gym.py"
      LBF13_UPSTREAM: "../../_lbf16_pinned_lsa02k/research/lean_cgrt_hrm400/ppt_gym/rewrite_gym.py"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: cd9ac784c5804ec2fe595bb6a01d2697fc016610
          path: _lbf16_pinned_lsa02k
          sparse-checkout: research/lean_cgrt_hrm400/ppt_gym/rewrite_gym.py
          sparse-checkout-cone-mode: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Equivariance, support sparsity, and fresco contract tests
        working-directory: research/lite_braille_fresco
        run: |
          test "$(git -C ../../_lbf16_pinned_lsa02k rev-parse HEAD)" = cd9ac784c5804ec2fe595bb6a01d2697fc016610
          python -m compileall -q lbf16_equivariant_fresco.py tests/test_lbf16_equivariant_fresco.py
          python -m unittest discover -s tests -v
      - name: Native-certified LBF-16 equivariant meeting fresco campaign
        working-directory: research/lite_braille_fresco
        run: python lbf16_equivariant_fresco.py --upstream "$LBF14_UPSTREAM" --out runs/lbf16-equivariant --threads 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbf16-equivariant-fresco
          path: |
            research/lite_braille_fresco/runs/lbf16-equivariant/
            !research/lite_braille_fresco/runs/lbf16-equivariant/suite/ordinary.jsonl
            !research/lite_braille_fresco/runs/lbf16-equivariant/suite/ood.jsonl
          retention-days: 14
          if-no-files-found: warn
