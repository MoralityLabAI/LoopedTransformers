name: RAM-16 private 23-family frozen policy evaluation contracts
on:
  push:
    paths: ['.github/workflows/ram16-source-model-eval-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-source-scoring-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install same CPU-only inference and original resource packages
        run: |
          python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check psutil==7.1.3 numpy==2.1.3
      - name: Preflight original 23-row policy scorer and source-only proof contracts
        run: |
          python -m unittest discover -s experiments/lean_ram16 -p 'test_evaluation.py' -v
          python -m py_compile experiments/lean_ram16/{eval_grammar,harness,run_case,independent_audit}.py
