name: NEC-03G fresh Boolean-world development CPU and EvalMath preflight

on:
  push:
    branches: ['research/nec03g-fresh-worlds-preflight-20261121']
    paths:
      - '.github/workflows/nec03g-development-pilot.yml'
      - 'mechinterp/neuron_communities/nec03g_worlds.py'
      - 'mechinterp/neuron_communities/nec03g_development.py'
      - 'mechinterp/neuron_communities/nec03g_audit.py'
      - 'mechinterp/neuron_communities/test_nec03g_development.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nec03g-development-20261121
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  DNNL_MAX_CPU_ISA: AVX2

jobs:
  engineering-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU-only stack
        run: |
          python -m pip install pytest==8.4.2 networkx==3.4.2 numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test new-world spec, source seal, native training and plan gates
        run: |
          python -m pytest -q \
            mechinterp/neuron_communities/test_nec03g_worlds.py \
            mechinterp/neuron_communities/test_nec03g_development.py
      - name: Two-step source-only smoke, prohibited from power inference
        run: |
          python -m mechinterp.neuron_communities.nec03g_development \
            --development-world-index 0 --out /tmp/nec03g/smoke \
            --trunk-steps 2 --sae-steps 2
          python -m mechinterp.neuron_communities.nec03g_audit \
            --folder /tmp/nec03g/smoke
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('/tmp/nec03g/smoke/root_summary.json').read_text())
          assert r['full_registered_development_recipe'] is False
          assert r['original_confirmation_worlds_evaluated']==0
          assert r['world_reserved_context_groups_evaluated']==0
          print('NEC03G_TWO_STEP_ENGINEERING_ONLY',r['world_id'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nec03g-engineering-smoke
          path: /tmp/nec03g/smoke/
          if-no-files-found: warn

  fresh-development-roots:
    needs: engineering-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        index: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU stack
        run: |
          python -m pip install networkx==3.4.2 numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Train distinct native model and additive control, then source SAE and causal pilot
        run: |
          python -m mechinterp.neuron_communities.nec03g_development \
            --development-world-index ${{ matrix.index }} --out /tmp/nec03g/root
      - name: Independent teacher, 16-state outcome and physical dose audit
        run: |
          python -m mechinterp.neuron_communities.nec03g_audit \
            --folder /tmp/nec03g/root
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/nec03g/root')
          r=json.loads((root/'root_summary.json').read_text())
          a=json.loads((root/'independent_source_audit.json').read_text())
          assert r['full_registered_development_recipe']
          assert r['original_confirmation_worlds_evaluated']==0
          assert r['world_reserved_context_groups_evaluated']==0
          assert a['confirmation_cohort_still_unopened']
          assert a['full_registered_development_recipe']
          print('NEC03G_FRESH_WORLD_AUDITED',r['world_id'],r['primary_effect']['root_primary_effect'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nec03g-development-root-${{ matrix.index }}
          path: /tmp/nec03g/root/
          retention-days: 30
          if-no-files-found: warn

  evalmath-mechanistic-resolution:
    needs: fresh-development-roots
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/EvalMath
          ref: 9708f1edaf1cb25904b88b07c3f23c1899df7cac
          path: evalmath-pinned
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve all eight disjoint full-recipe development-world artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nec03g-development-root-*
          path: /tmp/nec03g/roots
          merge-multiple: false
      - name: Independently verify eight roots, their source audits and unopened confirmation cohort
        run: |
          python -m mechinterp.neuron_communities.nec03g_preflight \
            --root /tmp/nec03g/roots --out /tmp/nec03g/preflight
      - name: Run pinned EvalMath mechanistic-resolution preflight, treating redesign verdict as a valid outcome
        run: |
          set +e
          python evalmath-pinned/skills/evalmath-mechinterp-power/scripts/preflight.py \
            --pilot /tmp/nec03g/preflight/evalmath_development_pilot.json \
            --out /tmp/nec03g/preflight/evalmath_verdict.json --strict
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/nec03g/preflight')
          result=json.loads((root/'evalmath_verdict.json').read_text())
          source=json.loads((root/'pilot_aggregation.json').read_text())
          assert result['pilot_worlds']==8
          assert result['planned_confirmation_worlds']==64
          assert source['confirmation_worlds_scored']==0
          assert source['confirmatory_test_authorized'] is False
          # With only 8 sham worlds, the 95/95 sham tail must remain uncalibrated.
          assert result['upper_sham_quantile'] is None
          assert result['decision']=='REDESIGN_OR_PILOT_ONLY'
          print('NEC03G_EVALMATH_PREFLIGHT',result['decision'],result['reasons'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nec03g-eight-world-evalmath-preflight-and-failure-gates
          path: /tmp/nec03g/preflight/
          retention-days: 60
          if-no-files-found: warn
