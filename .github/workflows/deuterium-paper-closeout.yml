name: Deuterium completed paper and evidence audit

on:
  pull_request:
    paths:
      - 'mechinterp/deuterium/paper_closeout/**'
      - 'mechinterp/deuterium/papers/VPD_TRM_Feature_Steering/**'
      - '.github/workflows/deuterium-paper-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-evidence-and-paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
      - name: Install the frozen paper environment
        run: python -m pip install -r mechinterp/deuterium/experiments/deuterium/requirements-paper.txt
      - name: Verify exact archived receipts and committed render hashes
        run: python -m mechinterp.deuterium.paper_closeout.render --verify-only
      - name: Rebuild the completed report from saved evidence
        run: python -m mechinterp.deuterium.paper_closeout.render
      - name: Require reproducible manuscript, figure and PDF bytes
        run: git diff --exit-code -- mechinterp/deuterium/papers/VPD_TRM_Feature_Steering/
      - name: Preserve the completed report and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deuterium-completed-paper-${{ github.sha }}
          path: |
            mechinterp/deuterium/papers/VPD_TRM_Feature_Steering/deuterium_complete_20261119*
            mechinterp/deuterium/papers/VPD_TRM_Feature_Steering/COMPLETION_AND_SILICO.md
            mechinterp/deuterium/papers/VPD_TRM_Feature_Steering/evidence/
            mechinterp/deuterium/papers/VPD_TRM_Feature_Steering/figures/
          if-no-files-found: error
          retention-days: 90
