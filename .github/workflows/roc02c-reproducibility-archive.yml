name: ROC-02C complete calibration-only reproducibility archive

on:
  push:
    paths:
      - '.github/workflows/roc02c-reproducibility-archive.yml'
  pull_request:
    paths:
      - '.github/workflows/roc02c-reproducibility-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public calibration receipts before packing
        run: |
          python -m unittest discover -s tests -p 'test_roc02b_public_receipts.py' -v
          python -m unittest tests.test_roc02c_public -v
      - name: Generate train/calibration sources and verify their exact hashes
        env:
          ROC02C_DIR: ${{ runner.temp }}/roc02c_replay
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from research_gym.analysis.roc02_delayed_rule_source import build_split
          out=Path(os.environ['ROC02C_DIR'])/'original_models'/'data'
          out.mkdir(parents=True,exist_ok=True)
          manifest=json.loads(Path('experiments/roc02_delayed_rule_v1/source_manifest.json').read_text())
          for split in ('train','calibration'):
              rows=build_split(split)
              raw=''.join(json.dumps(row,sort_keys=True,separators=(',',':'))+'\n' for row in rows).encode()
              expected=manifest['splits'][split]['file_sha256']
              assert hashlib.sha256(raw).hexdigest()==expected,(split,'source digest mismatch')
              (out/f'{split}_inputs.jsonl').write_bytes(raw)
              print(split,len(rows),expected)
          print('Only source families 0-5 generated; no sealed source inputs materialized')
          PY
      - name: Verify and extract all twelve frozen original neural checkpoints
        env:
          ROC02C_DIR: ${{ runner.temp }}/roc02c_replay
        run: |
          python -m research_gym.analysis.roc02_checkpoint_archive \
            --archive-dir experiments/roc02_delayed_rule_v1/checkpoints \
            --index experiments/roc02_delayed_rule_v1/checkpoints/roc02_checkpoint_archive_index.json \
            --summary experiments/roc02_delayed_rule_v1/roc02_train_calibration_summary.json \
            --destination "$ROC02C_DIR/original_models"
      - name: Build pinned calibration-only source and receipt ZIP
        env:
          ROC02C_DIR: ${{ runner.temp }}/roc02c_replay
          ROC02C_ZIP: ${{ runner.temp }}/ROC02C_rank7_8_calibration_reproducibility.zip
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path
          out=Path(os.environ['ROC02C_DIR'])
          out.mkdir(parents=True,exist_ok=True)
          paths=[
            'research_gym/analysis/roc02_delayed_rule_source.py',
            'research_gym/analysis/roc02_tied_train.py',
            'research_gym/analysis/roc02_checkpoint_archive.py',
            'research_gym/analysis/roc02b_calibration_card.py',
            'research_gym/analysis/roc02b_summarize.py',
            'research_gym/analysis/roc02c_equal_budget.py',
            'research_gym/analysis/roc02c_summarize.py',
            'configs/roc02_delayed_rule_source_impl_v1.json',
            'configs/roc02b_calibration_observer_card_v1.json',
            'configs/roc02c_calibration_equal_budget_v1.json',
            'experiments/roc02_delayed_rule_v1/source_manifest.json',
            'experiments/roc02_delayed_rule_v1/ROC02_CALIBRATION_REPORT.md',
            'experiments/roc02_delayed_rule_v1/roc02_train_calibration_summary.json',
            'experiments/roc02_delayed_rule_v1/checkpoints/roc02_checkpoint_archive_index.json',
            'tests/test_roc02b_calibration_card.py',
            'tests/test_roc02b_public_receipts.py',
            'tests/test_roc02c_equal_budget.py',
            'tests/test_roc02c_public.py',
          ]
          for name in paths:
              path=Path(name)
              if not path.is_file(): raise FileNotFoundError(name)
              target=out/path
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(path,target)
          for directory in (
              'experiments/roc02_delayed_rule_v1/roc02b_calibration',
              'experiments/roc02_delayed_rule_v1/roc02c_calibration',
          ):
              dst=out/directory
              if dst.exists():raise RuntimeError('duplicate archival path '+directory)
              shutil.copytree(directory,dst)
          readme=(
              'ROC-02C rank-7/8 calibration-only reproducibility bundle (2026-11-17)\n'
              'Source PR: MoralityLabAI/LoopedTransformers #144 at experiment head 004301995d44388bf7ceefccdc89c845c8452d00.\n'
              'Includes all twelve original verified 240-update PyTorch .pt checkpoints and receipts,\n'
              'only TRAIN/CALIBRATION source families 0-5, ROC02B nulls and ROC02C public data.\n'
              'The source-family 6/7 sealed-test inputs and labels are deliberately excluded.\n'
              'You need Python 3.12+ and PyTorch compatible with original CPU replay.\n'
              'Example from the extracted ZIP root:\n'
              'python -m research_gym.analysis.roc02c_equal_budget --seed 2026111601 --depth 8 '
              '--source-dir original_models --checkpoint-dir original_models/checkpoints --outdir reproduced\n'
              'Repeat for six model seeds and both trained depths; compare to the public receipts.\n'
              'The original gamma selections reuse calibration-family task labels.\n'
              'The ZIP is an archive of a calibration pilot, not a source-family holdout evaluation.\n'
          )
          (out/'README_REPLAY.txt').write_text(readme)
          all_files=sorted(p for p in out.rglob('*') if p.is_file())
          manifest={'study':'ROC-02C-complete-calibration-only-reproducibility',
                    'original_experiment_head':'004301995d44388bf7ceefccdc89c845c8452d00',
                    'sealed_test_inputs_included':False,'sealed_test_labels_included':False,
                    'model_count':12,
                    'files':[{'path':str(p.relative_to(out)),'bytes':p.stat().st_size,
                              'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in all_files]}
          (out/'REPRODUCIBILITY_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          dest=Path(os.environ['ROC02C_ZIP'])
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(x for x in out.rglob('*') if x.is_file()):
                  info=zipfile.ZipInfo(str(p.relative_to(out)),date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o644<<16
                  z.writestr(info,p.read_bytes())
          print('ZIP',dest,'bytes',dest.stat().st_size,'sha256',hashlib.sha256(dest.read_bytes()).hexdigest())
          print('Verified archive members',len(manifest['files']),'sealed-test materialized=False')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ROC02C-rank7-8-full-calibration-reproducibility
          path: ${{ runner.temp }}/ROC02C_rank7_8_calibration_reproducibility.zip
          retention-days: 30
