name: FC-12 freeze original TypedLoop from verified train-only Lean tactic effects

on:
  push:
    paths:
      - 'experiments/refutation_transfer/fc12_policy.py'
      - 'experiments/refutation_transfer/test_fc12_policy.py'
      - '.github/workflows/refutation-fc12-train-frozen.yml'
  pull_request:
    paths:
      - 'experiments/refutation_transfer/fc12_policy.py'
      - 'experiments/refutation_transfer/test_fc12_policy.py'
      - '.github/workflows/refutation-fc12-train-frozen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      FC12_TRAIN_ROOT: ${{ github.workspace }}/_fc12_trainonly
      PYTHONPATH: ${{ github.workspace }}/_fc12_trainonly
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout original TypedLoop and preregistered family ranker
        uses: actions/checkout@v4
      - name: Checkout immutably frozen pretest source and actual training action effects
        uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/Compactification-Theory
          ref: 8d192f0b323eade0fc764611f420414d70a0d81b
          path: _fc12_trainonly
          persist-credentials: false
      - name: Checkout unmodified original MathCan research proof source
        uses: actions/checkout@v4
        with:
          repository: patrickdugan/MathCan
          ref: c84e2025334e9a967c1297425a490f98d5b3d189
          path: _mathcan
          persist-credentials: false
      - name: Enforce source hashes and absence of FC12 test generator
        run: |
          test "$(git -C "$FC12_TRAIN_ROOT" rev-parse HEAD)" = 8d192f0b323eade0fc764611f420414d70a0d81b
          test ! -e "$FC12_TRAIN_ROOT/research/refutation_bench/fc12/test_data.py"
          test "$(git -C _mathcan rev-parse HEAD)" = c84e2025334e9a967c1297425a490f98d5b3d189
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU torch 2.5.1
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Install source-exact Lean4.35.0
        run: |
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            -o /tmp/lean435.tar.zst
          tar --zstd -xf /tmp/lean435.tar.zst -C /tmp
          echo /tmp/lean-4.35.0-linux/bin >> "$GITHUB_PATH"
      - name: Assert architecture and independently kernel-test native tactic search
        run: |
          python -m unittest discover -s experiments/refutation_transfer \
            -p 'test_fc12_policy.py' -v
      - name: Reproduce all 961 source-only real action probes and freeze two model seeds
        run: |
          python experiments/refutation_transfer/fc12_policy.py train \
            --source "$FC12_TRAIN_ROOT" --mathcan _mathcan \
            --out "$RUNNER_TEMP/fc12_weights"
      - name: Retain checkpoint SHA256, 51 real source states and all action effects
        uses: actions/upload-artifact@v4
        with:
          name: fc12-frozen-typed-lean-models
          path: ${{ runner.temp }}/fc12_weights/
          retention-days: 30
          if-no-files-found: error
