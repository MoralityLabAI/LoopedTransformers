name: AF-06 independent aggregation repair

on:
  push:
    branches:
      - feat/activation-funnel-af06-staged-causal
    paths:
      - .github/workflows/activation-funnel-af06-aggregate-repair.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 36b83eb83bc116dd4e938213edeba3057ffa9016
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 43599882702
          github-token: ${{ github.token }}
          pattern: af06-eval-*
          path: artifacts/af06/collected
          merge-multiple: false
      - name: Install pinned AF-06 runtime missing from original aggregate runner
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Independently reconcile original six heldout receipts
        run: |
          set -euo pipefail
          mkdir -p artifacts/af06/report
          python -m experiments.activation_funnel_af06.aggregate \
            --root artifacts/af06/collected \
            --out artifacts/af06/report/results.json \
            --report artifacts/af06/report/RESULTS.md
          git rev-parse HEAD > artifacts/af06/report/source_revision.txt
          echo '43599882702' > artifacts/af06/report/original_ci_run.txt
          sha256sum artifacts/af06/report/results.json > artifacts/af06/report/results.sha256
          python -m pip freeze > artifacts/af06/report/python_packages.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af06-results-repair-${{ github.run_id }}
          path: artifacts/af06/report/
          retention-days: 30
