name: MIRROR-03 semantic-contract and neural-bridge tests

on:
  pull_request:
    paths:
      - "experiments/mirror_epistemic_transport_v0/mirror03/**"
      - ".github/workflows/mirror03.yml"
  push:
    branches:
      - "research/mirror-counterfactual-transport-v0"
    paths:
      - "experiments/mirror_epistemic_transport_v0/mirror03/**"
      - ".github/workflows/mirror03.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test target adapter, contracts, evidence ledger and receipt replay
        run: |
          python -m pip install pytest
          python -m pytest -q experiments/mirror_epistemic_transport_v0/mirror03/test_v3_bridge.py
      - name: Reproduce scripted target fixture
        run: |
          python -m experiments.mirror_epistemic_transport_v0.mirror03.bridge --policy probe-first --budget 5 --output /tmp/mirror03_receipt.json
  neural:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test loaded neural question proposal gate
        run: |
          python -m pytest -q experiments/mirror_epistemic_transport_v0/mirror03/test_v3_neural.py
