name: LBF-20C premise Pareto search
on:
  pull_request:
    paths:
      - "research/lite_braille_fresco/lbf20c_*.py"
      - "research/lite_braille_fresco/lean/LBF20Pareto.lean"
      - "research/lite_braille_fresco/LBF_20C_REGISTRATION.md"
      - "research/lite_braille_fresco/results/lbf20c/**"
      - ".github/workflows/lbf20c-pareto.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - name: Check Pareto algebra and domination lemmas
        run: |
          mkdir -p "$RUNNER_TEMP/lbf20c-logs"
          lean_bin="$HOME/.elan/toolchains/leanprover--lean4---v4.19.0/bin/lean"
          "$lean_bin" --threads=1 research/lite_braille_fresco/lean/LBF20Pareto.lean > "$RUNNER_TEMP/lbf20c-logs/theory.log" 2>&1 || { cat "$RUNNER_TEMP/lbf20c-logs/theory.log"; exit 1; }
          cat "$RUNNER_TEMP/lbf20c-logs/theory.log"
          test "$(grep -c 'does not depend on any axioms' "$RUNNER_TEMP/lbf20c-logs/theory.log")" -eq 14
      - name: Independent Pareto audit and native paired search
        run: python research/lite_braille_fresco/lbf20c_native.py --out "$RUNNER_TEMP/lbf20c"
      - name: Independently compile all native proof witnesses
        run: |
          lean_bin="$HOME/.elan/toolchains/leanprover--lean4---v4.19.0/bin/lean"
          "$lean_bin" --threads=1 "$RUNNER_TEMP/lbf20c/Witnesses.lean" > "$RUNNER_TEMP/lbf20c/witnesses.log" 2>&1 || { cat "$RUNNER_TEMP/lbf20c/witnesses.log"; exit 1; }
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"lbf20c"
          s=json.loads((d/"summary.json").read_text())
          log=(d/"witnesses.log").read_text()
          entries=re.findall(r"'(lbf20c_[A-Za-z0-9_]+)' (does not depend on any axioms|depends on axioms: \[[^\]]*\])",log)
          assert len(entries)==s["native_kernel_certificates"] and len({n for n,_ in entries})==len(entries)
          for name,line in entries:
              if "depends on axioms:" in line:
                  assert set(x.strip() for x in line.split("[",1)[1][:-1].split(","))<={"propext","Quot.sound","Classical.choice"},name
          assert s["episodes"]==180 and s["audit"]["mismatches"]==0
          print("Standalone native certificates:",len(entries))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbf20c-premise-pareto-receipts
          path: |
            ${{ runner.temp }}/lbf20c/
            ${{ runner.temp }}/lbf20c-logs/
          if-no-files-found: warn
