name: LBF-18 Incremental Relational Fresco

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/lite_braille_fresco/**"
      - ".github/workflows/lbf18-incremental-fresco.yml"

jobs:
  unit-and-rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Build Rust sparse bitset-continuous trellis
        run: cargo build --release --manifest-path research/lite_braille_fresco/rust_trellis/Cargo.toml
      - name: Run LBF-18 unit and regression tests
        run: python -m unittest discover -s research/lite_braille_fresco/tests -v
