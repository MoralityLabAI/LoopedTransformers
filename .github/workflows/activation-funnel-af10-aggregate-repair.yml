name: AF-10 independent aggregate environment repair

on:
  push:
    branches: [feat/activation-funnel-af10-causal-cut]
    paths:
      - '.github/workflows/activation-funnel-af10-aggregate-repair.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0b50e66b85d66f624a2d07ecc1409e9bef17bacd
          persist-credentials: false
          sparse-checkout: |
            experiments/activation_funnel
            experiments/activation_funnel_af02
            experiments/activation_funnel_af05
            experiments/activation_funnel_af06
            experiments/activation_funnel_af07
            experiments/activation_funnel_af08
            experiments/activation_funnel_af09
            experiments/activation_funnel_af10
            experiments/lean_reasoner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact aggregate dependency closure
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Download both untouched successful AF-10 diagnostic ZIPs
        uses: actions/download-artifact@v4
        with:
          run-id: 43687693065
          pattern: af10-seed-*
          path: artifacts/af10
          merge-multiple: false
      - name: Verify original source and reconcile scored results
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '0b50e66b85d66f624a2d07ecc1409e9bef17bacd'
          mkdir -p artifacts/af10/aggregate-repair
          git rev-parse HEAD > artifacts/af10/aggregate-repair/source_revision.txt
          echo 'Original preflight, both full diagnostics and independent audits passed in 43687693065; original aggregate failed before scoring due to missing numpy' > artifacts/af10/aggregate-repair/repair_provenance.txt
          python -m experiments.activation_funnel_af10.aggregate \
            --root artifacts/af10 --out artifacts/af10/aggregate-repair/aggregate.json
          sha256sum artifacts/af10/aggregate-repair/aggregate.json > artifacts/af10/aggregate-repair/aggregate.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: af10-independent-aggregate-repair
          path: artifacts/af10/aggregate-repair/
          if-no-files-found: error
          retention-days: 30
