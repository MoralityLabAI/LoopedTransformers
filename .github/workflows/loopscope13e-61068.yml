name: LGA-10E frozen 61068 native FP32 CPU

on:
  push:
    branches:
      - research/loopscope13e-61068-native-fp32-20261119
    paths:
      - 'mechinterp/loopscope13e/source61068.py'
      - 'mechinterp/loopscope13e/audit61068.py'
      - 'mechinterp/loopscope13e/tests/test_source61068.py'
      - 'mechinterp/loopscope13e/IMPLEMENTATION_FREEZE_61068.md'
      - '.github/workflows/loopscope13e-61068.yml'
      - '!mechinterp/loopscope13e/results61068/**'
  pull_request:
    paths:
      - 'mechinterp/loopscope13e/**'
      - '.github/workflows/loopscope13e-61068.yml'
      - '!mechinterp/loopscope13e/results61068/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  source-locked-61068-fp32:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard first implementation push before source
        if: github.event_name == 'push'
        run: |
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD^)" = '8de00d66080cc3550efaf962da9387603a2d2eed'
          test "$GITHUB_REF_NAME" = 'research/loopscope13e-61068-native-fp32-20261119'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact CPU dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6
      - name: Compile and run inherited regression and new synthetic tests
        run: |
          python -m compileall -q mechinterp/loopscope13e
          python -m unittest discover -s mechinterp/loopscope13b/tests -p 'test_*.py' -v
          python -m unittest discover -s mechinterp/loopscope13c/tests -p 'test_*.py' -v
          python -m unittest discover -s mechinterp/loopscope13d/tests -p 'test_*.py' -v
          python -m unittest discover -s mechinterp/loopscope13e/tests -p 'test_*.py' -v
      - name: One-shot fresh 61068 source-only capture
        if: github.event_name == 'push'
        run: |
          python -m mechinterp.loopscope13e.source61068 \
            --out runs/lga10e61068/feasibility.json \
            --raw runs/lga10e61068/raw.npz \
            --freeze-commit "$GITHUB_SHA"
      - name: Independent NumPy numerical audit
        if: github.event_name == 'push'
        run: |
          python -m mechinterp.loopscope13e.audit61068 \
            --receipt runs/lga10e61068/feasibility.json \
            --raw runs/lga10e61068/raw.npz \
            --out runs/lga10e61068/audit.json
          sha256sum runs/lga10e61068/feasibility.json runs/lga10e61068/raw.npz runs/lga10e61068/audit.json > runs/lga10e61068/SHA256SUMS
          sha256sum -c runs/lga10e61068/SHA256SUMS
      - name: Print registered 64-case results
        if: always() && github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('runs/lga10e61068/feasibility.json')
          if not f.exists():
              raise SystemExit('source was never opened; capture unavailable')
          obj=json.loads(f.read_text())
          print('LGA10E_REGISTERED_RESULTS '+json.dumps({
              'arms':obj['arms'],'n_cases':obj['n_cases'],
              'seed':obj['excluded_source_seed'],'runtime_s':obj['elapsed_seconds'],
              'source_sha256':obj['source_inputs_sha256'],
              'capture_sha256':obj['raw_sha256'],
              'evidence_class':obj['evidence_class']
          },sort_keys=True))
          PY
      - name: Preserve first original source and failed endpoints
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: lga10e-61068-first-native-fp32-source
          path: runs/lga10e61068/
          if-no-files-found: warn
          compression-level: 9
          retention-days: 90
