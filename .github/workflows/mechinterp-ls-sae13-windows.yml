name: LS-SAE13 Windows CPU matched-edit replication
# Separate exploratory platform replay. Creating this workflow does not match
# the Linux pilot workflow's push path filter, so it does not rerun that job.
on:
  push:
    branches: [research/mechinterp-ls-sae13-numerical-stability-20261118]
    paths:
      - '.github/workflows/mechinterp-ls-sae13-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
  HF_HUB_DOWNLOAD_TIMEOUT: '180'
  HF_HUB_ETAG_TIMEOUT: '60'
  PYTHONUNBUFFERED: '1'
jobs:
  cpu-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matched CPU-only dependency versions
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests on Windows CPU
        run: python -m unittest discover -s mechinterp/sae_causal_transfer/ls_sae13 -p test_*.py -v
      - name: Re-execute exact four-board pilot on Windows CPU
        run: python -m mechinterp.sae_causal_transfer.ls_sae13.run_pilot --source mechinterp/sae_causal_transfer/results/ls_sae12/source_48.json --out runs/ls_sae13/pilot-windows-cpu.json
      - name: Check receipt edit hashes
        run: |
          python -c "import hashlib,json,pathlib; p=pathlib.Path('runs/ls_sae13/pilot-windows-cpu.json'); d=json.loads(p.read_bytes()); assert len(d['boards'])==4; assert all(hashlib.sha256(bytes.fromhex(b['edit_little_endian_float32_hex'])).hexdigest()==b['edit_sha256'] for b in d['boards']); print('LS_SAE13_WINDOWS_EDIT_AUDIT_PASS', hashlib.sha256(p.read_bytes()).hexdigest())"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae13-four-puzzle-windows-cpu-pilot
          path: runs/ls_sae13/pilot-windows-cpu.json
          retention-days: 90
          if-no-files-found: warn
