name: LS-SAE12 active-reasoning interventions scored by verified future deductions
# The registered model stage runs on a push of the LS-SAE12 branch (or a manual
# dispatch), never on pull_request, so opening a PR does not create a second
# registered run. A pull_request run only repeats the unit tests and the
# source-only admission.
on:
  push:
    branches: [research/mechinterp-ls-sae12-active-reasoning-20261117]
    paths:
      - 'mechinterp/sae_causal_transfer/active_reasoning_v1/**'
      - '.github/workflows/mechinterp-ls-sae12-active-reasoning.yml'
  pull_request:
    paths:
      - 'mechinterp/sae_causal_transfer/active_reasoning_v1/**'
      - '.github/workflows/mechinterp-ls-sae12-active-reasoning.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
  HF_HUB_DOWNLOAD_TIMEOUT: '180'
  HF_HUB_ETAG_TIMEOUT: '60'
  PYTHONUNBUFFERED: '1'
jobs:
  unit-tests-and-source-only-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests (solvers, schedules, site rules, gate, power iteration, toy end-to-end audit)
        run: |
          python -m compileall -q mechinterp/sae_causal_transfer/active_reasoning_v1
          python -m unittest discover -s mechinterp/sae_causal_transfer/active_reasoning_v1 -p 'test_*.py' -v
      - name: Original LS-SAE08 evidence for pool disjointness
        uses: actions/download-artifact@v4
        with:
          name: ls-sae08-hard-52-54-native-all81-causal-evidence-and-audit
          run-id: 43851165980
          github-token: ${{ github.token }}
          path: runs/ls_sae12/original
      - name: Source-only admission of the 48 pinned pool files under two exact solvers
        run: |
          python -m mechinterp.sae_causal_transfer.active_reasoning_v1.run_source --ls-sae11-source mechinterp/sae_causal_transfer/results/ls_sae11/receipts/source_20.json --ls-sae08-full runs/ls_sae12/original/full.json --out runs/ls_sae12/source_48.json
      - name: Independent source receipt audit
        run: |
          python -m mechinterp.sae_causal_transfer.active_reasoning_v1.audit --source runs/ls_sae12/source_48.json --ls-sae11-source mechinterp/sae_causal_transfer/results/ls_sae11/receipts/source_20.json --ls-sae08-full runs/ls_sae12/original/full.json --out runs/ls_sae12/source-audit.json
      - name: The committed local source receipt must be byte-identical
        run: |
          cmp runs/ls_sae12/source_48.json mechinterp/sae_causal_transfer/results/ls_sae12/source_48.json
      - uses: actions/upload-artifact@v4
        with:
          name: ls-sae12-source-only-48-pool
          path: runs/ls_sae12/source*.json
          retention-days: 90
          if-no-files-found: error

  engineering-pilot:
    runs-on: ubuntu-latest
    needs: unit-tests-and-source-only-admission
    if: github.event_name != 'pull_request'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Engineering-only pilot on the four LS-SAE11 pilot puzzles (no gate)
        run: |
          python -m mechinterp.sae_causal_transfer.active_reasoning_v1.run_native --stage pilot --source mechinterp/sae_causal_transfer/results/ls_sae11/receipts/source_20.json --out runs/ls_sae12/pilot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae12-engineering-pilot
          path: runs/ls_sae12/pilot.json
          retention-days: 90
          if-no-files-found: warn

  registered-screen-and-two-families:
    runs-on: ubuntu-latest
    needs: engineering-pilot
    if: github.event_name != 'pull_request'
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: ls-sae12-source-only-48-pool
          path: runs/ls_sae12
      - name: Screening of 48 and interventions for active_a and active_b in one process
        run: |
          python -m mechinterp.sae_causal_transfer.active_reasoning_v1.run_native --stage full --source runs/ls_sae12/source_48.json --out runs/ls_sae12/registered
      - name: Independent standard-library audit of screening and both families
        if: always()
        run: |
          for fam in active_a active_b; do
            python -m mechinterp.sae_causal_transfer.active_reasoning_v1.audit --source runs/ls_sae12/source_48.json --screen runs/ls_sae12/registered/screen.json --input runs/ls_sae12/registered/$fam.json --out runs/ls_sae12/registered/$fam-audit.json
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae12-registered-screen-families-and-audit
          path: runs/ls_sae12/registered/*.json
          retention-days: 90
          if-no-files-found: warn

  publish-evidence:
    # Artifacts need authentication to download; this copies them, gzipped,
    # into an orphan git branch so the run can be audited with plain git.
    runs-on: ubuntu-latest
    needs: [unit-tests-and-source-only-admission, engineering-pilot, registered-screen-and-two-families]
    if: always() && github.event_name != 'pull_request'
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: evidence
      - name: Commit this run's artifacts to evidence/ls-sae12-run-<run_id>
        env:
          BRANCH: evidence/ls-sae12-run-${{ github.run_id }}
          R_SOURCE: ${{ needs.unit-tests-and-source-only-admission.result }}
          R_PILOT: ${{ needs.engineering-pilot.result }}
          R_REGISTERED: ${{ needs.registered-screen-and-two-families.result }}
        run: |
          set -euo pipefail
          src_sha=$(git rev-parse HEAD)
          find evidence -type f -name '*.json' -exec gzip -9n {} \;
          (cd evidence && find . -type f | sort | xargs -r sha256sum) > ../SHA256SUMS
          printf '{"run_id": %s, "run_attempt": %s, "workflow_commit": "%s", "job_results": {"source": "%s", "pilot": "%s", "registered": "%s"}}\n' \
            "${{ github.run_id }}" "${{ github.run_attempt }}" "$src_sha" "$R_SOURCE" "$R_PILOT" "$R_REGISTERED" > ../RUN.json
          cat ../RUN.json ../SHA256SUMS
          mv evidence ../evidence_out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$BRANCH"
          git rm -rf -q .
          git clean -fdxq
          cp -r ../evidence_out/. .
          cp ../SHA256SUMS ../RUN.json .
          git add -A
          git commit -q -m "LS-SAE12 evidence: artifacts of run ${{ github.run_id }} (source $R_SOURCE, pilot $R_PILOT, registered $R_REGISTERED)"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "::notice::evidence branch $BRANCH at $(git rev-parse HEAD)"
