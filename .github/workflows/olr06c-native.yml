name: OLR-06C native semantic applicability
on:
  pull_request:
    paths:
      - "research/lean_cgrt_hrm400/ppt_gym/olr06c*.py"
      - "research/lean_cgrt_hrm400/ppt_gym/tests/test_olr06c.py"
      - ".github/workflows/olr06c-native.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: olr06c-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Verify finite semantic and posterior protocol
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m unittest discover -s ppt_gym/tests -p "test_olr06c.py" -v
      - name: Freeze native roots and fit source receipt priors
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: |
          python -m ppt_gym.olr06c_campaign freeze --out runs/olr06c-bank
          python -m ppt_gym.olr06c_campaign fit --bank runs/olr06c-bank --out runs/olr06c-fit
      - name: Shared posterior search and native transport certificates
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: |
          python -m ppt_gym.olr06c_campaign score --bank runs/olr06c-bank --fit runs/olr06c-fit --out runs/olr06c-eval
          python - <<'PY'
          import json
          f=json.load(open("runs/olr06c-fit/manifest.json"))
          m=json.load(open("runs/olr06c-eval/manifest.json"))
          assert f["source_roots"]==64 and f["source_certificate"]["full"]==64
          assert f["native_queries"]==f["native_replays"]
          assert len(f["models"])==15
          assert m["query_roots"]==48 and m["policy_trials"]==912
          assert m["native_queries"]==m["native_replays"]
          assert m["independent_certificate"]["full"]>=48
          assert m["architecture_promotion_eligible"] is False
          print("OLR06C native certificate and semantic scorecard",json.dumps(m["scorecard"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olr06c-native-semantic
          path: |
            research/lean_cgrt_hrm400/runs/olr06c-bank
            research/lean_cgrt_hrm400/runs/olr06c-fit
            research/lean_cgrt_hrm400/runs/olr06c-eval
          if-no-files-found: ignore
