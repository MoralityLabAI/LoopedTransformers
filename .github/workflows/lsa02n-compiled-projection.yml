name: LSA-02N compiled projection frontier
on:
  pull_request:
    paths:
      - 'research/lean_cgrt_hrm400/ppt_gym/equality_compiled.py'
      - 'research/lean_cgrt_hrm400/ppt_gym/tests/test_equality_compiled.py'
      - 'docs/lsa02n_compiled_projection_protocol.md'
      - '.github/workflows/lsa02n-compiled-projection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch
        run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify projected bounds and compiled score identity
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m compileall -q ppt_gym/equality_compiled.py
          python -m unittest ppt_gym.tests.test_equality_compiled -v
      - name: Freeze original and fresh hard development rosters
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m ppt_gym.equality_suite --out runs/lsa02n-suite
          python -m ppt_gym.equality_ordering freeze-dev --suite runs/lsa02n-suite --out runs/lsa02n-old-l
          python -m ppt_gym.equality_residual freeze --suite runs/lsa02n-suite --old-dev runs/lsa02n-old-l --out runs/lsa02n-old-m
          python -m ppt_gym.equality_compiled freeze --suite runs/lsa02n-suite --old-l runs/lsa02n-old-l --old-m runs/lsa02n-old-m --out runs/lsa02n-dev
      - name: Regenerate native training references
        working-directory: research/lean_cgrt_hrm400
        run: python -m ppt_gym.equality_preflight train --suite runs/lsa02n-suite --out runs/lsa02n-reference
      - name: Certify teacher, fit compiled potential and compare hard-cohort search
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m ppt_gym.equality_compiled run --suite runs/lsa02n-suite --old-l runs/lsa02n-old-l --old-m runs/lsa02n-old-m --teacher runs/lsa02n-reference --dev runs/lsa02n-dev --out runs/lsa02n-result
          python - <<'PY'
          import json
          m=json.load(open('runs/lsa02n-result/manifest.json'))
          assert m['roots']==32 and m['teacher']['offpath_native_compiled']==760
          assert m['backend']['actual_lean_process'] and not m['sealed_contents_parsed']
          assert not m['scientific_eligible'] and not m['architecture_promotion_eligible']
          assert m['summary']['exact_ceiling']['100000']['certified']==32
          print('LSA02N_GATE',m['gate'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsa02n-compiled-projection-native
          path: |
            research/lean_cgrt_hrm400/runs/lsa02n-dev/
            research/lean_cgrt_hrm400/runs/lsa02n-reference/
            research/lean_cgrt_hrm400/runs/lsa02n-result/
          retention-days: 14
          if-no-files-found: warn
