name: Deuterium mechinterp archive verification

on:
  pull_request:
    paths:
      - 'mechinterp/deuterium/**'
      - '.github/workflows/deuterium-mechinterp-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mechinterp/deuterium
    env:
      PYTHONPATH: ${{ github.workspace }}/mechinterp/deuterium
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
      - name: Check original byte inventory, frozen registration and archive extraction logic
        run: |
          sha256sum --check experiments/deuterium/results/SHA256SUMS
          python -m unittest experiments.deuterium.tests.test_artifacts experiments.deuterium.tests.test_records experiments.deuterium.tests.test_relocated_runner -v
      - name: Record GitHub runner
        run: python -m experiments.deuterium.runtime_manifest --output "$RUNNER_TEMP/deuterium-recovery/runtime.json"
      - name: Retrieve and authenticate original June 2026 bytes
        run: >-
          python -m experiments.deuterium.artifacts
          --archive "$RUNNER_TEMP/deuterium-recovery.zip"
          --extract "$RUNNER_TEMP/deuterium-original"
          --manifest "$RUNNER_TEMP/deuterium-recovery/archive_manifest.json"
      - name: Require exact recovered inventory
        run: cmp experiments/deuterium/results/archive_manifest.json "$RUNNER_TEMP/deuterium-recovery/archive_manifest.json"
      - name: Recompute historical audit from the authenticated records
        run: >-
          python -m experiments.deuterium.records
          --records-root "$RUNNER_TEMP/deuterium-original"
          --out-dir "$RUNNER_TEMP/deuterium-recovery/retrospective"
      - name: Compare every historical receipt to the frozen record-derived output
        run: diff -ru experiments/deuterium/results/retrospective "$RUNNER_TEMP/deuterium-recovery/retrospective"
      - name: Install pinned paper renderer
        run: |
          python -m pip install -r experiments/deuterium/requirements-paper.txt
          python -m pip freeze > "$RUNNER_TEMP/deuterium-recovery/pip-freeze.txt"
      - name: Regenerate manuscript tables, figures and PDF
        run: >-
          python -m experiments.deuterium.render_paper
          --followup experiments/deuterium/results/followup/paper_summary.json
      - name: Check unchanged manuscript and tables
        run: git -C ../.. diff --exit-code -- mechinterp/deuterium/papers/VPD_TRM_Feature_Steering/vpd_trm_feature_steering_paper.md mechinterp/deuterium/papers/VPD_TRM_Feature_Steering/tables
      - name: Preserve receipts, including failed prerequisites
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deuterium-archive-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/deuterium-recovery/
            mechinterp/deuterium/papers/VPD_TRM_Feature_Steering/
          if-no-files-found: warn
          retention-days: 90
