name: LS-SAE03 native 512D TRM Jacobian-vector transport
on:
  pull_request:
    paths:
      - 'mechinterp/sae_causal_transfer/native_jvp_v1/**'
      - 'mechinterp/sae_causal_transfer/README.md'
      - '.github/workflows/mechinterp-ls-sae03-native-jvp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-jvp-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: CPU 512D JVP native forward/reverse derivative and preregistered gate checks
        run: |
          python -m compileall -q mechinterp/sae_causal_transfer/native_jvp_v1
          python -m unittest discover -s mechinterp/sae_causal_transfer/native_jvp_v1 -p 'test_*.py' -v

  pinned-checkpoint-pilot:
    runs-on: ubuntu-latest
    needs: source-and-jvp-regressions
    timeout-minutes: 80
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Original SHA256 pinned LoopedTRM 2+2 Sudoku JVP engineering pilot
        run: python -m mechinterp.sae_causal_transfer.native_jvp_v1.run_native --pilot --fit-out runs/ls_sae03/frozen_fit.npz --out runs/ls_sae03/pilot.json
      - name: Independent stdlib raw numerical and gate audit
        run: python -m mechinterp.sae_causal_transfer.native_jvp_v1.audit --input runs/ls_sae03/pilot.json --out runs/ls_sae03/pilot-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae03-full512-jvp-pilot-and-audit
          path: |
            runs/ls_sae03/pilot*.json
            runs/ls_sae03/frozen_fit.npz
          retention-days: 90
          if-no-files-found: warn

  full-fresh-24-sudoku-native:
    runs-on: ubuntu-latest
    needs: pinned-checkpoint-pilot
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Retrieve SHA-verified original fit arrays from successful pilot
        uses: actions/download-artifact@v4
        with:
          name: ls-sae03-full512-jvp-pilot-and-audit
          path: runs/ls_sae03/source
      - name: Source-locked LS-SAE03 12+12 full native Jacobian-vector evaluation
        run: python -m mechinterp.sae_causal_transfer.native_jvp_v1.run_native --fit-in runs/ls_sae03/source/frozen_fit.npz --out runs/ls_sae03/full.json
      - name: Independent stdlib native JVP/digit-margin/128-null/bootstrap replay
        run: python -m mechinterp.sae_causal_transfer.native_jvp_v1.audit --input runs/ls_sae03/full.json --out runs/ls_sae03/full-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae03-full512-jvp-fresh-sudoku-and-audit
          path: runs/ls_sae03/full*.json
          retention-days: 90
          if-no-files-found: warn
