name: LGA-07C post-result first-original NumPy QA

on:
  pull_request:
    paths:
      - 'mechinterp/loopscope10/RESULTS_LGA07C_FIRST_NATIVE_20261118.md'
      - 'mechinterp/loopscope10/audit_lga07c_numpy_qa.py'
      - '.github/workflows/loopscope10c-numpy-qa-first-only.yml'
  push:
    paths:
      - 'mechinterp/loopscope10/RESULTS_LGA07C_FIRST_NATIVE_20261118.md'
      - 'mechinterp/loopscope10/audit_lga07c_numpy_qa.py'
      - '.github/workflows/loopscope10c-numpy-qa-first-only.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  first-original-qa-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent NumPy audit dependency
        run: python -m pip install numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: lga07c-first-pretest-source-only-lock
          run-id: 44283810760
          github-token: ${{ github.token }}
          path: runs/lga07c/qa_original_lock
      - uses: actions/download-artifact@v4
        with:
          name: lga07c-first-31061-global-donor-native-all-vectors
          run-id: 44283810760
          github-token: ${{ github.token }}
          path: runs/lga07c/qa_original_data
      - name: Audit all 21,504 original edited physical vectors and registered source-bootstrap verdict
        run: |
          python -m compileall -q mechinterp/loopscope10/audit_lga07c_numpy_qa.py
          python -m mechinterp.loopscope10.audit_lga07c_numpy_qa \
            --lock runs/lga07c/qa_original_lock/lock.json \
            --full runs/lga07c/qa_original_data/full.json \
            --vectors runs/lga07c/qa_original_data/edits_f32.gz \
            --sources runs/lga07c/qa_original_data/source_grad_f32.gz \
            --out runs/lga07c/qa/audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('runs/lga07c/qa/audit.json').read_text())
          assert q['audit_status']=='PASS'
          assert q['vectors_audited']==21504
          assert q['sources_audited']==1536
          assert q['evidence_class']=='POST_RESULT_QA_ONLY'
          print(q['first_registered_development_verdict'])
          PY
          sha256sum runs/lga07c/qa/audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: lga07c-post-result-numpy-first-receipt-qa
          path: runs/lga07c/qa/audit.json
          if-no-files-found: error
