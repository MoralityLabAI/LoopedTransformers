name: COE-09 label-alignment and dark-fiber causal probe
on:
  pull_request:
    paths:
      - 'mechinterp/phase_gauge09/**'
      - '.github/workflows/coe09-label-alignment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU unit dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check geometry, label firewall, and corrupted source rejection
        run: python -m unittest discover -s mechinterp/phase_gauge09 -p 'test_*.py' -v
  native-pretrained:
    needs: portable-unit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      HF_HUB_DOWNLOAD_TIMEOUT: 150
      HF_HUB_ETAG_TIMEOUT: 45
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'huggingface_hub>=0.30,<2'
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: SHA-verified native checkpoint and original COE-07 activation extraction
        run: python -m mechinterp.phase_gauge07.run_native --threads 4 --device cpu --out /tmp/coe09
      - name: Held-out label association and fit-label shuffle
        run: |
          python -m mechinterp.phase_gauge09.native_label_replay \
            --activations /tmp/coe09/native_activations.npz \
            --receipt /tmp/coe09/receipt.json \
            --permutations 2000 --out /tmp/coe09/native_label_alignment.json
      - name: Norm-calibrated matched intervention
        run: |
          python -m mechinterp.phase_gauge09.native_causal \
            --activations /tmp/coe09/native_activations.npz \
            --receipt /tmp/coe09/receipt.json \
            --device cpu --threads 4 --out /tmp/coe09/native_causal.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coe09-verified-pretrained-trm-receipts
          path: /tmp/coe09/
          if-no-files-found: warn
