name: AF-18 recurrence depth and Bellman-cap sweep
on:
  push:
    branches: [feat/activation-funnel-af18-causal-cone-sweep]
    paths:
      - 'experiments/activation_funnel_af18/**'
      - '.github/workflows/activation-funnel-af18.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: af18-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Source/contract/unit and optimized validation
        run: |
          set -euo pipefail
          python -m unittest discover -s experiments/activation_funnel_af18/tests -p 'test_*.py' -v
          python -O -m unittest discover -s experiments/activation_funnel_af18/tests -p 'test_*.py' -v
          python -m experiments.activation_funnel_af18.experiment manifest --out /tmp/af18_manifest.json
          cmp /tmp/af18_manifest.json experiments/activation_funnel_af18/fresh_manifest.json
      - name: Install checksum-pinned Lean 4.19.0 and check arithmetic lemmas
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  /tmp/lean-4.19.0-linux.tar.zst' | sha256sum --check --strict
          tar --zstd -xf /tmp/lean-4.19.0-linux.tar.zst -C /tmp
          /tmp/lean-4.19.0-linux/bin/lean experiments/activation_funnel_af18/CausalCone.lean
  train-evaluate:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [17,29,43,61]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Train, score and independently replay
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          mkdir -p "artifacts/af18/s${SEED}"
          git rev-parse HEAD > "artifacts/af18/s${SEED}/source_revision.txt"
          python -m experiments.activation_funnel_af18.experiment train --seed "$SEED" --out "artifacts/af18/s${SEED}/training"
          python -m experiments.activation_funnel_af18.experiment evaluate --seed "$SEED" --training "artifacts/af18/s${SEED}/training" --out "artifacts/af18/s${SEED}/evaluation"
          python -m experiments.activation_funnel_af18.verify --seed "$SEED" --training "artifacts/af18/s${SEED}/training" --evaluation "artifacts/af18/s${SEED}/evaluation" --out "artifacts/af18/s${SEED}/independent_audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: af18-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: artifacts/af18/s${{ matrix.seed }}
          retention-days: 30
  aggregate:
    needs: train-evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned aggregation dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - uses: actions/download-artifact@v4
        with:
          pattern: af18-seed-*-${{ github.run_id }}
          merge-multiple: false
          path: artifacts/af18/batches
      - name: Reconstruct four seed trees and compute registered verdict
        run: |
          set -euo pipefail
          for seed in 17 29 43 61; do
            mv "artifacts/af18/batches/af18-seed-${seed}-${GITHUB_RUN_ID}" "artifacts/af18/s${seed}"
          done
          python -m experiments.activation_funnel_af18.aggregate --root artifacts/af18 --out artifacts/af18/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: af18-aggregate-${{ github.run_id }}
          path: artifacts/af18/results.json
          retention-days: 30
