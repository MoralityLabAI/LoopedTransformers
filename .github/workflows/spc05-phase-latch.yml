name: SPC-05 phase-localization and low-rank intervention CPU checks
on:
  push:
    paths:
      - 'experiments/spectral_state_cost_v0/spc05_phase_interventions.py'
      - 'experiments/spectral_state_cost_v0/spc05_phase_subspace.py'
      - 'experiments/spectral_state_cost_v0/SPC-05.md'
      - 'experiments/spectral_state_cost_v0/receipts/spc05_summary.json'
      - 'tests/test_spc05_phase_interventions.py'
      - '.github/workflows/spc05-phase-latch.yml'
  pull_request:
    paths:
      - 'experiments/spectral_state_cost_v0/spc05_phase_interventions.py'
      - 'experiments/spectral_state_cost_v0/spc05_phase_subspace.py'
      - 'experiments/spectral_state_cost_v0/SPC-05.md'
      - 'experiments/spectral_state_cost_v0/receipts/spc05_summary.json'
      - 'tests/test_spc05_phase_interventions.py'
      - '.github/workflows/spc05-phase-latch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cpu-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact pinned CPU dependencies
        run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Local-state native controls and deterministic SVD smoke
        run: python -m unittest discover -s tests -p 'test_spc05_phase_interventions.py' -v
      - name: Validate frozen count receipt format
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('experiments/spectral_state_cost_v0/receipts/spc05_summary.json')
          r=json.loads(p.read_text())
          assert r['registered_task_cycles']==288
          assert r['phase_transplant']['answer_only_next_phase']==288
          assert r['phase_transplant']['context_only_original_phase']==288
          assert r['subspace']['rank8_pca_raw_next_phase']==288
          assert r['checkpoint_binary_committed'] is False
          print('frozen SPC-05 count receipt schema OK')
          PY
