name: SPC-04 trained recurrence and periodic phase controls
on:
  push:
    paths:
      - 'experiments/spectral_state_cost_v0/spc04_*.py'
      - 'experiments/spectral_state_cost_v0/SPC-04.md'
      - 'tests/test_spc04_trained_dynamics.py'
      - '.github/workflows/spc04-trained-cycle.yml'
  pull_request:
    paths:
      - 'experiments/spectral_state_cost_v0/spc04_*.py'
      - 'experiments/spectral_state_cost_v0/SPC-04.md'
      - 'tests/test_spc04_trained_dynamics.py'
      - '.github/workflows/spc04-trained-cycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU libraries
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run native-source unit checks
        run: python -m unittest discover -s tests -p 'test_spc04_trained_dynamics.py' -v
      - name: Run a bounded real-training smoke
        run: |
          python -m experiments.spectral_state_cost_v0.spc04_trained_dynamics \
            --seeds 41522 --steps 40 --eval-items 32 --no-jacobian \
            --out /tmp/spc04_smoke.json >/tmp/spc04_smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spc04-bounded-cpu-receipt
          path: |
            /tmp/spc04_smoke.json
            /tmp/spc04_smoke.log
          if-no-files-found: warn
