name: LS-SAE11 same-forward hard Sudoku and hidden-state transport
on:
  pull_request:
    paths:
      - 'mechinterp/sae_causal_transfer/native_withinrun_v1/**'
      - '.github/workflows/mechinterp-ls-sae11-withinrun-hard.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-only-admission-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Unit regression of exact cover, native same-forward and strict margin proof
        run: |
          python -m compileall -q mechinterp/sae_causal_transfer/native_withinrun_v1
          python -m unittest discover -s mechinterp/sae_causal_transfer/native_withinrun_v1 -p 'test_*.py' -v
      - name: Original LS-SAE08 immutable source, calibration, pretrained and signed evidence
        uses: actions/download-artifact@v4
        with:
          name: ls-sae08-hard-52-54-native-all81-causal-evidence-and-audit
          run-id: 43851165980
          github-token: ${{ github.token }}
          path: runs/ls_sae11/original
      - name: Recompute original LS-SAE08 independent FAIL before external source acquisition
        run: |
          python -m mechinterp.sae_causal_transfer.native_hard_task_v2.audit --input runs/ls_sae11/original/full.json --out runs/ls_sae11/original/replayed-audit.json
      - name: Source-only 20 fixed Git-blob-pinned Champagne puzzles and exact unique solver witnesses
        run: |
          python -m mechinterp.sae_causal_transfer.native_withinrun_v1.run_source --original runs/ls_sae11/original/full.json --out runs/ls_sae11/source_20.json
      - name: Independently replay source uniqueness and original provenance before neural test
        run: |
          python -c 'import json; from mechinterp.sae_causal_transfer.native_withinrun_v1.audit import source_audit; source_audit(json.load(open("runs/ls_sae11/source_20.json"))); print("LS_SAE11_SOURCE_INDEPENDENT_PASS")'
      - uses: actions/upload-artifact@v4
        with:
          name: ls-sae11-frozen-20-Champagne-source-only-exact-witnesses
          path: runs/ls_sae11/source_20.json
          retention-days: 90
          if-no-files-found: error

  four-puzzle-hard-native-engineering-pilot:
    runs-on: ubuntu-latest
    needs: source-only-admission-and-unit-tests
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: ls-sae08-hard-52-54-native-all81-causal-evidence-and-audit
          run-id: 43851165980
          github-token: ${{ github.token }}
          path: runs/ls_sae11/original
      - uses: actions/download-artifact@v4
        with:
          name: ls-sae11-frozen-20-Champagne-source-only-exact-witnesses
          path: runs/ls_sae11
      - name: Engineering four genuinely hard native within-forward ACT3/6/12 puzzles
        run: |
          python -m mechinterp.sae_causal_transfer.native_withinrun_v1.run_native --mode pilot --original runs/ls_sae11/original/full.json --source runs/ls_sae11/source_20.json --out runs/ls_sae11/pilot.json
      - name: Independent pilot full81 margin and hidden transport summary audit
        run: |
          python -m mechinterp.sae_causal_transfer.native_withinrun_v1.audit --original runs/ls_sae11/original/full.json --source runs/ls_sae11/source_20.json --input runs/ls_sae11/pilot.json --out runs/ls_sae11/pilot-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae11-hard-four-engineering-within-forward-native-and-audit
          path: runs/ls_sae11/pilot*.json
          retention-days: 90
          if-no-files-found: warn

  sixteen-original-reference-withinrun-mechanism:
    runs-on: ubuntu-latest
    needs: four-puzzle-hard-native-engineering-pilot
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: ls-sae08-hard-52-54-native-all81-causal-evidence-and-audit
          run-id: 43851165980
          github-token: ${{ github.token }}
          path: runs/ls_sae11/original
      - uses: actions/download-artifact@v4
        with:
          name: ls-sae11-frozen-20-Champagne-source-only-exact-witnesses
          path: runs/ls_sae11
      - name: Native all 16 original LS-SAE08 source states with same-forward signed margin certificates
        run: |
          python -m mechinterp.sae_causal_transfer.native_withinrun_v1.run_native --mode reference --original runs/ls_sae11/original/full.json --source runs/ls_sae11/source_20.json --out runs/ls_sae11/reference.json
      - name: Independent exact-source original 16-puzzle within-forward replay
        run: |
          python -m mechinterp.sae_causal_transfer.native_withinrun_v1.audit --original runs/ls_sae11/original/full.json --source runs/ls_sae11/source_20.json --input runs/ls_sae11/reference.json --out runs/ls_sae11/reference-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae11-original-16-reference-native-transport-and-audit
          path: runs/ls_sae11/reference*.json
          retention-days: 90
          if-no-files-found: warn

  sixteen-champagne-hard-prospective-native:
    runs-on: ubuntu-latest
    needs: sixteen-original-reference-withinrun-mechanism
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: ls-sae08-hard-52-54-native-all81-causal-evidence-and-audit
          run-id: 43851165980
          github-token: ${{ github.token }}
          path: runs/ls_sae11/original
      - uses: actions/download-artifact@v4
        with:
          name: ls-sae11-frozen-20-Champagne-source-only-exact-witnesses
          path: runs/ls_sae11
      - name: Full prospective hard test 8+8 native ACT3/6/12 verified Sudoku
        run: |
          python -m mechinterp.sae_causal_transfer.native_withinrun_v1.run_native --mode hard --original runs/ls_sae11/original/full.json --source runs/ls_sae11/source_20.json --out runs/ls_sae11/hard.json
      - name: Independent 20-source, all81 logits, strict finite margin and registered score audit
        run: |
          python -m mechinterp.sae_causal_transfer.native_withinrun_v1.audit --original runs/ls_sae11/original/full.json --source runs/ls_sae11/source_20.json --input runs/ls_sae11/hard.json --out runs/ls_sae11/hard-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae11-hard-full-16-native-state-transport-accuracy-and-audit
          path: runs/ls_sae11/hard*.json
          retention-days: 90
          if-no-files-found: warn
