name: RAM-16 frozen prospective source-only evaluator contract
on:
  push:
    paths: ['.github/workflows/ram16-eval-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-checkpoint-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify prospective source split, 23-family candidate set and absent gold reference proof input
        run: |
          python -m unittest discover -s experiments/lean_ram16 -p 'test_eval_freeze_audit.py' -v
          python -m py_compile experiments/lean_ram16/eval_grammar.py
