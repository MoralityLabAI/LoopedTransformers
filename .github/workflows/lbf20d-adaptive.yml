name: LBF-20D adaptive premise selection
on:
  pull_request:
    paths:
      - "research/lite_braille_fresco/lbf20d_*.py"
      - "research/lite_braille_fresco/LBF_20D_REGISTRATION.md"
      - ".github/workflows/lbf20d-adaptive.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Exact joint DP audit and matched learning controls
        run: python research/lite_braille_fresco/lbf20d_learning.py --out "$RUNNER_TEMP/lbf20d-synthetic"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbf20d-synthetic-receipts
          path: ${{ runner.temp }}/lbf20d-synthetic/
          if-no-files-found: warn
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - name: Paired native controllers and post-run static-context audit
        run: python research/lite_braille_fresco/lbf20d_native.py --out "$RUNNER_TEMP/lbf20d-native"
      - name: Compile native witnesses independently
        run: |
          lean_bin="$HOME/.elan/toolchains/leanprover--lean4---v4.19.0/bin/lean"
          "$lean_bin" --threads=1 "$RUNNER_TEMP/lbf20d-native/Witnesses.lean" > "$RUNNER_TEMP/lbf20d-native/witnesses.log" 2>&1 || { tail -100 "$RUNNER_TEMP/lbf20d-native/witnesses.log"; exit 1; }
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"lbf20d-native"
          s=json.loads((d/"summary.json").read_text())
          entries=re.findall(r"'(lbf20d_[A-Za-z0-9_]+)' (does not depend on any axioms|depends on axioms: \[[^\]]*\])",(d/"witnesses.log").read_text())
          assert s["episodes"]==192 and len(entries)==s["native_kernel_certificates"] and len({n for n,_ in entries})==len(entries)
          for name,line in entries:
              if "depends on axioms:" in line:
                  assert set(x.strip() for x in line.split("[",1)[1][:-1].split(","))<={"propext","Quot.sound","Classical.choice"},name
          print("Standalone native certificates:",len(entries))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbf20d-native-receipts
          path: ${{ runner.temp }}/lbf20d-native/
          if-no-files-found: warn
