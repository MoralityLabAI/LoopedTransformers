name: OLR-06E shared native rewrite frontiers
on:
  pull_request:
    paths:
      - "research/lean_cgrt_hrm400/ppt_gym/olr06e_multigoal.py"
      - "research/lean_cgrt_hrm400/ppt_gym/tests/test_olr06e.py"
      - ".github/workflows/olr06e-multigoal.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: olr06e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-multigoal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: olr06d-native-rewrite
          run-id: 45319896547
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: research/lean_cgrt_hrm400/runs/olr06e-old
      - name: Shared frontier and prefix budget tests
        working-directory: research/lean_cgrt_hrm400
        run: python -m unittest discover -s ppt_gym/tests -p "test_olr06e.py" -v
      - name: Freeze fresh multi-goal equation systems
        working-directory: research/lean_cgrt_hrm400
        run: python -m ppt_gym.olr06e_multigoal freeze --old-bank runs/olr06e-old/olr06d-bank --out runs/olr06e-bank
      - name: Global search budgets and native conjunction certification
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m ppt_gym.olr06e_multigoal score --bank runs/olr06e-bank --out runs/olr06e-eval
          python - <<'PY'
          import json
          m=json.load(open("runs/olr06e-eval/manifest.json",encoding="utf-8"))
          assert m["roots"]==24 and m["target_obligations"]==96
          assert m["policy_trials"]==168 and m["bounded_frozen_trials"]==144
          assert m["certificate"]["native_leaf_replays"]==m["certificate"]["leaf_declarations"]
          assert m["certificate"]["joint_declarations"]>=24
          assert m["model_training_updates"]==0 and m["architecture_promotion_eligible"] is False
          print("OLR06E verified conjunction scorecard",json.dumps(m["scorecard"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olr06e-native-multigoal
          path: |
            research/lean_cgrt_hrm400/runs/olr06e-bank
            research/lean_cgrt_hrm400/runs/olr06e-eval
          if-no-files-found: ignore
