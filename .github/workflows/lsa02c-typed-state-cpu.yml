name: LSA-02C fresh-root CPU public-state comparison
on:
  pull_request:
    paths:
      - 'research/lean_cgrt_hrm400/ppt_gym/typed_state.py'
      - 'research/lean_cgrt_hrm400/ppt_gym/typed_compare.py'
      - 'research/lean_cgrt_hrm400/ppt_gym/native_train.py'
      - 'research/lean_cgrt_hrm400/ppt_gym/native_order.py'
      - 'research/lean_cgrt_hrm400/ppt_gym/tests/test_typed_state.py'
      - 'docs/lsa02c_public_state_cpu_protocol.md'
      - '.github/workflows/lsa02c-typed-state-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lsa02c-cpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    name: Public-only view, matched fit and no label leakage
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Strict public typed packet and bitwise seed parity regressions
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m compileall -q ppt_gym/typed_state.py ppt_gym/typed_compare.py ppt_gym/native_order.py ppt_gym/native_train.py
          python -m unittest ppt_gym.tests.test_typed_state -v

  teacher:
    name: New Lean 4.19 train source and independent proof certificates
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: 'research/lean_cgrt_hrm400/lean'
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Freeze fresh splits; only 48 training lineages become teacher data
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -m ppt_gym.live_cli freeze --out runs/lsa02c-suite --seed 20261124 --per-split 64
          python -m ppt_gym.native_train collect --suite runs/lsa02c-suite \
            --out runs/lsa02c-teacher --roots 48 \
            --request-timeout 60 --max-seconds 720 --cert-timeout 360
          python - <<'PY'
          import json
          m=json.load(open('runs/lsa02c-teacher/manifest.json'))
          assert m['backend']['actual_lean_process'] and m['source_compiler_passed']
          assert m['reference_proofs_compiled']==48 and m['independent_lineages']==48, m
          assert m['train_examples']>=48
          assert m['query_roots_exposed_to_fit']==0 and not m['locked_test_opened']
          print('TYPED_CPU_TEACHER',m['reference_proofs_compiled'],
                m['train_examples'],m['roots_with_eight_check_reference'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsa02c-native-teacher
          path: |
            research/lean_cgrt_hrm400/runs/lsa02c-suite/
            research/lean_cgrt_hrm400/runs/lsa02c-teacher/
          retention-days: 14
          if-no-files-found: warn

  fit:
    name: Seed ${{ matrix.seed }} view ${{ matrix.view }} CPU fit
    runs-on: ubuntu-latest
    needs: [teacher]
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [107, 109]
        view: [raw, typed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lsa02c-native-teacher
          path: research/lean_cgrt_hrm400/runs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Same Plan B parameters and root-sample schedule across public inputs
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -m ppt_gym.native_train fit --teacher runs/lsa02c-teacher \
            --out runs/lsa02c-fit --middle-order ab --input-view ${{ matrix.view }} \
            --seed ${{ matrix.seed }} --steps 720 --depth 2 --width 32 --max-bytes 384 \
            --learning-rate 0.001 --threads 2 --max-seconds 300
          python - <<'PY'
          import json
          m=json.load(open('runs/lsa02c-fit/manifest.json'))
          assert m['training_source_native'] and m['optimizer_steps']==720,m
          assert m['input_view']=='${{ matrix.view }}' and m['train_order']=='ab'
          assert m['seed']==${{ matrix.seed }} and m['unique_parameter_count']==57475,m
          assert m['optimizer_calls_on_calibration_or_test']==0
          assert m['conflicting_training_view_collisions']>=0
          if m['input_view']=='typed': assert m['view_input_over_budget']==0
          print('TYPED_CPU_FIT',m['seed'],m['input_view'],
                m['mean_raw_public_bytes'],m['mean_view_public_bytes'],
                m['last_training_loss'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsa02c-fit-${{ matrix.seed }}-${{ matrix.view }}
          path: research/lean_cgrt_hrm400/runs/lsa02c-fit/
          retention-days: 14
          if-no-files-found: warn

  probe:
    name: Seed ${{ matrix.seed }} view ${{ matrix.view }} new native calibration
    runs-on: ubuntu-latest
    needs: [teacher, fit]
    timeout-minutes: 26
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [107, 109]
        view: [raw, typed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lsa02c-native-teacher
          path: research/lean_cgrt_hrm400/runs
      - uses: actions/download-artifact@v4
        with:
          name: lsa02c-fit-${{ matrix.seed }}-${{ matrix.view }}
          path: research/lean_cgrt_hrm400/runs/lsa02c-fit
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: 'research/lean_cgrt_hrm400/lean'
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Run 32 fresh proof roots, frozen AB/BA and independent reference
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m ppt_gym.native_order run --suite runs/lsa02c-suite \
            --checkpoint runs/lsa02c-fit/checkpoint.pt \
            --native-teacher runs/lsa02c-teacher/manifest.json \
            --split calibration --roots 32 --checks 8 --depth 2 \
            --max-seconds 720 --cert-timeout 360 --out runs/lsa02c-probe
          python -m ppt_gym.native_order replay --suite runs/lsa02c-suite \
            --session runs/lsa02c-probe --out runs/lsa02c-replay
          python - <<'PY'
          import json
          m=json.load(open('runs/lsa02c-probe/manifest.json'))
          r=json.load(open('runs/lsa02c-replay/replay.json'))
          assert m['status']=='complete' and m['paired_roots']==32,m
          assert m['input_view']=='${{ matrix.view }}'
          assert m['backend']['actual_lean_process']
          assert m['training_provenance']['training_lineages']==48
          assert m['training_provenance']['training_source_verified']
          assert m['training_provenance']['source_lineages_disjoint']
          assert m['standalone_reference_certificates']==32
          assert m['query_label_training_updates']==0
          assert r['replay_passed'] and r['independent_replay_episodes']==96
          assert m['architecture_promotion_eligible'] is False
          print('TYPED_NATIVE_PROBE',m['input_view'],
                m['scores']['ab']['standalone_verified_closures'],
                m['reference_reachable_within_budget'],
                'out of',m['paired_roots'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsa02c-probe-${{ matrix.seed }}-${{ matrix.view }}
          path: |
            research/lean_cgrt_hrm400/runs/lsa02c-probe/
            research/lean_cgrt_hrm400/runs/lsa02c-replay/
          retention-days: 14
          if-no-files-found: warn

  compare:
    name: Hash-bound paired fresh-root comparison
    runs-on: ubuntu-latest
    needs: [teacher, fit, probe]
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: lsa02c-native-teacher
          path: research/lean_cgrt_hrm400/runs
      - uses: actions/download-artifact@v4
        with:
          name: lsa02c-fit-107-raw
          path: research/lean_cgrt_hrm400/runs/audit/fits/107-raw
      - uses: actions/download-artifact@v4
        with:
          name: lsa02c-probe-107-raw
          path: research/lean_cgrt_hrm400/runs/audit/probes/107-raw
      - uses: actions/download-artifact@v4
        with:
          name: lsa02c-fit-107-typed
          path: research/lean_cgrt_hrm400/runs/audit/fits/107-typed
      - uses: actions/download-artifact@v4
        with:
          name: lsa02c-probe-107-typed
          path: research/lean_cgrt_hrm400/runs/audit/probes/107-typed
      - uses: actions/download-artifact@v4
        with:
          name: lsa02c-fit-109-raw
          path: research/lean_cgrt_hrm400/runs/audit/fits/109-raw
      - uses: actions/download-artifact@v4
        with:
          name: lsa02c-probe-109-raw
          path: research/lean_cgrt_hrm400/runs/audit/probes/109-raw
      - uses: actions/download-artifact@v4
        with:
          name: lsa02c-fit-109-typed
          path: research/lean_cgrt_hrm400/runs/audit/fits/109-typed
      - uses: actions/download-artifact@v4
        with:
          name: lsa02c-probe-109-typed
          path: research/lean_cgrt_hrm400/runs/audit/probes/109-typed
      - name: Same-seed initialization and theorem-root paired native effects
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m ppt_gym.typed_compare --teacher runs/lsa02c-teacher \
            --fits runs/audit/fits --probes runs/audit/probes \
            --out runs/audit/report
          python - <<'PY'
          import json
          m=json.load(open('runs/audit/report/matched_views.json'))
          assert m['calibration_unique_roots']==32
          assert m['train_lineages']==48 and m['matched_training_seeds']==[107,109]
          assert m['same_initial_weights_per_seed'] and not m['locked_evaluation_opened']
          assert not m['scientific_eligible']
          print('LSA02C_PAIR_RESULT',m['typed_minus_raw_proof_closure_rate'],
                m['descriptive_root_bootstrap_95'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsa02c-matched-public-state-evidence
          path: research/lean_cgrt_hrm400/runs/audit/report/
          retention-days: 14
          if-no-files-found: warn
