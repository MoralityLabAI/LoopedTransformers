name: OLR-06A referee feasibility reproduction
on:
  pull_request:
    paths:
      - "research/lean_cgrt_hrm400/referee_olr06/ledger_pilot.py"
      - ".github/workflows/olr06a-referee.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-synthetic-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        arm: [none, td, bu, bi, bi_ds, dense_tied, dense_untied]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Original referee script and seed roster
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: |
          set -o pipefail
          mkdir -p runs/olr06a
          sha256sum referee_olr06/ledger_pilot.py
          python -u referee_olr06/ledger_pilot.py ${{ matrix.arm }} 0,1,2 2000 | tee runs/olr06a/${{ matrix.arm }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olr06a-${{ matrix.arm }}
          path: research/lean_cgrt_hrm400/runs/olr06a/
