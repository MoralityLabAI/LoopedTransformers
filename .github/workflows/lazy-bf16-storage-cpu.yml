name: Lazy BF16 storage CPU contracts
on:
  push:
    branches: [research/nanbeige-bpd-gym-suite-towers]
    paths: ['mechinterp/nanbeige_bpd_gym/lazy_bf16*.py', 'mechinterp/nanbeige_bpd_gym/bounded_cpu_engineering.py', 'experiments/nan_bf31/**', 'experiments/nan_ram28/loader.py', 'experiments/nan_recomp09/common.py', '.github/workflows/lazy-bf16-storage-cpu.yml']
  pull_request:
    paths: ['mechinterp/nanbeige_bpd_gym/lazy_bf16*.py', 'mechinterp/nanbeige_bpd_gym/bounded_cpu_engineering.py', 'experiments/nan_bf31/**', 'experiments/nan_ram28/loader.py', 'experiments/nan_recomp09/common.py', '.github/workflows/lazy-bf16-storage-cpu.yml']
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6
      - run: python -m pip install transformers==4.46.3
      - run: python -B -m unittest mechinterp.nanbeige_bpd_gym.lazy_bf16_storage_tests mechinterp.nanbeige_bpd_gym.lazy_bf16_loop_tests experiments.nan_bf31.tests experiments.nan_bf31.stage_tests -v
      - run: python -B -S -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('mechinterp/nanbeige_bpd_gym').glob('lazy_bf16*.py')]"
