name: NBR native neuron basis and suite pilot
on:
  pull_request:
    paths:
      - 'mechinterp/neuron_basis/**'
      - 'mechinterp/loopscope02/scripts/trm_sudoku.py'
      - '.github/workflows/mechinterp-nbr-native.yml'
permissions:
  contents: read
concurrency:
  group: nbr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  toy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.1.3
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m mechinterp.neuron_basis.native --self-test
      - run: python -m mechinterp.neuron_basis.roster --count 2 --out nbr_roster.json
      - run: |
          python -m mechinterp.neuron_basis.suite --roster nbr_roster.json --out nbr_toy --toy
          python -m mechinterp.neuron_basis.audit --roster nbr_roster.json --out nbr_toy
          python -m mechinterp.neuron_basis.suite --roster nbr_roster.json --out nbr_toy_w4 --toy --precision w4
          python -m mechinterp.neuron_basis.audit --roster nbr_roster.json --out nbr_toy_w4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbr-toy
          path: |
            nbr_roster.json
            nbr_toy/
            nbr_toy_w4/
  checkpoint-pilot:
    needs: toy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - checkpoint: gaoxin492
            precision: fp32
          - checkpoint: gaoxin492
            precision: w4
          - checkpoint: yagizdevre
            precision: fp32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.1.3 huggingface_hub
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m mechinterp.neuron_basis.roster --count 2 --out nbr_roster.json
      - if: matrix.checkpoint == 'gaoxin492' && matrix.precision == 'fp32'
        run: python -m mechinterp.neuron_basis.native --roster nbr_roster.json --out nbr_native
      - run: |
          python -m mechinterp.neuron_basis.suite --roster nbr_roster.json --out nbr_suite --checkpoint ${{ matrix.checkpoint }} --precision ${{ matrix.precision }}
          python -m mechinterp.neuron_basis.audit --roster nbr_roster.json --out nbr_suite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbr-${{ matrix.checkpoint }}-${{ matrix.precision }}
          path: |
            nbr_roster.json
            nbr_native/
            nbr_suite/
