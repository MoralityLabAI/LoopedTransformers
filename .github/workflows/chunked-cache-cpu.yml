name: Chunked cache and streamed vocabulary CPU contracts
on:
  push:
    branches: [research/nanbeige-bpd-gym-suite-towers]
    paths: ['mechinterp/nanbeige_bpd_gym/chunked_*.py', 'mechinterp/nanbeige_bpd_gym/streamed_vocab_head.py', 'mechinterp/nanbeige_bpd_gym/tests/test_chunked_cache.py', 'mechinterp/nanbeige_bpd_gym/tests/test_streamed_vocab_head.py', '.github/workflows/chunked-cache-cpu.yml']
  pull_request:
    paths: ['mechinterp/nanbeige_bpd_gym/chunked_*.py', 'mechinterp/nanbeige_bpd_gym/streamed_vocab_head.py', 'mechinterp/nanbeige_bpd_gym/tests/test_chunked_cache.py', 'mechinterp/nanbeige_bpd_gym/tests/test_streamed_vocab_head.py', '.github/workflows/chunked-cache-cpu.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6
      - run: python -B -m unittest mechinterp.nanbeige_bpd_gym.tests.test_chunked_cache mechinterp.nanbeige_bpd_gym.tests.test_streamed_vocab_head -v
      - run: python -B -S -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('mechinterp/nanbeige_bpd_gym').glob('chunked_*.py')]"
