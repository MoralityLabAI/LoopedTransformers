name: MOLT-11 isolated response memory
on:
  pull_request:
    paths:
      - 'research_gym/interp/aux_gym_v2_isolated_worker.py'
      - 'research_gym/interp/aux_gym_v2_isolated_response.py'
      - 'tests/test_aux_isolated_response.py'
      - '.github/workflows/molt-isolated-response.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-response:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/BPD
          ref: 722613a80d80af0e80bb9f5ac1ce83eef111e4f7
          path: .native-bpd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pytest
      - run: python -m pytest -q tests/test_aux_isolated_response.py
      - name: Prepare a larger fixed development teacher
        run: |
          python -m research_gym.interp.aux_gym_v2 build --out /tmp/molt11/data --seed 2026112711 --train-quota 4 --eval-quota 2
          python -m research_gym.interp.aux_gym_v2 pilot --data /tmp/molt11/data --out /tmp/molt11/teacher --family modular_recurrence --arm LOOP-T --mode symbolic_trace --seed 1 --steps 256 --batch 8 --threads 1
          python -m research_gym.interp.aux_gym_v2_native_bpd --bpd-checkout .native-bpd --data /tmp/molt11/data --run /tmp/molt11/teacher --out /tmp/molt11/factors --seed 1 --components 8 --steps 4 --warmup 2 --batch 2 --threads 1 --smoke-no-null
      - name: Isolated target generation, training and parity audit
        run: |
          python -m research_gym.interp.aux_gym_v2_isolated_response --data /tmp/molt11/data --run /tmp/molt11/teacher --factors /tmp/molt11/factors --out /tmp/molt11/isolation --anchors 8 --donors 32 --updates 16 --batch 4 --address-mib 8192 --rss-mib 2048 --cpu-seconds 180 --wall-seconds 240
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: molt11-isolated-response
          path: |
            /tmp/molt11/isolation
            /tmp/molt11/teacher/receipt.json
            /tmp/molt11/factors/receipt.json
          retention-days: 7
          if-no-files-found: warn
