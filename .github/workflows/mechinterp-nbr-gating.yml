name: NBR-02A gated sparse write replay
on:
  pull_request:
    paths:
      - 'mechinterp/nbr_gating/**'
      - '.github/workflows/mechinterp-nbr-gating.yml'
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '180'
  PYTHONUNBUFFERED: '1'
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m mechinterp.nbr_gating.replay --self-test
      - uses: actions/download-artifact@v4
        with:
          name: nbr-registered
          run-id: 45519229947
          github-token: ${{ github.token }}
          path: original
      - run: |
          test "$(cat original/result/run-id.txt)" = 45519229947
          echo '763ea63c8565245928a7dd59f7b56b7916fad6e2f8d3126075a801c56a36f224  original/source/roster.json' | sha256sum -c
          python -m mechinterp.nbr_gating.replay --roster original/source/roster.json --receipts original/result/native --out result/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbr-gated-sparse-replay
          path: result/
          if-no-files-found: warn
          retention-days: 90
