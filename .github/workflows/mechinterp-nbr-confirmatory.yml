name: NBR-01 and NBR-01B confirmatory
on:
  pull_request:
    types: [opened]
    branches: [research/nbr01b-fixed-basis-control-20261125]
    paths:
      - 'mechinterp/nbr_confirmatory/**'
      - '.github/workflows/mechinterp-nbr-confirmatory.yml'
permissions:
  contents: read
  actions: read
jobs:
  registered:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.1.3
      - uses: actions/download-artifact@v4
        with:
          name: nbr-candidate-source
          run-id: 45518646045
          github-token: ${{ github.token }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: nbr-toy
          run-id: 45515740820
          github-token: ${{ github.token }}
          path: pilot
      - uses: actions/download-artifact@v4
        with:
          name: ls-sae08-model-blind-first-admissible-source-receipts
          run-id: 43851165980
          github-token: ${{ github.token }}
          path: ls08
      - name: Independent source admission before model access
        run: |
          python -m mechinterp.nbr_confirmatory.audit --stage source --roster source/roster.json --receipt source/source-receipt.json --pilot pilot/nbr_roster.json --s8 ls08/source_only.json --out result/source-audit.json
      - run: |
          python -m pip install huggingface_hub==0.36.0
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Frozen registered inference
        run: python -m mechinterp.neuron_basis.native --roster source/roster.json --out result/native
      - name: Fixed-basis null replay
        run: python -m mechinterp.nbr_fixed_basis.control --receipts result/native --out result/fixed.json
      - name: Apply preregistered gates
        run: |
          python -m mechinterp.nbr_confirmatory.audit --stage gate --roster source/roster.json --native result/native --fixed result/fixed.json --out result/gates.json
      - name: Preserve status and provenance
        if: always()
        run: |
          mkdir -p result
          printf '%s\n' "${{ github.run_id }}" > result/run-id.txt
          printf '%s\n' "${{ github.run_attempt }}" > result/run-attempt.txt
          git rev-parse HEAD > result/workflow-commit.txt
          if test ! -f result/gates.json; then
            printf '{"verdict":"INCOMPLETE","reason":"registered source, model, or receipt stage did not finish"}\n' > result/incomplete.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbr-registered
          path: |
            source/
            result/
          if-no-files-found: error
          retention-days: 90
