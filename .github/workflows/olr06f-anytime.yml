name: OLR-06F anytime metered abstraction
on:
  pull_request:
    paths:
      - "research/lean_cgrt_hrm400/ppt_gym/olr06f_anytime.py"
      - "research/lean_cgrt_hrm400/ppt_gym/tests/test_olr06f.py"
      - ".github/workflows/olr06f-anytime.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: olr06f-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-anytime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: olr06e-native-multigoal
          run-id: 45321437290
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: research/lean_cgrt_hrm400/runs/olr06f-old
      - name: Test anytime bounds and total budget
        working-directory: research/lean_cgrt_hrm400
        run: python -m unittest discover -s ppt_gym/tests -p "test_olr06f.py" -v
      - name: Freeze fresh alpha-disjoint conjunctions
        working-directory: research/lean_cgrt_hrm400
        run: python -m ppt_gym.olr06f_anytime freeze --old-bank runs/olr06f-old/olr06e-bank --out runs/olr06f-bank
      - name: Total work search and native conjunction certification
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m ppt_gym.olr06f_anytime score --bank runs/olr06f-bank --out runs/olr06f-eval
          python - <<'PY'
          import json
          m=json.load(open("runs/olr06f-eval/manifest.json",encoding="utf-8"))
          assert m["roots"]==24 and m["target_obligations"]==96,m
          assert m["policy_trials"]==216 and m["bounded_frozen_trials"]==192,m
          assert m["certificate"]["native_leaf_replays"]==m["certificate"]["leaf_declarations"]
          assert m["certificate"]["joint_declarations"]>=24
          assert m["model_training_updates"]==0 and m["architecture_promotion_eligible"] is False
          print("OLR06F total work scorecard",json.dumps(m["scorecard"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olr06f-native-anytime
          path: |
            research/lean_cgrt_hrm400/runs/olr06f-bank
            research/lean_cgrt_hrm400/runs/olr06f-eval
          if-no-files-found: ignore
