name: LBF-10 native structural action-set and legacy transport
on:
  pull_request:
    paths:
      - "research/lean_cgrt_hrm400/ppt_gym/lbf08_repair.py"
      - "research/lean_cgrt_hrm400/ppt_gym/tests/test_lbf08_repair.py"
      - "research/lean_cgrt_hrm400/ppt_gym/tests/test_lbf10_structural.py"
      - "research/lite_braille_fresco/lbf10_*"
      - "research/lean_cgrt_hrm400/ppt_gym/lbf10_*.py"
      - "research/lean_cgrt_hrm400/ppt_gym/live_suite.py"
      - "research/lean_cgrt_hrm400/ppt_gym/live_cli.py"
      - "research/lean_cgrt_hrm400/ppt_gym/tests/test_lbf10_structural.py"
      - ".github/workflows/lbf10-structural-transport.yml"
  push:
    branches: ["research/lbf-gym-v0-20261123"]
    paths:
      - "research/lean_cgrt_hrm400/ppt_gym/lbf08_repair.py"
      - "research/lean_cgrt_hrm400/ppt_gym/tests/test_lbf08_repair.py"
      - "research/lean_cgrt_hrm400/ppt_gym/tests/test_lbf10_structural.py"
      - "research/lite_braille_fresco/lbf10_*"
      - "research/lean_cgrt_hrm400/ppt_gym/lbf10_*.py"
      - "research/lean_cgrt_hrm400/ppt_gym/live_suite.py"
      - "research/lean_cgrt_hrm400/ppt_gym/live_cli.py"
      - "research/lean_cgrt_hrm400/ppt_gym/tests/test_lbf10_structural.py"
      - ".github/workflows/lbf10-structural-transport.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lbf10-native-multishortest
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Fake-only unit tests and code syntax
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m compileall -q ppt_gym/lbf10_source.py ppt_gym/lbf10_uniform.py ppt_gym/lbf08_repair.py ppt_gym/tests/test_lbf08_repair.py ppt_gym/tests/test_lbf10_structural.py \
            ../lite_braille_fresco/lbf10_exposure.py ../lite_braille_fresco/lbf10_compare.py
          python -m unittest ppt_gym.tests.test_lbf10_structural ppt_gym.tests.test_lbf08_repair -v

  native:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Native train-only 48-root shortest-action teacher
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m ppt_gym.live_cli freeze --out runs/lbf10-suite --seed 20261201 --per-split 64 --structural-alt
          python -m ppt_gym.live_cli freeze --out runs/lbf10-legacy-suite --seed 20261202 --per-split 64
          python - <<'PY'
          from pathlib import Path
          from ppt_gym.live_suite import load_suite
          source,_=load_suite(Path("runs/lbf10-suite"),"train",64)
          target,_=load_suite(Path("runs/lbf10-legacy-suite"),"calibration",32)
          current,_=load_suite(Path("runs/lbf10-suite"),"calibration",32)
          assert len(source)==64 and len(target)==len(current)==32
          assert not ({c.lineage for c in source} & {c.lineage for c in target})
          assert not ({c.lineage for c in current} & {c.lineage for c in target})
          PY
          python -m ppt_gym.native_train collect --suite runs/lbf10-suite --out runs/lbf10-teacher \
            --roots 48 --request-timeout 60 --max-seconds 720 --cert-timeout 360
          python - <<'PY'
          import json
          m=json.load(open('runs/lbf10-teacher/manifest.json'))
          assert m["backend"]["actual_lean_process"] and m["source_compiler_passed"]
          assert m["reference_proofs_compiled"]==48 and m["independent_lineages"]==48
          assert m["query_roots_exposed_to_fit"]==0 and not m["locked_test_opened"]
          print("LBF10_NATIVE_SOURCE",m["train_examples"],m["roots_with_eight_check_reference"],flush=True)
          PY
      - name: Frozen 360-step behavior checkpoint on native source only
        working-directory: research/lean_cgrt_hrm400
        run: |
          python - <<'PY'
          from pathlib import Path
          import torch
          from ppt_gym.native_train import fit
          torch.use_deterministic_algorithms(True); torch.set_num_threads(1)
          m=fit(Path("runs/lbf10-teacher"),Path("runs/lbf10-behavior"),
                order="ab",seed=107,steps=360,depth=2,width=32,max_bytes=384,
                threads=1,learning_rate=.001,max_seconds=300,input_view="hybrid_rule_intact")
          assert m["training_source_native"] and m["optimizer_steps"]==360
          assert m["unique_parameter_count"]==57475 and m["optimizer_calls_on_calibration_or_test"]==0
          print("LBF10_BEHAVIOR",m["checkpoint_sha256"],flush=True)
          PY
      - name: Collect model-visited native episodes, certify recovery and independently replay
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m ppt_gym.lbf08_repair collect --suite runs/lbf10-suite \
            --teacher runs/lbf10-teacher --checkpoint runs/lbf10-behavior/checkpoint.pt \
            --roots 48 --max-seconds 900 --cert-timeout 360 --out runs/lbf10-visited-source
          python -m ppt_gym.lbf08_repair replay --suite runs/lbf10-suite \
            --teacher runs/lbf10-teacher --checkpoint runs/lbf10-behavior/checkpoint.pt \
            --collection runs/lbf10-visited-source --out runs/lbf10-visited-replay
          python - <<'PY'
          import json
          m=json.load(open("runs/lbf10-visited-source/manifest.json"))
          r=json.load(open("runs/lbf10-visited-replay/replay.json"))
          assert m["native_backend"]["actual_lean_process"] and m["behavior_root_episodes"]==48
          assert m["visited_witnessed_lineages"]>=12 and m["query_roots_exposed_to_collection"]==0
          assert m["teacher_forced_standalone_certificates"]==m["teacher_forced_kernel_recoveries"]
          assert r["native_replay_passed"] and r["behavior_episodes_replayed"]==48
          assert r["teacher_forced_full_proofs_replayed"]==m["teacher_forced_standalone_certificates"]
          assert not m["locked_test_opened"] and not m["scientific_eligible"]
          print("LBF10_VISITED",m["model_visitation_frames"],"roots",m["visited_witnessed_lineages"],
                "censored",m["censored_visits"],"model_autonomous",m["model_autonomous_kernel_closures"],
                "oracle_assisted",m["teacher_forced_standalone_certificates"],flush=True)
          PY
      - name: Hard gate native multi-optimal train exposure before fitting
        working-directory: research/lite_braille_fresco
        run: |
          python lbf10_exposure.py --suite ../lean_cgrt_hrm400/runs/lbf10-suite \
            --teacher ../lean_cgrt_hrm400/runs/lbf10-teacher \
            --collection ../lean_cgrt_hrm400/runs/lbf10-visited-source \
            --behavior ../lean_cgrt_hrm400/runs/lbf10-behavior/checkpoint.pt \
            --replay-receipt ../lean_cgrt_hrm400/runs/lbf10-visited-replay/replay.json \
            --out runs/lbf10-exposure
      - name: Same CPU, three arms times two seeds, exact source-only repeat
        working-directory: research/lean_cgrt_hrm400
        run: |
          python - <<'PY'
          from pathlib import Path
          from ppt_gym.lbf08_repair import fit,ARMS
          import json,platform,torch
          torch.use_deterministic_algorithms(True);torch.set_num_threads(1)
          root=Path("runs/lbf10-cells");root.mkdir(parents=True,exist_ok=False)
          teacher=Path("runs/lbf10-teacher")
          visited=Path("runs/lbf10-visited-source")
          suite=Path("runs/lbf10-suite")
          behavior=Path("runs/lbf10-behavior/checkpoint.pt")
          replay=Path("runs/lbf10-visited-replay/replay.json")
          for seed in (107,109):
              for arm in ARMS:
                  dest=root/f"{seed}-{arm}"/"fit";dest.parent.mkdir()
                  m=fit(teacher,visited,suite,behavior,replay,dest,
                        arm=arm,seed=seed,steps=720,threads=1,max_seconds=600)
                  assert m["updates"]==720 and m["parameter_count"]==57475
                  print("LBF10_FIT",seed,arm,m["checkpoint_sha256"],
                        "visit_updates",m["model_visited_updates"],flush=True)
          original=root/"107-source_only"/"fit"
          duplicate=root/"duplicate-107-source_only"/"fit";duplicate.parent.mkdir()
          fit(teacher,visited,suite,behavior,replay,duplicate,
              arm="source_only",seed=107,steps=720,threads=1,max_seconds=600)
          a=torch.load(original/"checkpoint.pt",map_location="cpu",weights_only=True)
          b=torch.load(duplicate/"checkpoint.pt",map_location="cpu",weights_only=True)
          same=set(a["weights"])==set(b["weights"]) and all(
              torch.equal(a["weights"][k],b["weights"][k]) for k in a["weights"])
          same_log=(original/"optimizer_steps.jsonl").read_bytes()==(duplicate/"optimizer_steps.jsonl").read_bytes()
          result={"same_weights":bool(same),"same_optimizer_trace":bool(same_log),
                  "torch":torch.__version__,"python":platform.python_version(),"seed":107,"arm":"source_only"}
          (root/"determinism.json").write_text(json.dumps(result,sort_keys=True)+"\n")
          print("LBF10_DETERMINISM",result,flush=True)
          assert same and same_log
          PY
      - name: Six frozen learners on both 32-root native development cohorts
        working-directory: research/lean_cgrt_hrm400
        run: |
          for seed in 107 109; do
            for arm in source_only visited_one visited_set; do
              cell="runs/lbf10-cells/$seed-$arm"
              python -m ppt_gym.native_order run --suite runs/lbf10-suite \
                --checkpoint "$cell/fit/checkpoint.pt" \
                --native-teacher runs/lbf10-teacher/manifest.json \
                --split calibration --roots 32 --checks 8 --depth 2 \
                --max-seconds 900 --cert-timeout 360 --out "$cell/calibration"
              python -m ppt_gym.native_order replay --suite runs/lbf10-suite \
                --session "$cell/calibration" --out "$cell/replay"
              transport="runs/lbf10-transport-cells/$seed-$arm"
              mkdir -p "$transport"
              ln -s "$(realpath "$cell/fit")" "$transport/fit"
              python -m ppt_gym.native_order run --suite runs/lbf10-legacy-suite \
                --checkpoint "$cell/fit/checkpoint.pt" \
                --native-teacher runs/lbf10-teacher/manifest.json \
                --split calibration --roots 32 --checks 8 --depth 2 \
                --max-seconds 900 --cert-timeout 360 --out "$transport/calibration"
              python -m ppt_gym.native_order replay --suite runs/lbf10-legacy-suite \
                --session "$transport/calibration" --out "$transport/replay"
            done
          done
      - name: Exact native public-candidate uniform baseline for each cohort
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m ppt_gym.lbf10_uniform --suite runs/lbf10-suite --out runs/lbf10-uniform-structural
          python -m ppt_gym.lbf10_uniform --suite runs/lbf10-legacy-suite --out runs/lbf10-uniform-legacy
      - name: Root-paired certified proof comparison and preregistered transport gate
        working-directory: research/lite_braille_fresco
        run: |
          python lbf10_compare.py --suite ../lean_cgrt_hrm400/runs/lbf10-suite \
            --legacy-suite ../lean_cgrt_hrm400/runs/lbf10-legacy-suite \
            --exposure runs/lbf10-exposure --teacher ../lean_cgrt_hrm400/runs/lbf10-teacher \
            --collection ../lean_cgrt_hrm400/runs/lbf10-visited-source \
            --replay ../lean_cgrt_hrm400/runs/lbf10-visited-replay \
            --runs ../lean_cgrt_hrm400/runs/lbf10-cells \
            --transport ../lean_cgrt_hrm400/runs/lbf10-transport-cells \
            --uniform-structural ../lean_cgrt_hrm400/runs/lbf10-uniform-structural \
            --uniform-legacy ../lean_cgrt_hrm400/runs/lbf10-uniform-legacy --out runs/lbf10-comparison
      - name: Frozen native-trained model to SVG fresco with message probes
        working-directory: research/lite_braille_fresco
        run: |
          python ppt_bridge.py \
            --checkpoint ../lean_cgrt_hrm400/runs/lbf10-cells/109-visited_set/fit/checkpoint.pt \
            --episodes ../lean_cgrt_hrm400/runs/lbf10-cells/109-visited_set/calibration/paired_episodes.jsonl \
            --session-manifest ../lean_cgrt_hrm400/runs/lbf10-cells/109-visited_set/calibration/manifest.json \
            --replay-receipt ../lean_cgrt_hrm400/runs/lbf10-cells/109-visited_set/replay/replay.json \
            --max-episodes 4 --depth 3 --out runs/lbf10-fresco-observations
          python lbf_gym.py encode --observations runs/lbf10-fresco-observations/observations.jsonl \
            --out runs/lbf10-fresco-encoded
          python lbf_gym.py render --encoded runs/lbf10-fresco-encoded/encoded.jsonl \
            --out runs/lbf10-fresco.svg
          python - <<'PY'
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          from lbf_gym import read_jsonl
          m=json.load(open("runs/lbf10-fresco-observations/manifest.json"))
          rows=read_jsonl(Path("runs/lbf10-fresco-observations/message_probes.jsonl"))
          ET.parse("runs/lbf10-fresco.svg")
          assert m["source_attestation"]["native_replay_verified"] and m["input_view"]=="hybrid_rule_intact"
          assert not m["labels_exported"] and m["lean_calls"]==0
          assert len(rows)==m["message_probe_rows"]
          assert all(x["max_abs_logit_delta"]<1e-5 for x in rows if x["pass"]==1)
          print("LBF10_FRESCO",m["n_episodes"],len(rows),
                max(x["max_abs_logit_delta"] for x in rows),
                sum(x["changed_top_candidate"] for x in rows),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbf10-native-structural-transport
          retention-days: 14
          if-no-files-found: warn
          path: |
            research/lean_cgrt_hrm400/runs/lbf10-suite/manifest.json
            research/lean_cgrt_hrm400/runs/lbf10-suite/train.jsonl
            research/lean_cgrt_hrm400/runs/lbf10-suite/calibration.jsonl
            research/lean_cgrt_hrm400/runs/lbf10-legacy-suite/manifest.json
            research/lean_cgrt_hrm400/runs/lbf10-legacy-suite/calibration.jsonl
            research/lean_cgrt_hrm400/runs/lbf10-transport-cells/*/calibration/
            research/lean_cgrt_hrm400/runs/lbf10-transport-cells/*/replay/
            research/lean_cgrt_hrm400/runs/lbf10-uniform-structural/
            research/lean_cgrt_hrm400/runs/lbf10-uniform-legacy/
            research/lean_cgrt_hrm400/runs/lbf10-teacher/
            research/lean_cgrt_hrm400/runs/lbf10-behavior/
            research/lean_cgrt_hrm400/runs/lbf10-visited-source/
            research/lean_cgrt_hrm400/runs/lbf10-visited-replay/
            research/lean_cgrt_hrm400/runs/lbf10-cells/determinism.json
            research/lean_cgrt_hrm400/runs/lbf10-cells/*/fit/
            research/lean_cgrt_hrm400/runs/lbf10-cells/*/calibration/
            research/lean_cgrt_hrm400/runs/lbf10-cells/*/replay/replay.json
            research/lite_braille_fresco/runs/lbf10-exposure/
            research/lite_braille_fresco/runs/lbf10-comparison/
            research/lite_braille_fresco/runs/lbf10-fresco-observations/
            research/lite_braille_fresco/runs/lbf10-fresco-encoded/
            research/lite_braille_fresco/runs/lbf10-fresco.svg
