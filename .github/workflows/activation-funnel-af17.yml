name: AF-17 Bellman STOP calibration and independent Horn proof audit
on:
  push:
    branches: [feat/activation-funnel-af17-bellman-stop]
    paths:
      - 'experiments/activation_funnel_af17/**'
      - '.github/workflows/activation-funnel-af17.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
concurrency:
  group: af17-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Run normal and optimized independent tests
        run: |
          set -euo pipefail
          mkdir -p artifacts/af17/preflight
          git rev-parse HEAD > artifacts/af17/preflight/source_revision.txt
          sha256sum experiments/activation_funnel_af17/PROTOCOL.json > artifacts/af17/preflight/protocol.sha256
          python -m unittest discover -s experiments/activation_funnel_af17/tests -p 'test_*.py' -v 2>&1 | tee artifacts/af17/preflight/normal.log
          python -O -m unittest discover -s experiments/activation_funnel_af17/tests -p 'test_*.py' -v 2>&1 | tee artifacts/af17/preflight/optimized.log
          python -m experiments.activation_funnel_af17.experiment manifest --out artifacts/af17/preflight/recreated_manifest.json
          cmp artifacts/af17/preflight/recreated_manifest.json experiments/activation_funnel_af17/fresh_manifest.json
      - name: Verify independent finite-integer Bellman lemmas in Lean 4.19.0
        run: |
          set -euo pipefail
          LEAN_ARCHIVE="$RUNNER_TEMP/af17-lean-4.19.0-linux.tar.zst"
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o "$LEAN_ARCHIVE"
          echo "6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  $LEAN_ARCHIVE" | sha256sum --check --strict
          tar --zstd -xf "$LEAN_ARCHIVE" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/lean-4.19.0-linux/bin/lean" experiments/activation_funnel_af17/BellmanGap.lean 2>&1 | tee artifacts/af17/preflight/lean.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: af17-preflight-${{ github.run_id }}
          path: artifacts/af17/preflight
          retention-days: 30
  train-evaluate:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        seed: [17,29,43,61]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Train fixed 4-arm, 240/360-update matrix
        run: |
          set -euo pipefail
          git rev-parse HEAD > source_revision.txt
          python -m experiments.activation_funnel_af17.experiment train --seed ${{ matrix.seed }} \
            --out artifacts/af17/s${{ matrix.seed }}/training 2>&1 | tee artifacts/af17/s${{ matrix.seed }}/train.log
      - name: Evaluate frozen models on untouched heldout sets
        run: |
          python -m experiments.activation_funnel_af17.experiment evaluate --seed ${{ matrix.seed }} \
            --training artifacts/af17/s${{ matrix.seed }}/training \
            --out artifacts/af17/s${{ matrix.seed }}/evaluation 2>&1 | tee artifacts/af17/s${{ matrix.seed }}/evaluate.log
      - name: Independent full Horn and sampled Bellman-BFS audit
        run: |
          python -m experiments.activation_funnel_af17.verify --seed ${{ matrix.seed }} \
            --training artifacts/af17/s${{ matrix.seed }}/training \
            --evaluation artifacts/af17/s${{ matrix.seed }}/evaluation \
            --out artifacts/af17/s${{ matrix.seed }}/evaluation/independent_audit.json 2>&1 | tee artifacts/af17/s${{ matrix.seed }}/audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: af17-s${{ matrix.seed }}-${{ github.run_id }}
          path: artifacts/af17
          retention-days: 30
  aggregate:
    needs: train-evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source and aggregate dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - uses: actions/download-artifact@v4
        with:
          pattern: af17-s*-${{ github.run_id }}
          merge-multiple: true
          path: artifacts/af17
      - name: Independently aggregate all qualified and ineligible results
        run: |
          python -m experiments.activation_funnel_af17.aggregate --root artifacts/af17 --out artifacts/af17/results.json
          sha256sum artifacts/af17/results.json > artifacts/af17/results.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: af17-results-${{ github.run_id }}
          path: artifacts/af17/results*
          retention-days: 30
