name: ROC-05A fresh-seed permutation replication

on:
  push:
    paths:
      - 'configs/roc05_fresh_permutation_replication_v1.json'
      - 'research_gym/analysis/roc05_permutation_source.py'
      - 'research_gym/analysis/roc05_permutation_train.py'
      - 'research_gym/analysis/roc05_summarize.py'
      - '.github/workflows/roc05-six-seed-training.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-seed:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        seed: [20261117231, 20261117233, 20261117239, 20261117241, 20261117251, 20261117257]
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU PyTorch without accelerator downloads
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Generate locked sources, original sealed inputs excluded
        run: |
          python -m research_gym.analysis.roc05_permutation_source --out-dir /tmp/roc05_sources
      - name: Run the paired low-four / high-512 model at frozen 1,920 steps
        run: |
          python -m research_gym.analysis.roc05_permutation_train \
            --seed ${{ matrix.seed }} --source-dir /tmp/roc05_sources --outdir /tmp/roc05_results
      - name: Verify two checkpoints and two 256-case prediction tables
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          seed=int("${{ matrix.seed }}")
          folder=Path('/tmp/roc05_results')
          receipt=json.loads((folder/f'roc05_S{seed}_receipt.json').read_text())
          assert receipt['seed']==seed and receipt['steps']==1920
          assert receipt['identical_start'] and receipt['identical_sample_indices']
          assert not receipt['original_roc02_sealed_evaluated']
          assert not receipt['roc05_reserved_test_evaluated']
          for arm in ('low_affine4','high_permutation512'):
              path=folder/f'roc05_{arm}_S{seed}_step1920.pt'
              assert hashlib.sha256(path.read_bytes()).hexdigest()==receipt['checkpoints'][arm]['sha256']
              assert (folder/f'roc05_{arm}_S{seed}_development_predictions.csv').is_file()
          print('ROC-05A two original models, dev control receipts and locked protocol PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ROC05A-seed-${{ matrix.seed }}
          path: /tmp/roc05_results/
          retention-days: 90

  summarize-six-seeds:
    needs: train-seed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: ROC05A-seed-*
          merge-multiple: true
          path: /tmp/roc05_all
      - name: Independent exact 64-sign six-seed audit and scientific gates
        run: |
          python -m research_gym.analysis.roc05_summarize \
            --receipt-dir /tmp/roc05_all \
            --out /tmp/roc05_all/ROC05A_INDEPENDENT_SIX_SEED_SUMMARY.json
      - name: Build fully SHA-verified train/dev-only replay archive
        run: |
          python -m research_gym.analysis.roc05_permutation_source --out-dir /tmp/roc05_sources
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, zipfile
          out=Path('/tmp/roc05_package')
          out.mkdir(exist_ok=True)
          for p in Path('/tmp/roc05_all').iterdir():
              if p.is_file():
                  shutil.copy2(p,out/p.name)
          for p in Path('/tmp/roc05_sources').iterdir():
              if p.is_file():
                  shutil.copy2(p,out/p.name)
          inputs=[
             'configs/roc05_fresh_permutation_replication_v1.json',
             'experiments/roc05_fresh_replication/PROTOCOL.md',
             'research_gym/analysis/roc05_permutation_source.py',
             'research_gym/analysis/roc04_permutation_source.py',
             'research_gym/analysis/roc05_permutation_train.py',
             'research_gym/analysis/roc05_summarize.py',
             'research_gym/analysis/roc03b_query_table_memory.py',
             'research_gym/analysis/roc02_delayed_rule_source.py',
             'research_gym/analysis/roc02_tied_train.py',
             'tests/test_roc05_permutation_source.py',
          ]
          for name in inputs:
              p=Path(name)
              target=out/p
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,target)
          allfiles=sorted(p for p in out.rglob('*') if p.is_file())
          manifest={
              'study':'ROC-05A-independent-rule-pool-and-model-seed-replication-v1',
              'includes_original_roc02_sealed_inputs':False,
              'includes_roc05_reserved_test_examples':False,
              'model_count':12,'seed_count':6,
              'files':[{'path':str(p.relative_to(out)),
                        'bytes':p.stat().st_size,
                        'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                       for p in allfiles]
          }
          (out/'ROC05A_REPRODUCIBILITY_MANIFEST.json').write_text(
                json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          archive=Path('/tmp/ROC05A_six_seed_permutation_transfer.zip')
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(x for x in out.rglob('*') if x.is_file()):
                  info=zipfile.ZipInfo(str(p.relative_to(out)),(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(info,p.read_bytes())
          print('Archive bytes:',archive.stat().st_size)
          print('Archive sha256:',hashlib.sha256(archive.read_bytes()).hexdigest())
          print('Verified members:',len(manifest['files']))
          assert not any('sealed_test_inputs' in x['path'] for x in manifest['files'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ROC05A-six-fresh-seed-independent-rule-pool-replay
          path: |
            /tmp/ROC05A_six_seed_permutation_transfer.zip
            /tmp/roc05_all/ROC05A_INDEPENDENT_SIX_SEED_SUMMARY.json
          retention-days: 90
