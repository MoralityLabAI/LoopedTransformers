name: OLR-06D opaque rewrite search
on:
  pull_request:
    paths:
      - "research/lean_cgrt_hrm400/ppt_gym/olr06d*.py"
      - "research/lean_cgrt_hrm400/ppt_gym/tests/test_olr06d.py"
      - ".github/workflows/olr06d-rewrite.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: olr06d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: lsa02k-equality-native-preflight
          run-id: 45281056858
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: research/lean_cgrt_hrm400/runs/olr06d-old
      - name: Check exact PDB admissibility and matched reader
        working-directory: research/lean_cgrt_hrm400
        run: python -m unittest discover -s ppt_gym/tests -p "test_olr06d.py" -v
      - name: Freeze fresh alpha lineages and fit native certified source distances
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m ppt_gym.olr06d_campaign freeze --old-manifest runs/olr06d-old/lsa02k-suite/manifest.json --out runs/olr06d-bank
          python -m ppt_gym.olr06d_campaign fit --bank runs/olr06d-bank --out runs/olr06d-fit
      - name: Fixed budget search and independent native certification
        working-directory: research/lean_cgrt_hrm400
        run: |
          python -m ppt_gym.olr06d_campaign score --bank runs/olr06d-bank --fit runs/olr06d-fit --out runs/olr06d-eval
          python - <<'PY'
          import json
          f=json.load(open("runs/olr06d-fit/manifest.json"))
          m=json.load(open("runs/olr06d-eval/manifest.json"))
          assert f["train_frames"]==576 and f["calibration_frames"]==144
          assert f["source_certificate"]==720 and f["source_reference_native_replays"]==60
          assert len(f["models"])==15
          assert m["query_roots"]==32 and m["policy_trials"]==608
          assert m["frozen_bounded_plans"]==576
          assert m["native_independent_replays"]==m["independent_certificates"]
          assert m["architecture_promotion_eligible"] is False
          print("OLR06D native rewrite scorecard",json.dumps(m["scorecard"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olr06d-native-rewrite
          path: |
            research/lean_cgrt_hrm400/runs/olr06d-bank
            research/lean_cgrt_hrm400/runs/olr06d-fit
            research/lean_cgrt_hrm400/runs/olr06d-eval
          if-no-files-found: ignore
