name: BPD online SVD reserved64 CPU audit

on:
  push:
    branches:
      - research/bpd-online-svd-reserved64-20261117
    paths:
      - mechinterp/bpd/docs/B4_ONLINE_SVD_RESERVED64_REGISTRATION_20261117.md
      - mechinterp/bpd/scripts/audit_b4_online_svd_reserved64.py
      - mechinterp/bpd/tests/test_b4_reserved64_protocol.py
      - .github/workflows/bpd-online-svd-reserved64.yml
  pull_request:
    branches:
      - feat/mechinterp-bpd
  workflow_dispatch:

env:
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  source-lock-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed CPU versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.3.5' 'huggingface_hub==2.4.0' pytest
      - name: Run source-lock and stats tests
        run: |
          python -m py_compile mechinterp/bpd/scripts/audit_b4_online_svd_reserved64.py
          python -m pytest mechinterp/bpd/tests/test_b4_reserved64_protocol.py -q

  run-pretrained-reserved64:
    needs: source-lock-and-regression
    strategy:
      fail-fast: false
      matrix:
        checkpoint: [gaoxin492, yagizdevre]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed CPU versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.3.5' 'huggingface_hub==2.4.0'
      - name: Execute 64 reserved WB-Stall boards in eight fixed chunks
        run: |
          python mechinterp/bpd/scripts/audit_b4_online_svd_reserved64.py \
            --checkpoint ${{ matrix.checkpoint }} --device cpu \
            --out reserved64_${{ matrix.checkpoint }}_cpu_pass20.json
      - name: Verify end state and show complete paired result
        run: |
          python - <<'PY'
          import json, os, math
          name = "${{ matrix.checkpoint }}"
          path = f"reserved64_{name}_cpu_pass20.json"
          data = json.load(open(path, encoding="utf-8"))
          assert data["status"] == "complete" and data["completed_chunks"] == 8
          assert len(data["per_board"]) == 64 and data["result"]["n_boards"] == 64
          assert data["result"]["target_repeat_max_abs_kl"] < 1e-5
          s=data["result"]
          print(name, "static",s["mean_static_kl"], "oracle",s["mean_oracle_kl"],
                "online",s["mean_online_kl"])
          print(name, "paired D",s["mean_online_minus_oracle_kl"],
                "bootstrap95",s["paired_mean_delta_bootstrap_ci95"],
                "upper97.5 M",s["upper_97_5pct_bootstrap_mean_delta_minus_margin"],
                "within 10% static margin",s["noninferior_per_checkpoint"],
                "signflip p",s["signflip_one_sided_superiority_p"],
                "ESS",s["effect_abs_ess"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write(f"## B4 reserved64 CPU FP32: {name}\n")
              f.write(f"Mean KL: static {s['mean_static_kl']:.6g}, clean-oracle {s['mean_oracle_kl']:.6g}, online {s['mean_online_kl']:.6g}\n\n")
              f.write(f"Primary noninferiority per checkpoint: {s['noninferior_per_checkpoint']}, upper bound M {s['upper_97_5pct_bootstrap_mean_delta_minus_margin']:.6g}\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpd-online-svd-reserved64-${{ matrix.checkpoint }}
          path: reserved64_${{ matrix.checkpoint }}_cpu_pass20.json
          if-no-files-found: warn
          retention-days: 60
