name: NEC-03V remaining seven original source-only CPU activation audits

on:
  push:
    branches: ["research/nec03v-source-group-redesign-20261122"]
    paths: [".github/workflows/nec03v-source-activation-original-seven.yml"]
  pull_request:
    paths: [".github/workflows/nec03v-source-activation-original-seven.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { world: 1, source_run: 44899750508, source_art: nec03o-refit-source-root-1, t_art: nec03t-source-root-1, reset_art: nec03nb-warm-source-root-1 }
          - { world: 2, source_run: 44899750508, source_art: nec03o-refit-source-root-2, t_art: nec03t-source-root-2, reset_art: nec03nb-warm-source-root-2 }
          - { world: 3, source_run: 44899750508, source_art: nec03o-refit-source-root-3, t_art: nec03t-source-root-3, reset_art: nec03nb-warm-source-root-3 }
          - { world: 4, source_run: 44900628360, source_art: nec03ob-source-root-4, t_art: nec03t-source-root-4, reset_art: none }
          - { world: 5, source_run: 44900628360, source_art: nec03ob-source-root-5, t_art: nec03t-source-root-5, reset_art: none }
          - { world: 6, source_run: 44900628360, source_art: nec03ob-source-root-6, t_art: nec03t-source-root-6, reset_art: none }
          - { world: 7, source_run: 44900628360, source_art: nec03ob-source-root-7, t_art: nec03t-source-root-7, reset_art: none }
    env:
      WORLD_INDEX: ${{ matrix.world }}
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen original-only method and code dependencies before inference
        run: |
          python - <<'PY'
          from mechinterp.neuron_communities.nec03v_activation_extract import registered_lock
          lock=registered_lock()
          assert lock["allowed_worlds"]==list(range(8))
          assert lock["source_fit_groups"]==list(range(40))
          assert lock["source_case_groups"]==list(range(24,32))
          assert lock["new_nec03v_behavioral_scoring"] is False
          print("NEC03V_SEVEN_SOURCE_ONLY_REGISTERED_METHODS_PINNED")
          PY
      - name: Install CPU-only Torch
        run: python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44913605626
          name: ${{ matrix.t_art }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec03v/t
      - uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: ${{ matrix.source_run }}
          name: ${{ matrix.source_art }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec03v/source
      - if: matrix.world < 4
        uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44898361742
          name: ${{ matrix.reset_art }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec03v/reset
      - uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44983824946
          name: nec03v-frozen-decoder32-original-world-${{ matrix.world }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec03v/decoder
      - name: Extract original 40 source-fit groups and independently audit without behavioral scoring
        shell: bash
        run: |
          RESET_ARG=()
          if [ "$WORLD_INDEX" -lt 4 ]; then RESET_ARG=(--reset-root /tmp/nec03v/reset); fi
          BASE=(--world-index "$WORLD_INDEX" --source-root /tmp/nec03v/source --nec03t-root /tmp/nec03v/t)
          DEC=(--decoder-columns /tmp/nec03v/decoder/projected-columns.json --decoder-audit /tmp/nec03v/decoder/decoder-audit.json)
          python -m mechinterp.neuron_communities.nec03v_activation_extract \
            "${BASE[@]}" "${RESET_ARG[@]}" "${DEC[@]}" --out /tmp/nec03v/pack
          python -m mechinterp.neuron_communities.nec03v_activation_extract \
            "${BASE[@]}" "${RESET_ARG[@]}" "${DEC[@]}" \
            --allow-registered-source-forwards --out /tmp/nec03v/pack
          python -m mechinterp.neuron_communities.nec03v_independent_activation_audit \
            "${BASE[@]}" "${RESET_ARG[@]}" "${DEC[@]}" \
            --pack /tmp/nec03v/pack --out /tmp/nec03v/activation-audit.json
          python -m mechinterp.neuron_communities.nec03v_geometry preflight \
            --pack /tmp/nec03v/pack --out /tmp/nec03v/physical-preflight.json
          python -m mechinterp.neuron_communities.nec03v_independent_geometry_audit \
            --pack /tmp/nec03v/pack --preflight /tmp/nec03v/physical-preflight.json \
            --out /tmp/nec03v/physical-audit.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("/tmp/nec03v")
          root=int(os.environ["WORLD_INDEX"])
          src=json.loads((p/"pack/extraction_receipt.json").read_text())
          act=json.loads((p/"activation-audit.json").read_text())
          phys=json.loads((p/"physical-audit.json").read_text())
          assert src["world_index"]==act["world_index"]==root
          assert act["independent_activation_audit_passed"]
          assert phys["geometry_audit_passed"] and phys["case_arm_records"]==512
          assert src["native_model_forward_calls"]==act["independent_source_only_native_forward_calls"]
          assert src["task_labels_accessed"]==act["task_labels_read"]==0
          assert src["recruited_or_reserved_queries"]==src["embargoed_or_confirmation_queries"]==0
          assert src["new_optimizer_updates"]==0 and not src["behavioral_necessity_scoring"]
          print("NEC03V_ORIGINAL_SOURCE_ONLY_ROOT_INDEPENDENT_AUDITS_PASS",
                root,src["native_model_forward_calls"],
                act["source_case_positive_coefficients_compared"],phys["arms"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nec03v-original-world-${{ matrix.world }}-registered-source-codes
          path: |
            /tmp/nec03v/pack/manifest.json
            /tmp/nec03v/pack/composed.json
            /tmp/nec03v/pack/additive.json
            /tmp/nec03v/pack/extraction_receipt.json
            /tmp/nec03v/activation-audit.json
            /tmp/nec03v/physical-preflight.json
            /tmp/nec03v/physical-audit.json
          if-no-files-found: error
          retention-days: 30
