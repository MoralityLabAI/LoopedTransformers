name: LS-SAE12 cross-platform registered audit and Windows CPU replay
on:
  push:
    branches: [audit/ls-sae12-cloud-replay-20261117]
    paths:
      - '.github/workflows/mechinterp-ls-sae12-independent-cloud-audit.yml'
      - 'mechinterp/sae_causal_transfer/ls_sae12_cloud_audit/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
  PYTHONUNBUFFERED: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '180'
  HF_HUB_ETAG_TIMEOUT: '60'

jobs:
  archived-linux-independent-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 70c765cacc86504eba63d3de1e7491fc0defc1f8
          path: original_evidence
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - uses: actions/download-artifact@v4
        with:
          name: ls-sae08-hard-52-54-native-all81-causal-evidence-and-audit
          run-id: 43851165980
          github-token: ${{ github.token }}
          path: runs/ls_sae12/prior
      - name: Verify all original archive bytes and registered SHA manifests
        run: python -m mechinterp.sae_causal_transfer.ls_sae12_cloud_audit.prepare --evidence original_evidence --out runs/cloud-audit-linux
      - name: Independently recompute original source and registered family audits
        run: python -m mechinterp.sae_causal_transfer.ls_sae12_cloud_audit.audit_registered --receipts runs/cloud-audit-linux --out runs/cloud-audit-linux/independent --ls11-source mechinterp/sae_causal_transfer/results/ls_sae11/receipts/source_20.json --ls08-full runs/ls_sae12/prior/full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae12-cloud-linux-pinned-registered-audit
          path: |
            runs/cloud-audit-linux/archive_verified.json
            runs/cloud-audit-linux/independent/
          retention-days: 90
          if-no-files-found: warn

  archived-windows-independent-audit:
    runs-on: windows-2022
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 70c765cacc86504eba63d3de1e7491fc0defc1f8
          path: original_evidence
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - uses: actions/download-artifact@v4
        with:
          name: ls-sae08-hard-52-54-native-all81-causal-evidence-and-audit
          run-id: 43851165980
          github-token: ${{ github.token }}
          path: runs/ls_sae12/prior
      - name: Verify original source/artifact hashes on independent Windows runner
        shell: bash
        run: python -m mechinterp.sae_causal_transfer.ls_sae12_cloud_audit.prepare --evidence original_evidence --out runs/cloud-audit-windows
      - name: Recompute original audit with independently proven float32 Gaussian edit equivalence
        shell: bash
        run: python -m mechinterp.sae_causal_transfer.ls_sae12_cloud_audit.audit_registered --receipts runs/cloud-audit-windows --out runs/cloud-audit-windows/independent --ls11-source mechinterp/sae_causal_transfer/results/ls_sae11/receipts/source_20.json --ls08-full runs/ls_sae12/prior/full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae12-cloud-windows-pinned-registered-audit
          path: |
            runs/cloud-audit-windows/archive_verified.json
            runs/cloud-audit-windows/independent/
          retention-days: 90
          if-no-files-found: warn

  windows-native-cpu-reproduction:
    needs: [archived-linux-independent-audit, archived-windows-independent-audit]
    runs-on: windows-2022
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 70c765cacc86504eba63d3de1e7491fc0defc1f8
          path: original_evidence
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Match registered CPU PyTorch / NumPy versions
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch,numpy; print('torch=',torch.__version__,'numpy=',numpy.__version__,'cuda_available=',torch.cuda.is_available())"
      - name: Revalidate original registered source and recover reference
        shell: bash
        run: python -m mechinterp.sae_causal_transfer.ls_sae12_cloud_audit.prepare --evidence original_evidence --out runs/cloud-windows-replay
      - name: Re-run all 48 screens and 24 intervened states in one Windows CPU process
        shell: bash
        timeout-minutes: 325
        run: |
          mkdir -p runs/cloud-windows-replay/native
          set -o pipefail
          python -m mechinterp.sae_causal_transfer.active_reasoning_v1.run_native \
            --stage full --source runs/cloud-windows-replay/source_48.json \
            --out runs/cloud-windows-replay/native 2>&1 | tee runs/cloud-windows-replay/native.log
      - name: Audit Windows-native result using the registered exact seeded-direction auditor
        shell: bash
        run: |
          for fam in active_a active_b; do
            python -m mechinterp.sae_causal_transfer.active_reasoning_v1.audit \
              --source runs/cloud-windows-replay/source_48.json \
              --screen runs/cloud-windows-replay/native/screen.json \
              --input runs/cloud-windows-replay/native/${fam}.json \
              --out runs/cloud-windows-replay/native/${fam}-audit.json
          done
      - name: Compare Windows-native screening, eligibility, sites and VDD gate to original Actions
        shell: bash
        run: |
          python -m mechinterp.sae_causal_transfer.ls_sae12_analysis.compare_runs \
            --run registered=runs/cloud-windows-replay/registered \
            --run windows_cloud=runs/cloud-windows-replay/native \
            --out-csv runs/cloud-windows-replay/compare_actions_vs_windows.csv \
            --out-json runs/cloud-windows-replay/compare_actions_vs_windows.json
      - name: Upload all available native and audit evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ls-sae12-cloud-windows-full-cpu-replay
          path: |
            runs/cloud-windows-replay/native.log
            runs/cloud-windows-replay/native/*.json
            runs/cloud-windows-replay/compare_actions_vs_windows.*
            runs/cloud-windows-replay/archive_verified.json
          retention-days: 90
          if-no-files-found: warn
