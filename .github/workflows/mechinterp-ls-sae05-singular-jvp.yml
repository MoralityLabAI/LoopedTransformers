name: LS-SAE05 recurrent 512D Jacobian singular-direction native test
on:
  pull_request:
    paths:
      - 'mechinterp/sae_causal_transfer/native_singular_v1/**'
      - '.github/workflows/mechinterp-ls-sae05-singular-jvp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-matched CPU numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run exact synthetic singular-vector, source and bootstrap checks
        run: |
          python -m compileall -q mechinterp/sae_causal_transfer/native_singular_v1
          python -m unittest discover -s mechinterp/sae_causal_transfer/native_singular_v1 -p 'test_*.py' -v

  native-pilot:
    runs-on: ubuntu-latest
    needs: cpu-unit
    timeout-minutes: 140
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download frozen original LS-SAE04 source-only fit, not test evidence
        uses: actions/download-artifact@v4
        with:
          name: ls-sae04-original-preheldout-calibration-only
          run-id: 43818817318
          github-token: ${{ github.token }}
          path: runs/ls_sae05/source
      - name: Source SHA-verified 2+2 native 512D JtJ singular pilot
        run: python -m mechinterp.sae_causal_transfer.native_singular_v1.run_native --pilot --source-dir runs/ls_sae05/source --out runs/ls_sae05/pilot.json
      - name: Independent stdlib pilot numerical receipt audit
        run: python -m mechinterp.sae_causal_transfer.native_singular_v1.audit --input runs/ls_sae05/pilot.json --out runs/ls_sae05/pilot-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae05-native-singular-pilot-and-audit
          path: runs/ls_sae05/pilot*.json
          if-no-files-found: warn
          retention-days: 90

  full-16-fresh:
    runs-on: ubuntu-latest
    needs: native-pilot
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download same sealed preheldout LS-SAE04 fit
        uses: actions/download-artifact@v4
        with:
          name: ls-sae04-original-preheldout-calibration-only
          run-id: 43818817318
          github-token: ${{ github.token }}
          path: runs/ls_sae05/source
      - name: Native full two-family 8+8 JVP/VJP power iteration versus eight random directions
        run: python -m mechinterp.sae_causal_transfer.native_singular_v1.run_native --source-dir runs/ls_sae05/source --out runs/ls_sae05/full.json
      - name: Independent original source, power recurrence, margin and bootstrap replay
        run: python -m mechinterp.sae_causal_transfer.native_singular_v1.audit --input runs/ls_sae05/full.json --out runs/ls_sae05/full-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae05-full-512D-singular-fresh-and-audit
          path: runs/ls_sae05/full*.json
          if-no-files-found: warn
          retention-days: 90
