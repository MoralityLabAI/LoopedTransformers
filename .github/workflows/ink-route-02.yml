name: INK-ROUTE-02 offline contracts

on:
  pull_request:
    paths:
      - "research_gym/inkling_routing_0[12]/**"
      - ".github/workflows/ink-route-02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'numpy>=1.24,<3'
      - run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s research_gym/inkling_routing_02 -p 'test_*.py' -v
