name: MOLT-12 typed clock competence
on:
  pull_request:
    paths:
      - 'research_gym/interp/molt_typed_clock.py'
      - 'research_gym/interp/molt_typed_clock_bpd.py'
      - 'tests/test_molt_typed_clock.py'
      - '.github/workflows/molt-typed-clock.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typed-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/BPD
          ref: 722613a80d80af0e80bb9f5ac1ce83eef111e4f7
          path: .native-bpd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pytest
      - run: python -m pytest -q tests/test_molt_typed_clock.py
      - name: Capped competence and native BPD phases
        run: |
          mkdir /tmp/molt12
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from research_gym.interp.aux_gym_v2_isolated_response import phase
          root = Path("/tmp/molt12")
          commands = [
              ("clock", [sys.executable, "-m", "research_gym.interp.molt_typed_clock",
                         "--out", str(root / "clock")]),
              ("bpd", [sys.executable, "-m", "research_gym.interp.molt_typed_clock_bpd",
                       "--clock", str(root / "clock"), "--bpd-checkout", ".native-bpd",
                       "--out", str(root / "bpd")]),
          ]
          receipts = {}
          for name, command in commands:
              log = root / (name + ".log")
              receipts[name] = phase(command, log, address_mib=8192, rss_mib=2048,
                                     cpu_seconds=300, wall_seconds=360)
              (root / "phase-receipts.json").write_text(json.dumps(receipts, indent=2))
              print(log.read_text())
              print(json.dumps(receipts[name], sort_keys=True))
              if receipts[name]["status"] != "success":
                  raise SystemExit(f"{name} failed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: molt12-typed-clock
          path: /tmp/molt12
          retention-days: 7
          if-no-files-found: warn
