name: AF-32 source-locked producer-supported cycles with frozen Direct and learned STOP
on:
  push:
    branches: [feat/activation-funnel-af32-cyclic-support-20261117]
    paths:
      - 'experiments/activation_funnel_af32/RUN_AF32.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: af32-cyclic-scored-${{ github.ref }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
jobs:
  source-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen scientific protocol, structural source manifest, and immutable experiment source
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from experiments.activation_funnel_af32 import gym
          p=Path('experiments/activation_funnel_af32')
          r=json.loads((p/'RUN_AF32.json').read_text())
          reg=json.loads((p/'PROTOCOL.json').read_text())
          assert r['experiment']=='AF-32'
          assert r['protocol_sha256']==hashlib.sha256((p/'PROTOCOL.json').read_bytes()).hexdigest()
          assert r['source_manifest_sha256']==gym.manifest()['manifest_sha256']
          assert r['passing_source_preflight_run']>0
          assert len(reg['policies']['seeds'])==8
          assert '+10/96' in reg['scoring']['primary']
          assert reg['geometry']['held_distribution_by_swap_position']==[32,32,32]
          assert reg['geometry']['pairs_per_split']==96
          assert reg['policies']['frozen_direct'].startswith('All eight SHA-checked original AF23')
          print('AF32 frozen protocol',r['protocol_sha256'])
          print('AF32 exact source pair graph manifest',r['source_manifest_sha256'])
          PY
          SRC=$(python -c "import json;print(json.load(open('experiments/activation_funnel_af32/RUN_AF32.json'))['source_base_commit'])")
          git cat-file -e "$SRC^{commit}"
          git diff --exit-code "$SRC" HEAD -- \
            experiments/activation_funnel_af32/PROTOCOL.json \
            experiments/activation_funnel_af32/gym.py \
            experiments/activation_funnel_af32/features.py \
            experiments/activation_funnel_af32/ranker.py \
            experiments/activation_funnel_af32/stop.py \
            experiments/activation_funnel_af32/evaluate.py \
            experiments/activation_funnel_af32/audit.py \
            experiments/activation_funnel_af32/direct.py \
            experiments/activation_funnel_af32/direct_audit.py \
            experiments/activation_funnel_af32/aggregate.py \
            experiments/activation_funnel_af32/transfer_planner.py \
            experiments/activation_funnel_af32/tests \
            .github/workflows/activation-funnel-af32.yml \
            .github/workflows/activation-funnel-af32-preflight.yml \
            .github/workflows/activation-funnel-af32-direct-smoke.yml
          python -m unittest discover -s experiments/activation_funnel_af32/tests -p 'test_*.py' -v
  frozen-model-smoke:
    needs: source-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original fixed Torch numerical runtime
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Obtain original AF23 seed17 checkpoint by immutable original zip/hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p originals
          curl --fail --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14200844340/zip" \
            -o originals/af23-branch-seed-17.zip
          echo '0440fcda5f8ca8562da385851d5765fbe9784d4d0800922e5d8633c082cfcffe  originals/af23-branch-seed-17.zip' | sha256sum -c -
      - name: Original unchanged model forward and same-graph source legality smoke only
        run: |
          set -euo pipefail
          python -m experiments.activation_funnel_af32.direct \
            --seed 17 --original-zip-dir originals \
            --out out/af32-direct-smoke --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: af32-original-model-smoke-only
          path: out/af32-direct-smoke
          retention-days: 90
  trained-seed:
    needs: frozen-model-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        seed: [17, 29, 43, 61, 73, 89, 103, 131]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fit train-only ranker + learned STOP; perform full held-out episodes and independent source proof audit
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          python -m experiments.activation_funnel_af32.evaluate \
            --seed "$SEED" --out "out/af32-seed-${SEED}"
          python -m experiments.activation_funnel_af32.audit \
            --seed "$SEED" --out "out/af32-seed-${SEED}"
          python - <<'PY'
          from pathlib import Path
          import json,os
          folder=Path('out')/('af32-seed-'+os.environ['SEED'])
          a=json.loads((folder/'audit.json').read_text())
          assert a['independently_replayed_episodes']==7680
          assert a['independent_learned_stop_refit']
          assert a['no_false_accepted_proofs']
          print('AF32 learned seed proof audit PASS',os.environ['SEED'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: af32-seed-${{ matrix.seed }}
          path: out/af32-seed-${{ matrix.seed }}
          retention-days: 90
  original-direct-seed:
    needs: frozen-model-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        include:
          - {seed: 17, id: 14200844340, zipsha: '0440fcda5f8ca8562da385851d5765fbe9784d4d0800922e5d8633c082cfcffe'}
          - {seed: 29, id: 14201501545, zipsha: '040c48cb4b5e2e02e6b8419521e570a0d68f325bcc8c480c80669c5d57b7bd86'}
          - {seed: 43, id: 14201486468, zipsha: '43a36b5273858646779f8cedec1d9c84a2fea0e54d4f06b53d7942814263aae5'}
          - {seed: 61, id: 14201322685, zipsha: '69b6f8ebf0d933fea02641ac9916646850358296bad65b9076e1ce5b2c3b95b2'}
          - {seed: 73, id: 14201536438, zipsha: '64c4aaa3e82b40f733c9e00fc6cbf41511c68db54b8077f5d73662a5cdb30dc9'}
          - {seed: 89, id: 14200829424, zipsha: '5fbe327d7ea494c1c097f3ee510b87eabd0ce48bec8ea61aa1f323fbc141aea0'}
          - {seed: 103, id: 14201820417, zipsha: '32009b1ed5afc50f04b7863593ea49950d4064fa0857e11f516ab3e03bd6ef44'}
          - {seed: 131, id: 14201287338, zipsha: '1fa688d73abe4c80517ff4f1a824e6b400b1778f2713f7009dea512e1f42e856'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original deterministic Torch for all source checkpoints
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Download exact original AF23 archive with original independent SHA256
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ matrix.seed }}
          ARTIFACT_ID: ${{ matrix.id }}
          ZIP_SHA: ${{ matrix.zipsha }}
        run: |
          set -euo pipefail
          mkdir -p originals
          curl --fail --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "originals/af23-branch-seed-${SEED}.zip"
          echo "$ZIP_SHA  originals/af23-branch-seed-${SEED}.zip" | sha256sum -c -
      - name: Original frozen Direct native/forced/cert and independent original Torch forward replay
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          python -m experiments.activation_funnel_af32.direct \
            --seed "$SEED" --original-zip-dir originals \
            --out "out/af32-direct-seed-${SEED}"
          python -m experiments.activation_funnel_af32.direct_audit \
            --seed "$SEED" --original-zip-dir originals \
            --out "out/af32-direct-seed-${SEED}"
          python - <<'PY'
          from pathlib import Path
          import json,os
          folder=Path('out')/('af32-direct-seed-'+os.environ['SEED'])
          a=json.loads((folder/'direct_audit.json').read_text())
          assert a['independent_physical_proof_episodes']==2304
          assert a['sampled_genuine_original_torch_forward_decisions']>=12
          assert a['no_false_accepted_proofs']
          print('AF32 original model seed proof audit PASS',os.environ['SEED'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: af32-direct-seed-${{ matrix.seed }}
          path: out/af32-direct-seed-${{ matrix.seed }}
          retention-days: 90
  aggregate:
    needs: [trained-seed, original-direct-seed]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: af32-*seed-*
          path: receipts
          merge-multiple: false
      - name: Independent full-source 8-seed ranker and learned-only STOP verdicts plus same-case original Direct comparison
        run: |
          set -euo pipefail
          python -m experiments.activation_funnel_af32.aggregate \
            --root receipts --out af32_results.json
          python - <<'PY'
          import json
          a=json.load(open('af32_results.json'))
          assert a['source_audit']=='PASS_ALL_EIGHT_LEARNED_AND_FROZEN_DIRECT'
          assert len(a['per_seed'])==8
          assert a['independently_replayed_complete_episodes']==79872
          print('AF32 REGISTERED RANKER SCIENCE',a['ranker_primary_verdict'])
          print('AF32 SEPARATE LEARNED STOP SCIENCE',a['learned_only_STOP_verdict'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: af32-cyclic-rule-stop-aggregate
          path: af32_results.json
          retention-days: 90
