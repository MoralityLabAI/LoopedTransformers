name: RMP GG-01 Causal Evaluation Belief
on:
  push:
    branches: ['research/rmp-gg01-causal-belief-20261111']
    paths:
      - 'docs/rmp_goal_guarding_causal_v0.md'
      - 'research_gym/interp/goal_guarding_causal.py'
      - 'research_gym/scripts/bench_goal_guarding_causal.py'
      - 'tests/test_goal_guarding_causal.py'
      - '.github/workflows/rmp-gg01.yml'
  pull_request:
    paths:
      - 'docs/rmp_goal_guarding_causal_v0.md'
      - 'research_gym/interp/goal_guarding_causal.py'
      - 'research_gym/scripts/bench_goal_guarding_causal.py'
      - 'tests/test_goal_guarding_causal.py'
      - '.github/workflows/rmp-gg01.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gg01-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-causal-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU neural test dependencies
        run: |
          python -m pip install pytest
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: GG-01 independent exact oracle and causal patch tests
        run: python -m pytest -q tests/test_goal_guarding_causal.py
      - name: GG-01 registered two-seed supervised CPU pilot
        run: |
          python -m research_gym.scripts.bench_goal_guarding_causal \
            --out /tmp/gg01/results.json \
            --checkpoint-dir /tmp/gg01/checkpoints
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg01-supervised-cpu-receipts
          path: /tmp/gg01
          if-no-files-found: warn
