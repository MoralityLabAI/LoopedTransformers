name: RAM-04 full prospective eval02 from frozen checkpoints after Lean crash disclosure

on:
  push:
    paths:
      - '.github/workflows/lean-ram04-eval02.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  LEAN_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
  PYTHONPATH: ${{ github.workspace }}/_ram04_gym

jobs:
  rerun-all-84-original-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout published amendment and frozen RAM04 score code
        uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: patrickdugan/MathCan
          ref: c84e2025334e9a967c1297425a490f98d5b3d189
          path: _mathcan
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/Compactification-Theory
          ref: e8a780254b5cf41d479095f4f22bcfc4aa76ed72
          path: _ram04_gym
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce exact CPU and Lean original source environment
        run: |
          python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check psutil==7.1.3
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o /tmp/lean435.tar.zst
          tar --zstd -xf /tmp/lean435.tar.zst -C /tmp
          echo /tmp/lean-4.35.0-linux/bin >> "$GITHUB_PATH"
      - name: Build unmodified original MathCan context and persistent Lean server
        run: |
          test "$(git -C _mathcan rev-parse HEAD)" = c84e2025334e9a967c1297425a490f98d5b3d189
          test "$(git -C _ram04_gym rev-parse HEAD)" = e8a780254b5cf41d479095f4f22bcfc4aa76ed72
          (cd _mathcan && lake build MathCan)
          echo "LEAN_PATH=$GITHUB_WORKSPACE/experiments/lean_ram03:$(cd _mathcan && lake env printenv LEAN_PATH)" >> "$GITHUB_ENV"
          export LEAN_PATH="$GITHUB_WORKSPACE/experiments/lean_ram03:$(cd _mathcan && lake env printenv LEAN_PATH)"
          lean experiments/lean_ram03/ProbeServer.lean -o experiments/lean_ram03/ProbeServer.olean
      - name: Download original immutable nine RAM04 CPU fits and complete 4973-label audit
        uses: actions/download-artifact@v4
        with:
          name: ram04-frozen-audited-train-43593270279
          run-id: 43593270279
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/ram04_frozen/
      - name: Refuse any changed training data or development-selected checkpoint bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ['RUNNER_TEMP'])/'ram04_frozen'
          t=json.loads((root/'training/training_report.json').read_text())
          a=json.loads((root/'data/independent_audit.json').read_text())
          assert a['status']=='passed' and a['checked']==4973
          assert a['dataset_sha256']=='a84b1264e2eee76195041efc81fbcd7ec60e48c22068b7eba3c45ce85838f0b3'
          assert len(t['models'])==9
          expected={
            'loop32':(17,'5544926c38e8b2e70faa4185eaeb51172ce7338001bb9e0742a7605131da9f2c'),
            'loop64':(43,'416ea4aec151920a2e8a4ad162644b78f3f828daf3fa10e8c8b2858ff6bc00ef'),
            'flat64':(43,'7a88c9a363f2e5dbc5e20a94fd459358fa183b657701baf8e2899cd636bd8de2')}
          for name,(seed,sha) in expected.items():
              row=t['selected'][name]
              assert row['seed']==seed and row['checkpoint_sha256']==sha
              f=root/'training'/f'{name}_s{seed}'/'best.pt'
              assert hashlib.sha256(f.read_bytes()).hexdigest()==sha
          assert hashlib.sha256((root/'data/transitions.jsonl').read_bytes()).hexdigest()==a['dataset_sha256']
          print('RAM04_EXACT_ORIGINAL_FROZEN_MODEL_WEIGHTS',json.dumps(expected,sort_keys=True))
          PY
      - name: Verify fatal Lean process exit is unknown and all original budgets remain fixed
        run: |
          python -m unittest discover -s experiments/lean_ram04 -p 'test_*.py' -v
          test -f experiments/lean_ram04/EVALUATION_AMENDMENT_A.md
      - name: Full prospective 12-case five-policy primary and two-policy secondary rerun
        run: |
          python experiments/lean_ram04/evaluate.py \
            --mathcan _mathcan --data "$RUNNER_TEMP/ram04_frozen/data" \
            --training "$RUNNER_TEMP/ram04_frozen/training" \
            --config experiments/lean_ram04/config.json --lean lean \
            --out "$RUNNER_TEMP/ram04_eval02"
      - name: Independent third compiler check of all scored original theorem certificates
        run: |
          python experiments/lean_ram04/audit_results.py \
            --results "$RUNNER_TEMP/ram04_eval02" --lean lean \
            --out "$RUNNER_TEMP/ram04_eval02_audit"
      - name: Preserve whole original source and all failed/successful compiler traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ram04-full-prospective-eval02-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ram04_eval02/
            ${{ runner.temp }}/ram04_eval02_audit/
          retention-days: 30
          if-no-files-found: warn
