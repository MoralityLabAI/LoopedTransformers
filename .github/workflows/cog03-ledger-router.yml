name: COG-03 ledger router

on:
  pull_request:
    paths:
      - 'research/cog03_ledger_router/**'
      - 'research/lean_cgrt_hrm400/ppt_gym/core.py'
      - '.github/workflows/cog03-ledger-router.yml'
  push:
    paths:
      - 'research/cog03_ledger_router/**'
      - '.github/workflows/cog03-ledger-router.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay every charged checker call
        run: >-
          python -m research.cog03_ledger_router.replay
          --corpus research/cog03_ledger_router/data/tasks.jsonl.gz
          --results research/cog03_ledger_router/results
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check routing and observation boundaries
        run: python -m unittest discover -s research/cog03_ledger_router/tests -v
