name: RAM-16 source-only preflight for structural macro curriculum
on:
  push:
    paths: ['.github/workflows/ram16-source-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-only resource contract dependency
        run: python -m pip install psutil==7.1.3
      - name: Test preregistered original source selection and safe candidate grammar
        run: |
          python -m unittest discover -s experiments/lean_ram16 -p 'test_*.py' -v
          python -m py_compile experiments/lean_ram16/{grammar,collect,native_replay}.py
