name: ROC-05B twelve-frozen-model matched source/hidden causal replay

on:
  push:
    paths:
      - 'configs/roc05b_matched_rule_causal_v1.json'
      - 'research_gym/analysis/roc05b_*.py'
      - '.github/workflows/roc05b-causal-replay.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  causal-seed:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        seed: [20261117231, 20261117233, 20261117239, 20261117241, 20261117251, 20261117257]
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: CPU-only PyTorch, frozen geometry unit tests
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m unittest discover -s tests -p 'test_roc05b_geometry.py' -v
      - name: Download only the ORIGINAL ROC-05A first-run checkpoint files
        uses: actions/download-artifact@v4
        with:
          run-id: 44101721734
          pattern: ROC05A-seed-*
          merge-multiple: true
          path: /tmp/roc05_original
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate exposed train/development only and audit original sources
        run: |
          python -m research_gym.analysis.roc05_permutation_source --out-dir /tmp/roc05_source
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          cfg=json.loads(Path('configs/roc05b_matched_rule_causal_v1.json').read_text())
          for arm,file in [('train_low4','train_low4.jsonl'),('train_high512','train_high512.jsonl'),('development','development.jsonl')]:
              p=Path('/tmp/roc05_source')/file
              assert hashlib.sha256(p.read_bytes()).hexdigest()==cfg['parent']['exact_source_sha256'][arm]
          assert not (Path('/tmp/roc05_source')/'reserved_test_inputs.jsonl').exists()
          print('Frozen original train/development source files verified; test reserve ungenerated')
          PY
      - name: Execute matched dose rule causal comparison on the original two models
        run: |
          python -m research_gym.analysis.roc05b_matched_rule \
            --seed ${{ matrix.seed }} \
            --source-dir /tmp/roc05_source \
            --checkpoint-dir /tmp/roc05_original \
            --config configs/roc05b_matched_rule_causal_v1.json \
            --outdir /tmp/roc05b_results
      - name: Verify both first-run original checkpoint and causal receipt hashes
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          seed=${{ matrix.seed }}
          cfg=json.load(open('configs/roc05b_matched_rule_causal_v1.json'))
          for arm in ('low_affine4','high_permutation512'):
              original=Path('/tmp/roc05_original')/f'roc05_{arm}_S{seed}_step1920.pt'
              assert hashlib.sha256(original.read_bytes()).hexdigest()==cfg['parent']['frozen_1920step_checkpoint_sha256'][str(seed)][arm]
              receipt=Path('/tmp/roc05b_results')/f'roc05b_S{seed}_{arm}_receipt.json'
              values=json.loads(receipt.read_text())
              assert values['per_case_row_count']==256*3*8
              assert values['model_training_updates_during_causal_analysis']==0
              assert not values['sealed_test_evaluated']
              data=Path('/tmp/roc05b_results')/f'roc05b_S{seed}_{arm}.csv.gz'
              assert hashlib.sha256(data.read_bytes()).hexdigest()==values['per_case_csv_gzip_sha256']
          print('Two original frozen models and 12288 per-case causal rows verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ROC05B-original-causal-seed-${{ matrix.seed }}
          path: /tmp/roc05b_results/
          retention-days: 90

  summary:
    needs: causal-seed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: ROC05B-original-causal-seed-*
          merge-multiple: true
          path: /tmp/roc05b_combined
      - uses: actions/download-artifact@v4
        with:
          run-id: 44101721734
          pattern: ROC05A-seed-*
          merge-multiple: true
          path: /tmp/roc05_original
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Independent census of all 73728 physical and input routes, exact p and null cards
        run: |
          python -m research_gym.analysis.roc05b_independent_audit \
            --receipt-dir /tmp/roc05b_combined \
            --config configs/roc05b_matched_rule_causal_v1.json \
            --out /tmp/roc05b_combined/ROC05B_INDEPENDENT_CAUSAL_SUMMARY.json
      - name: Package full original frozen models, exposed sources, causal receipts, source code and SHA manifest
        run: |
          python -m research_gym.analysis.roc05_permutation_source --out-dir /tmp/roc05_source
          python - <<'PY'
          import hashlib,json,shutil,zipfile
          from pathlib import Path
          original=Path('/tmp/roc05_original')
          dst=Path('/tmp/roc05b_package')
          dst.mkdir(parents=True,exist_ok=True)
          for p in Path('/tmp/roc05b_combined').glob('*'):
              if p.is_file():shutil.copy2(p,dst/p.name)
          for p in Path('/tmp/roc05_source').glob('*'):
              if p.is_file():shutil.copy2(p,dst/p.name)
          frozen=dst/'original_roc05a_models'
          frozen.mkdir(exist_ok=True)
          for p in Path('/tmp/roc05_original').glob('*'):
              if p.is_file():
                  shutil.copy2(p,frozen/p.name)
          assert len(list(frozen.glob('roc05_*_step1920.pt')))==12
          for name in (
            'configs/roc05b_matched_rule_causal_v1.json',
            'experiments/roc05_fresh_replication/ROC05B_CAUSAL_PROTOCOL.md',
            'research_gym/analysis/roc05b_matched_rule.py',
            'research_gym/analysis/roc05b_independent_audit.py',
            'research_gym/analysis/roc05_permutation_source.py',
            'research_gym/analysis/roc04_permutation_source.py',
            'research_gym/analysis/roc03b_query_table_memory.py',
            'research_gym/analysis/roc02_tied_train.py',
            'research_gym/analysis/roc02_delayed_rule_source.py',
            'tests/test_roc05b_geometry.py'
          ):
              p=Path(name);target=dst/p
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,target)
          # Every first-run model byte is preserved; original archive identity
          # remains pinned by configs/roc05b_matched_rule_causal_v1.json.
          allfiles=sorted(p for p in dst.rglob('*') if p.is_file())
          m={'study':'ROC-05B-original-checkpoint-matched-causal-calibration',
             'model_sha256_pins_from_first_run':True,
             'roc05_reserved_test_evaluated':False,
             'roc02_sealed_test_evaluated':False,
             'record_count':73728,'model_count':12,
             'files':[{'path':str(p.relative_to(dst)),'bytes':p.stat().st_size,
                       'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in allfiles]}
          (dst/'ROC05B_REPRODUCIBILITY_MANIFEST.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          archive=Path('/tmp/ROC05B_source_vs_hidden_causal_replay.zip')
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(q for q in dst.rglob('*') if q.is_file()):
                  info=zipfile.ZipInfo(str(p.relative_to(dst)),date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(info,p.read_bytes())
          print('ZIP sha256',hashlib.sha256(archive.read_bytes()).hexdigest(),'bytes',archive.stat().st_size,'files',len(m['files']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ROC05B-full-original-model-causal-reproducibility
          path: |
            /tmp/ROC05B_source_vs_hidden_causal_replay.zip
            /tmp/roc05b_combined/ROC05B_INDEPENDENT_CAUSAL_SUMMARY.json
          retention-days: 90
