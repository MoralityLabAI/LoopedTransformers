name: RMP GG-04B Depth-Aligned Real SGD

on:
  push:
    branches: ['research/rmp-gg04b-depth-aligned-20261111']
    paths:
      - 'docs/rmp_goal_guarding_actual_updates_gg04b.md'
      - 'research_gym/interp/goal_guarding_actual_updates_b.py'
      - 'research_gym/scripts/bench_goal_guarding_actual_updates_b.py'
      - 'tests/test_goal_guarding_actual_updates_b.py'
      - 'reports/checkpoint_rmp_gg04b_depth_aligned_20261111.md'
      - '.github/workflows/rmp-gg04b.yml'
  pull_request:
    paths:
      - 'docs/rmp_goal_guarding_actual_updates_gg04b.md'
      - 'research_gym/interp/goal_guarding_actual_updates_b.py'
      - 'research_gym/scripts/bench_goal_guarding_actual_updates_b.py'
      - 'tests/test_goal_guarding_actual_updates_b.py'
      - 'reports/checkpoint_rmp_gg04b_depth_aligned_20261111.md'
      - '.github/workflows/rmp-gg04b.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gg04b-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  real-SGD-bounded-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and pytest
        run: |
          python -m pip install pytest
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify exact bounded reward and actual SGD reference
        run: |
          python -m pytest -q tests/test_goal_guarding_actual_updates.py tests/test_goal_guarding_actual_updates_b.py
      - name: Frozen two-seed GG-04B native SGD and controller
        run: |
          mkdir -p /tmp/gg04b
          python -m research_gym.scripts.bench_goal_guarding_actual_updates_b \
            --out /tmp/gg04b/gg04b.json \
            --artifact-dir /tmp/gg04b/checkpoints \
            > /tmp/gg04b/summary.json
          cat /tmp/gg04b/summary.json
      - name: Validate exact source, full paired physical-update ledger, and scientific status
        run: |
          python - <<'PY'
          import json,math,hashlib
          from pathlib import Path
          root=Path('/tmp/gg04b')
          data=json.loads((root/'gg04b.json').read_text())
          assert data['protocol']=='RMP-GG-04B'
          assert data['source_main_commit']=='50270e3f22f6e3b9cabbb17258cec0a0a7fc7960'
          assert data['prior_GG04_calibration_failure_known']
          assert data['split_counts']=={'actor_train':72,'calibration':24,'heldout':48}
          assert (data['primary_four_cue_gold_seed'],
                  data['secondary_six_cue_gold_seed'])==(69001,68001)
          assert data['reward_penalty_normalization']=='calibration median then clip[-4,4]'
          assert data['bounded_penalty_magnitude']==4.0
          assert data['actual_native_pytorch_sgd_updates']
          assert data['post_action_task_model_updated']
          assert data['post_action_controller_head_updated'] is False
          assert data['meta_policy_updates']==400
          assert data['source_task_training_updates']==400
          assert len(data['results'])==2
          assert isinstance(data['two_seed_controller_gate'],bool)
          for row in data['results']:
              assert row['seed'] in (11,17)
              assert row['base_training']['updates']==400
              assert row['real_sgd_steps_per_seed']==384
              assert row['calibration_median_positive_damage']>1e-9
              assert row['no_update_weight_and_gold_identity']
              assert row['cross_depth_heldout']['queries']==48
              assessment=row['controller_eval']
              assert assessment['n']==48
              assert len(assessment['causal_randomization_factorial'])==4
              assert assessment['exact_q_expected_reward']['oracle']+1e-5>=assessment['exact_q_expected_reward']['policy']
              assert isinstance(assessment['controller_registered_gate_pass'],bool)
              assert math.isfinite(row['heldout_median_raw_damage'])
              for cell in assessment['causal_randomization_factorial']:
                  assert cell['pre_action_policy_independent_of_assignment']
                  assert 'mean_bounded_controller_penalty_units' in cell
                  assert 'mean_raw_gold_ce_delta' in cell
                  if cell['real_update_assignment']==0:
                      assert cell['mean_raw_gold_ce_delta']==0
              potential=root/'checkpoints'/row['ledger_filename']
              assert hashlib.sha256(potential.read_bytes()).hexdigest()==row['ledger_sha256']
              payload=json.loads(potential.read_text())
              assert [len(payload[n]) for n in ('train','calibration','heldout','heldout_original_six_cue')]==[72,24,48,48]
              for split in ('train','calibration','heldout','heldout_original_six_cue'):
                  assert all(x['truth_changed_weights'] and x['flip_changed_weights'] for x in payload[split])
              checkpoint=root/'checkpoints'/row['checkpoint_filename']
              assert hashlib.sha256(checkpoint.read_bytes()).hexdigest()==row['checkpoint_sha256']
              print('GG-04B seed',row['seed'],'registered_gate',
                    assessment['controller_registered_gate_pass'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg04b-depth-aligned-native-sgd-weights-and-receipts
          path: /tmp/gg04b
          if-no-files-found: warn
          retention-days: 14
