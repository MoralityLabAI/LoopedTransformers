name: RAM-08 three distinct original MathCan natural-exact proof witnesses

on:
  push:
    paths:
      - '.github/workflows/lean-ram08-natural-source-witnesses.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/_ram08_gym
  LEAN_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  verify-original-intervention-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout old MathCan original training-only source
        uses: actions/checkout@v4
        with:
          repository: patrickdugan/MathCan
          ref: c84e2025334e9a967c1297425a490f98d5b3d189
          path: _old_mathcan
          persist-credentials: false
      - name: Checkout unchanged original compiler gym
        uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/Compactification-Theory
          ref: e8a780254b5cf41d479095f4f22bcfc4aa76ed72
          path: _ram08_gym
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Lean4.35 and the original RAM guard
        run: |
          python -m pip install --disable-pip-version-check psutil==7.1.3
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o /tmp/lean435.tar.zst
          tar --zstd -xf /tmp/lean435.tar.zst -C /tmp
          echo /tmp/lean-4.35.0-linux/bin >> "$GITHUB_PATH"
      - name: Build old original proof imports and same-version persistent Lean server
        run: |
          test "$(git -C _old_mathcan rev-parse HEAD)" = c84e2025334e9a967c1297425a490f98d5b3d189
          (cd _old_mathcan && lake build MathCan)
          echo "LEAN_PATH=$GITHUB_WORKSPACE/experiments/lean_ram03:$(cd _old_mathcan && lake env printenv LEAN_PATH)" >> "$GITHUB_ENV"
          export LEAN_PATH="$GITHUB_WORKSPACE/experiments/lean_ram03:$(cd _old_mathcan && lake env printenv LEAN_PATH)"
          lean experiments/lean_ram03/ProbeServer.lean -o experiments/lean_ram03/ProbeServer.olean
      - name: Verify actual named-intro exact on original theorem roots without reference proof commands
        run: |
          python experiments/lean_ram08/smoke_diverse_natural_exact.py \
            --mathcan _old_mathcan --lean lean \
            --out "$RUNNER_TEMP/ram08_natural_exact_training_smoke"
      - name: Preserve actual original source scripts and all Lean compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ram08-natural-original-exact-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/ram08_natural_exact_training_smoke/
          retention-days: 30
          if-no-files-found: warn
