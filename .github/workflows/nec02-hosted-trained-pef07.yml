name: NEC-02 hosted CPU trained PEF-07 native neuron pilot

on:
  push:
    branches: ['research/nec02-hosted-trained-pef07-20261121']
    paths:
      - '.github/workflows/nec02-hosted-trained-pef07.yml'
      - 'mechinterp/neuron_communities/audit_hosted.py'
      - 'mechinterp/neuron_communities/test_audit_hosted.py'
      - 'mechinterp/neuron_communities/NEC02_HOSTED_PILOT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nec02-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-pef07-and-nec02:
    name: Six trained checkpoints and two exploratory causal arms
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      DNNL_MAX_CPU_ISA: 'AVX2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU neural stack
        run: |
          python -m pip install pytest==8.4.2 networkx==3.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Existing PEF-07 and both NEC instruments unit tests
        run: |
          python -m pytest -q research/pef07/test_pef07.py mechinterp/neuron_communities/test_nec01.py mechinterp/neuron_communities/test_audit_hosted.py
      - name: Train six PEF-07 replicas, freeze weights and score original heldout
        timeout-minutes: 45
        run: |
          mkdir -p /tmp/nec02/pef07
          python -m research.pef07.pef07 --out /tmp/nec02/pef07
      - name: Verify six frozen source manifests before intervening
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("/tmp/nec02/pef07")
          split = json.loads((root/"source_split.json").read_text())
          ledger = json.loads((root/"sealed_training_ledger.json").read_text())
          result = json.loads((root/"summary.json").read_text())
          assert split["sha256"] == "de4e0263864ee70c2bf94ca95008ace10fce1323d1a51b4c8829ec26e40bbd9b"
          assert len(ledger["checkpoints"]) == 6
          assert ledger["all_six_trunks_sealed_before_scoring"]
          assert len(result["models"]) == 6 and result["full_registered_run"]
          for r in ledger["checkpoints"]:
              path = root/r["file"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == r["checkpoint_sha256"]
          print("NEC02_ALL_SIX_NEW_HOSTED_CHECKPOINTS_VERIFIED")
          PY
      - name: NEC-01 discovery and frozen trained-circuit interventions on both teacher tasks
        timeout-minutes: 12
        run: |
          for task in coalition threshold; do
            out="/tmp/nec02/analysis/seed103_${task}"
            python -m mechinterp.neuron_communities.pef07_adapter discover \
              --checkpoint-dir /tmp/nec02/pef07 --seed 103 --task "${task}" --out "${out}" \
              --train-contexts 160 --top-k 2 --min-joint 3 --min-phi 0.18 --max-candidates 8
            python -m mechinterp.neuron_communities.pef07_adapter evaluate \
              --checkpoint-dir /tmp/nec02/pef07 --seed 103 --task "${task}" --out "${out}" \
              --heldout-contexts 48
          done
      - name: Audit full original scoring and exploratory causal artifacts
        run: |
          python -m mechinterp.neuron_communities.audit_hosted --root /tmp/nec02
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/nec02")
          audit = json.loads((root/"nec02_audit.json").read_text())
          assert audit["inference"]["FSI_01_gate"] == "REDESIGN_OR_PILOT_ONLY"
          assert audit["inference"]["familywise_error_protected"] is False
          assert [x["task"] for x in audit["analysis"]] == ["coalition", "threshold"]
          print("NEC02_EXPLORATORY_ONLY", [(x["task"], x["candidate_count"]) for x in audit["analysis"]])
          PY
      - name: Upload new hosted frozen models and complete exploratory receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nec02-hosted-six-model-frozen-and-two-causal-arms
          path: /tmp/nec02/
          retention-days: 30
          if-no-files-found: warn
