name: LS-SAE07 frozen hard Sudoku source-admission audit
on:
  pull_request:
    paths:
      - 'mechinterp/sae_causal_transfer/native_hard_task_v1/**'
      - '.github/workflows/mechinterp-ls-sae07-source-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - name: Replay frozen source solver, failed exact-hole seed and visible Sudoku trace
        run: |
          python -m unittest discover -s mechinterp/sae_causal_transfer/native_hard_task_v1 -p 'test_*.py' -v
          python -m mechinterp.sae_causal_transfer.native_hard_task_v1.admission --out runs/ls_sae07/source_admission.json
      - uses: actions/upload-artifact@v4
        with:
          name: ls-sae07-original-source-admission-receipt
          path: runs/ls_sae07/source_admission.json
          retention-days: 90
