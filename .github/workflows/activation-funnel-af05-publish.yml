name: AF-05 preserve registered CI evidence

on:
  push:
    branches:
      - feat/activation-funnel-af05-depth-stable-causal
    paths:
      - .github/workflows/activation-funnel-af05-publish.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: af05-evidence-publication
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download, verify and deterministically package all 14 original CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import io
          import json
          import os
          import subprocess
          import tarfile
          import zipfile

          repo='MoralityLabAI/LoopedTransformers'
          run_id=43596117629
          source='dbc3ccac12a0263626be7466b62f0486b0a2b01b'
          base='https://api.github.com/repos/'+repo
          folder=Path('dist');folder.mkdir(exist_ok=True)
          def download(url):
              # curl drops Authorization on cross-host redirect. The GitHub REST
              # endpoint authenticates the request before issuing a signed URL.
              result=subprocess.run(
                  ['curl','--fail','--silent','--show-error','--location',
                   '--retry','3','--connect-timeout','15',
                   '--header','Authorization: Bearer '+os.environ['GH_TOKEN'],
                   '--header','Accept: application/vnd.github+json',url],
                  stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
              return result.stdout
          def digest(raw):return hashlib.sha256(raw).hexdigest()
          meta=json.loads(download(base+'/actions/runs/'+str(run_id)+'/artifacts?per_page=100'))
          artifacts=[a for a in meta['artifacts'] if not a.get('expired') and a['name'].startswith('af05-') and a['name'].endswith('-'+str(run_id))]
          assert len(artifacts)==14,(len(artifacts),[a['name'] for a in artifacts])
          assert len({a['name'] for a in artifacts})==14
          manifest={'schema':'af05-permanent-ci-archive-v1','repo':repo,'source_commit':source,'ci_run':run_id,
                    'ci_url':'https://github.com/'+repo+'/actions/runs/'+str(run_id),
                    'artifact_count':14,'scope':'Original CI ZIPs, with source-bound proof oracle and independent replay; AF-05 inconclusive verdict preserved',
                    'artifacts':{}}
          zips={}
          for artifact in sorted(artifacts,key=lambda a:a['name']):
              name=artifact['name']
              raw=download(base+'/actions/artifacts/'+str(artifact['id'])+'/zip')
              sha=digest(raw)
              assert artifact['digest']=='sha256:'+sha,(name,sha,artifact['digest'])
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  assert z.testzip() is None
                  names=z.namelist()
                  assert len(names)==len(set(names))
                  assert all(n and not n.startswith('/') and '..' not in Path(n).parts for n in names)
                  entries={f.filename:{'size':f.file_size,'sha256':digest(z.read(f.filename))}
                           for f in z.infolist() if not f.is_dir()}
                  if name.startswith('af05-results-'):
                      assert z.read('source_revision.txt').decode().strip()==source
                      result=json.loads(z.read('results.json'))
                      assert result['primary_verdict']=='inconclusive'
                      assert result['clean_rows']==8928 and result['patch_rows']==17856
                      assert result['training_models']==18 and result['independent_audit_passed']
              zips[name+'.zip']=raw
              manifest['artifacts'][name]={'artifact_id':artifact['id'],'sha256':sha,
                                             'bytes':len(raw),'members':entries}
              print('Verified',name,sha,len(entries),flush=True)
          archive=folder/'af05_ci_evidence_20261114.tar'
          def insert(tf,name,content):
              info=tarfile.TarInfo(name)
              info.size=len(content); info.mtime=0;info.uid=info.gid=0
              info.uname=info.gname='';info.mode=0o644
              tf.addfile(info,io.BytesIO(content))
          readme=b'AF-05 registered inconclusive result with independently verified CI replay. Source dbc3cca. Details in manifest.json and RESULTS.md.\n'
          manifest_raw=(json.dumps(manifest,sort_keys=True,indent=2)+'\n').encode()
          with tarfile.open(archive,'w',format=tarfile.GNU_FORMAT) as tf:
              insert(tf,'README.txt',readme)
              insert(tf,'RESULTS.md',Path('docs/research/AF05_RESULTS.md').read_bytes())
              insert(tf,'PROTOCOL.json',Path('experiments/activation_funnel_af05/PROTOCOL.json').read_bytes())
              insert(tf,'manifest.json',manifest_raw)
              for name in sorted(zips):insert(tf,'ci/'+name,zips[name])
          with tarfile.open(archive,'r') as tf:
              assert len(tf.getnames())==len(zips)+4
              assert tf.extractfile('manifest.json').read()==manifest_raw
              for name,original in zips.items():
                  assert digest(tf.extractfile('ci/'+name).read())==digest(original)
          archive_sha=digest(archive.read_bytes())
          (folder/(archive.name+'.sha256')).write_text(archive_sha+'  '+archive.name+'\n')
          (folder/'release_notes.md').write_text(
              'AF-05 depth-stable causal abstraction study, frozen source '+source+'.\n\n'
              'Engineering: 14 of 14 CI jobs passed, including 4,176 Lean-generated Boolean-Horn certificates, '
              '18 frozen models, 8,928 clean and 17,856 patched held-out rows, and independent checkpoint/metric replay.\n\n'
              'Scientific: registered causal-advantage hypothesis INCONCLUSIVE. All three primary width2 causal'
              ' models failed the development eligibility gate; retain unqualified patch comparisons as descriptive.\n\n'
              'All original CI ZIPs are retained byte-identically with SHA-256 and per-member manifest checks.'
              ' See RESULTS.md, PROTOCOL.json and PR #45.\n'
          )
          print('AF05_ARCHIVE_SHA256',archive_sha,'BYTES',archive.stat().st_size,flush=True)
          PY
      - name: Publish pinned private-repository prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=af05-ci-evidence-dbc3cca-20261114
          if gh release view "${TAG}" --repo MoralityLabAI/LoopedTransformers >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/af05_ci_evidence_20261114.tar dist/af05_ci_evidence_20261114.tar.sha256 --clobber --repo MoralityLabAI/LoopedTransformers
          else
            gh release create "${TAG}" --repo MoralityLabAI/LoopedTransformers \
              --target dbc3ccac12a0263626be7466b62f0486b0a2b01b \
              --title 'AF-05 frozen CI evidence (inconclusive result)' \
              --notes-file dist/release_notes.md --prerelease \
              dist/af05_ci_evidence_20261114.tar dist/af05_ci_evidence_20261114.tar.sha256
          fi
          gh release view "${TAG}" --repo MoralityLabAI/LoopedTransformers --json url,assets \
            --jq '{url:.url,assets:[.assets[].name]}'
