name: MOLT-09 native observable BPD
on:
  pull_request:
    paths:
      - 'research_gym/interp/aux_gym_v2_observable_bpd.py'
      - 'tests/test_aux_observable_bpd.py'
      - '.github/workflows/molt-native-observer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-observer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/BPD
          ref: 722613a80d80af0e80bb9f5ac1ce83eef111e4f7
          path: .native-bpd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pytest
      - run: python -m pytest -q tests/test_aux_observable_bpd.py
      - name: Fit a tiny teacher and native BPD factors
        run: |
          python -m research_gym.interp.aux_gym_v2 build --out /tmp/molt09/data --seed 2026112697 --train-quota 2 --eval-quota 1
          python -m research_gym.interp.aux_gym_v2 pilot --data /tmp/molt09/data --out /tmp/molt09/teacher --family modular_recurrence --arm LOOP-T --mode symbolic_trace --seed 1 --steps 8 --batch 8 --threads 1
          python -m research_gym.interp.aux_gym_v2_native_bpd --bpd-checkout .native-bpd --data /tmp/molt09/data --run /tmp/molt09/teacher --out /tmp/molt09/factors --seed 1 --components 8 --steps 2 --warmup 1 --batch 2 --threads 1 --smoke-no-null
      - name: Native swaps, observer maps and matched continuation
        run: |
          python -m research_gym.interp.aux_gym_v2_observable_bpd --bpd-checkout .native-bpd --data /tmp/molt09/data --run /tmp/molt09/teacher --factors /tmp/molt09/factors --out /tmp/molt09/replay --anchors 2 --donors 16 --rank 4 --updates 4 --batch 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: molt09-native-observer-engineering
          path: /tmp/molt09
          retention-days: 7
          if-no-files-found: warn
