name: NEC-04B frozen six-root Looper native headroom pilot

on:
  push:
    branches: ['research/nec04b-native-headroom-pilot-20261122']
    paths:
      - '.github/workflows/nec04b-native-headroom.yml'
      - 'mechinterp/neuron_communities/nec04b_*'
      - 'mechinterp/neuron_communities/test_nec04b_native_pilot.py'
      - 'mechinterp/neuron_communities/NEC04B_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nec04b-six-new-calibration-world-root-native-headroom
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  DNNL_MAX_CPU_ISA: AVX2
  PYTHONHASHSEED: '0'

jobs:
  original_teacher_oracles_preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore previously independent NEC04A calibration-only world/source corpus
        uses: actions/download-artifact@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          run-id: 44983509977
          name: nec04a-calibration-only-24-worlds-61440-examples-and-independent-oracle
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nec04b/original
      - name: Install deterministic CPU native Looper and test stack
        run: |
          python -m pip install pytest==8.4.2 networkx==3.4.2 numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Source code immutable preregistration, additive independent oracle and Looper smoke tests
        timeout-minutes: 15
        run: |
          python -m pytest -q mechinterp/neuron_communities/test_nec04b_native_pilot.py
          python -m compileall -q \
            mechinterp/neuron_communities/nec04b_oracles.py \
            mechinterp/neuron_communities/nec04b_independent_oracles.py \
            mechinterp/neuron_communities/nec04b_native_pilot.py \
            mechinterp/neuron_communities/nec04b_independent_native_audit.py \
            mechinterp/neuron_communities/nec04b_aggregate.py
          python - <<'PY'
          from mechinterp.neuron_communities.nec04b_oracles import verify_lock
          cfg,sha=verify_lock()
          assert cfg['pilot_calibration_root_indices']==list(range(6))
          assert cfg['pilot_model_teacher_arms']==['composed','additive']
          assert cfg['native_training_steps']==[120,240,480,900]
          assert cfg['native_batch_size']==64
          assert cfg['development_world_specs_materialized']==0
          assert cfg['confirmation_world_specs_materialized']==0
          assert cfg['calibration_reserved_contexts_scored']==0
          assert cfg['old_NEC03P_recruited_worlds_scored']==0
          print('NEC04B_FROZEN_NEW_ROOT_NATIVE_LOOPER_MODEL_AND_ORACLE_LOCK_PASS',sha)
          PY
      - name: Freeze six exact composed and additive task teachers and owned validation splits BEFORE training
        run: |
          python -m mechinterp.neuron_communities.nec04b_oracles \
            --original /tmp/nec04b/original --out /tmp/nec04b/oracles
          python -m mechinterp.neuron_communities.nec04b_independent_oracles \
            --folder /tmp/nec04b/oracles --out /tmp/nec04b/oracles-audit
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/nec04b/oracles/nec04b_pretraining_oracles.json')
          data=json.loads(root.read_text())
          audit=json.loads(Path('/tmp/nec04b/oracles-audit/nec04b_independent_teacher_oracle_audit.json').read_text())
          assert data['root_indices']==list(range(6))
          assert data['training_step_budgets']==[120,240,480,900]
          assert data['model_optimizer_steps_before_preflight']==0
          assert audit['pilot_roots_verified']==6
          assert audit['source_label_rows_verified']==30720
          assert audit['owned_validation_label_rows_verified']==9216
          assert audit['independent_scalar_composed_oracle']
          assert audit['independent_scalar_linear_additive_oracle']
          assert audit['original_reserved_context_labels_scored']==0
          assert audit['new_development_root_programs_generated']==0
          assert audit['new_confirmation_root_programs_generated']==0
          assert audit['FSI_01_gate']=='REDESIGN_OR_PILOT_ONLY'
          print('NEC04B_OWNED_SIX_ROOT_SOURCE_AND_VALIDATION_ORACLES_AUDITED_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nec04b-frozen-six-root-pretraining-oracles-independently-audited
          path: |
            /tmp/nec04b/oracles/
            /tmp/nec04b/oracles-audit/
          retention-days: 90
          if-no-files-found: error

  original_six_calibration_native_worlds:
    needs: original_teacher_oracles_preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        index: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore six root pretraining native target oracles with independent validation seal
        uses: actions/download-artifact@v4
        with:
          name: nec04b-frozen-six-root-pretraining-oracles-independently-audited
          path: /tmp/nec04b
      - name: Install original deterministic CPU Looper stack
        run: |
          python -m pip install networkx==3.4.2 numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Continuous 900 source-only AdamW updates per native teacher and four sealed checkpoints
        timeout-minutes: 83
        run: |
          python -m mechinterp.neuron_communities.nec04b_native_pilot \
            --root-index ${{ matrix.index }} \
            --oracles /tmp/nec04b/oracles \
            --out /tmp/nec04b/output
      - name: Independently replay all eight model checkpoints, optimizer state and complete validation logits
        timeout-minutes: 27
        run: |
          python -m mechinterp.neuron_communities.nec04b_independent_native_audit \
            --root-index ${{ matrix.index }} \
            --oracles /tmp/nec04b/oracles \
            --out /tmp/nec04b/output
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/nec04b/output/nec04b_independent_native_headroom_audit.json').read_text())
          assert a['all_8_frozen_checkpoints_native_model_SHA256_verified']
          assert a['all_8_optimizer_state_step_counts_verified']
          assert a['all_8_source_and_validation_full_logits_independently_replayed']
          assert a['training_trajectory_independently_reoptimized'] is False
          assert a['original_reserved_contexts_scored']==0
          assert a['new_development_root_specs_instantiated']==0
          assert a['new_confirmation_root_specs_instantiated']==0
          assert a['old_NEC03P_worlds_scored']==0
          print('NEC04B_NATIVE_EIGHT_CHECKPOINT_INDEPENDENT_SOURCE_AND_VALIDATION_AUDIT_PASS',a['world_id'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nec04b-pilot-root-${{ matrix.index }}
          path: /tmp/nec04b/output/
          retention-days: 60
          if-no-files-found: warn

  six_root_headroom_and_stop_gate:
    needs: [original_teacher_oracles_preflight, original_six_calibration_native_worlds]
    if: ${{ always() && needs.original_teacher_oracles_preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: nec04b-pilot-root-*
          merge-multiple: false
          path: /tmp/nec04b/root-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: nec04b-frozen-six-root-pretraining-oracles-independently-audited
          path: /tmp/nec04b
      - name: Root-level accuracy bands with exact six independently audited native world roots
        run: |
          python -m mechinterp.neuron_communities.nec04b_aggregate \
            --roots /tmp/nec04b/root-artifacts \
            --pretraining /tmp/nec04b/oracles \
            --out /tmp/nec04b/results
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/nec04b/results/nec04b_six_root_headroom_aggregate.json').read_text())
          assert result['original_calibration_root_indices']==list(range(6))
          assert result['all_six_roots_have_two_independently_scored_teacher_arms']
          assert result['all_48_native_checkpoint_states_sha_audited']
          assert result['all_48_training_and_owned_validation_metrics_replayed']
          assert result['fixed_four_native_checkpoint_budgets']==[120,240,480,900]
          assert len(result['checkpoint_budget_snapshots'])==4
          assert result['source_SAE_fitted'] is False
          assert result['source_specific_sham_scored'] is False
          assert result['original_reserved_contexts_scored']==0
          assert result['new_development_world_root_specs_materialized']==0
          assert result['new_confirmation_world_root_specs_materialized']==0
          assert result['old_NEC03P_recruited_worlds_scored']==0
          assert result['old_NEC03_embargoed_worlds_scored']==0
          assert result['FSI_01_gate']=='REDESIGN_OR_PILOT_ONLY'
          print('NEC04B_SIX_NATIVE_ROOT_HEADROOM_AND_FROZEN_STOP_GATE_PASS',
                result['decision'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nec04b-six-root-native-headroom-independently-audited-aggregate
          path: /tmp/nec04b/results/
          retention-days: 90
          if-no-files-found: warn
