name: AF-10 preserve exact causal-cut original-model evidence

on:
  push:
    branches: [feat/activation-funnel-af10-causal-cut]
    paths: ['.github/workflows/activation-funnel-af10-publish.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: af10-evidence-archive
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify original three artifacts and assemble deterministic archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,io,json,os,subprocess,tarfile,zipfile
          repo='MoralityLabAI/LoopedTransformers'
          source='0b50e66b85d66f624a2d07ecc1409e9bef17bacd'
          original=43687693065
          repair=43688035642
          artifacts={
           'af10-seed-17':(14151330748,'5d1fcfa078a3b0eb126d9b8d614762980ee22209b067317f67ef118f303839d8'),
           'af10-seed-29':(14151510190,'00aad3752286a3bcf7cf55103973efef082ee83738c1e5bc3adc2861ac2560eb'),
           'af10-independent-aggregate-repair':(14151341146,'885031472ab1c876127070b706311c37b51d61ac306ff507b701a6952d636ae5'),
          }
          sha=lambda b:hashlib.sha256(b).hexdigest()
          def fetch(url):
            return subprocess.run(['curl','--fail','--silent','--show-error','--location',
              '--retry','3','--retry-delay','2',
              '-H','Authorization: Bearer '+os.environ['GH_TOKEN'],
              '-H','Accept: application/vnd.github+json',url],
              stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout
          # Science-bound code is identical to the original source commit.
          subprocess.run(['git','diff','--exit-code',source,'HEAD','--',
             'experiments/activation_funnel_af10'],check=True)
          root=Path('experiments/activation_funnel_af10')
          protocol=root/'PROTOCOL.json'
          assert sha(protocol.read_bytes())=='a90bffb5180b7b321094f7fea83f3d918ce300396216ad840354a71623ca444c'
          contents={};manifest={'schema':'af10-frozen-ci-archive-v1','repository':repo,
           'original_source_commit':source,'initial_ci_run':original,'repair_run':repair,
           'source_provenance':'No trained AF-10 weights: exact structural theorem plus frozen AF-09 replay; later reports do not tune the observed diagnostic',
           'artifacts':{}}
          for name,(ident,expected) in sorted(artifacts.items()):
            meta=json.loads(fetch(f'https://api.github.com/repos/{repo}/actions/artifacts/{ident}'))
            assert meta['name']==name and meta['digest']=='sha256:'+expected and not meta['expired']
            raw=fetch(f'https://api.github.com/repos/{repo}/actions/artifacts/{ident}/zip')
            assert sha(raw)==expected,(name,sha(raw))
            with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              names=z.namelist();assert len(names)==len(set(names))
              assert all(p and not p.startswith('/') and '..' not in Path(p).parts for p in names)
              members={i.filename:{'sha256':sha(z.read(i.filename)),'bytes':i.file_size}
                       for i in z.infolist() if not i.is_dir()}
              if name.startswith('af10-seed-'):
                record=json.loads(z.read('independent_audit.json'))
                assert record['verified'] and record['rows']==4320 and record['checkpoints_replayed']==90
                assert record['source_sha256'] in (
                  'c29f63fec6c66dc1ae62b820bb7fa12a12e744bd49933de397c4e7bace16c488',
                  'ef4fb7b2a45fd643e25959b7d1d20142d5063dfe86d8da19fb069dd01a0bcc5c')
                summary=json.loads(z.read('summary.json'))
                assert record['summary_sha256']==sha(z.read('summary.json'))
                assert record['retained_rows_sha256']==sha(z.read('cut_replay.jsonl'))
                assert summary['rows']==4320
              else:
                result=json.loads(z.read('aggregate.json'))
                assert result['all_integrity_checks_pass'] and result['rows']==8640
                assert result['original_models']==6 and result['checkpoint_replay_calls']==180
                assert sha(z.read('aggregate.json'))=='6028faec632d45c3b52ed55121819cc95ab508ff84f4e02946d1c3c2acf73769'
                assert z.read('source_revision.txt').decode().strip()==source
            contents[name+'.zip']=raw
            manifest['artifacts'][name]={'artifact_id':ident,'zip_sha256':expected,'bytes':len(raw),'members':members}
            print('VALID',name,expected,flush=True)
          documentary=[
           'docs/research/AF10_RESULTS.md',
           'docs/research/AF10_CAUSAL_CUT_THEOREM.md',
           'experiments/activation_funnel_af10/CausalCut.lean',
           'experiments/activation_funnel_af10/PROTOCOL.json',
          ]
          docs={p:Path(p).read_bytes() for p in documentary}
          manifest['source_documents']={p:sha(raw) for p,raw in docs.items()}
          payload=(json.dumps(manifest,sort_keys=True,indent=2)+'\n').encode()
          intro=(f'AF-10 causal-cut original-model replay, source {source}.\n'
                 'Original CI preflight and both seed jobs passed; its aggregate failed before scoring because NumPy was missing.\n'
                 'Source-pinned repair verified the original two artifacts. This is structural transport science, not a new trained-model superiority test.\n').encode()
          dist=Path('dist');dist.mkdir(exist_ok=True)
          tar=dist/'af10_ci_evidence_20261115.tar'
          def entry(tf,name,data):
             h=tarfile.TarInfo(name);h.size=len(data);h.mtime=0;h.uid=h.gid=0
             h.uname=h.gname='';h.mode=0o644;tf.addfile(h,io.BytesIO(data))
          with tarfile.open(tar,'w',format=tarfile.GNU_FORMAT) as tf:
             entry(tf,'README.txt',intro)
             entry(tf,'manifest.json',payload)
             for name,raw in sorted(docs.items()):entry(tf,name,raw)
             for name,raw in sorted(contents.items()):entry(tf,'ci/'+name,raw)
          with tarfile.open(tar,'r') as tf:
             assert len(tf.getnames())==2+len(docs)+len(contents)
             assert tf.extractfile('manifest.json').read()==payload
             for name,raw in contents.items():assert sha(tf.extractfile('ci/'+name).read())==sha(raw)
          archive_sha=sha(tar.read_bytes())
          (dist/(tar.name+'.sha256')).write_text(archive_sha+'  '+tar.name+'\n')
          (dist/'manifest.json').write_bytes(payload)
          (dist/'release_notes.md').write_text(
            'AF-10 original-cell causal-cut theorem and diagnostic; structural no-cross-talk proof.\n\n'
            'Exact source commit '+source+'. Preflight Lean4.19.0 and two frozen-seed independent audits passed.\n'
            'Original aggregate failed due to a missing NumPy runtime dependency; later source-pinned repair passed on the same two artifacts.\n'
            'Eight thousand six hundred forty donor rows, 180 independent forward replays, zero protected-code invariance failures.\n'
            'Scientific gain measurements are retrospective diagnostics, not preregistered model superiority.\n'
            'Archive SHA256: '+archive_sha+'\n'
          )
          print('ARCHIVE_SHA256',archive_sha,'BYTES',tar.stat().st_size,flush=True)
          PY
      - name: Publish immutable private prerelease pinned to causal-cut source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=af10-ci-evidence-0b50e66-20261115
          if gh release view "$TAG" --repo MoralityLabAI/LoopedTransformers >/dev/null 2>&1; then
            echo 'Existing fixed tag; preserve original assets' >&2
            exit 1
          fi
          gh release create "$TAG" --repo MoralityLabAI/LoopedTransformers \
            --target 0b50e66b85d66f624a2d07ecc1409e9bef17bacd \
            --title 'AF-10 verified original-model causal-cut evidence' --prerelease \
            --notes-file dist/release_notes.md \
            dist/af10_ci_evidence_20261115.tar \
            dist/af10_ci_evidence_20261115.tar.sha256 \
            dist/manifest.json
          gh release view "$TAG" --repo MoralityLabAI/LoopedTransformers --json url,assets \
            --jq '{url:.url,assets:[.assets[].name]}'