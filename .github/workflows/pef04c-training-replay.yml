name: PEF-04C exact original training-stream history replay
on:
  pull_request:
    paths:
      - 'research/pef04/pef04_training_path.py'
      - 'research/pef04/test_pef04_training_path.py'
      - 'research/pef04/PEF04C_POSTHOC.md'
      - '.github/workflows/pef04c-training-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-fixed-streams:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin CPU deterministic backend
        run: |
          python -m pip install pytest
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Download six source checkpoints and preregistered results
        uses: actions/download-artifact@v4
        with:
          name: pef04-preregistered-six-seed-frozen-checkpoints-and-receipts
          run-id: 43683120934
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: MoralityLabAI/LoopedTransformers
          path: /tmp/pef04c_original
      - name: Validate original source checkpoint byte digests before any replay
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/pef04c_original')
          pin={
             101:'eaeff893c0a0d5daee327647699cb25c6369e7a4acc2627c2caeee9ee2fc7ce8',
             109:'5d967834aa35a3f9c318aacb58fed7d5df31a70fc20832aa962baedce9c7c17c',
             127:'754c79fe772bdaff1fea1531374c67ee9c5ffe0f5e9f2f86a4b30bfcaa724eb0',
             131:'49b25863d760a3a6d8cd57776759ec01549d43d5e34e86b5616e97cb9c2140af',
             149:'fd608135b94b859efb2ea36dba3f274216d80ea90baf75b2d19448282a0e93bc',
             157:'dffa2207536487961d1684524938da5a462cccccdce38ae720f3128c2d4943d1'
          }
          ledger=json.loads((p/'sealed_training_ledger.json').read_text())
          assert [r['seed'] for r in ledger['training']]==list(pin)
          for row in ledger['training']:
              seed=row['seed']
              digest=hashlib.sha256((p/f'seed{seed}.frozen.pt').read_bytes()).hexdigest()
              assert digest==pin[seed]==row['checkpoint_sha256']
              assert row['steps']==250
          PY
      - name: Verify snapshot integrity and pair closure
        run: python -m pytest research/pef04/test_pef04_training_path.py -q
      - name: Replay exact six original optimizer streams and test terminal parameter SHA256
        run: python -m research.pef04.pef04_training_path --source /tmp/pef04c_original --out /tmp/pef04c_results
      - name: Fail on any missing exact original terminal weight replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/pef04c_results')
          out=json.loads((root/'trajectory_summary.json').read_text())
          assert out['retrospective_training_path_selected_after_preregistered_negative_result']
          assert out['original_registered_decision_preserved']=='criterion_not_met'
          assert out['exact_original_terminal_checkpoint_weights_reproduced_all_six']
          assert out['original_terminal_readout_scores_reproduced_all_six']
          assert len(out['results'])==6
          assert out['optimizer_steps_scanned']==[0,10,25,50,75,100,125,150,175,200,225,250]
          for seed in (101,109,127,131,149,157):
              r=json.loads((root/f'seed{seed}.trajectory.json').read_text())
              assert r['original_final_checkpoint_weight_replay_passed']
              assert r['original_registered_terminal_scores_reproduced']
              assert len(r['snapshots'])==12
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pef04c-exact-source-optimizer-trajectory-receipts
          path: /tmp/pef04c_results/
          if-no-files-found: warn
