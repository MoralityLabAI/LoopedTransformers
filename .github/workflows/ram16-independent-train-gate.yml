name: RAM-16 independent third compiler TRAIN gate

on:
  push:
    paths: ['.github/workflows/ram16-independent-train-gate.yml', 'experiments/lean_ram16/third_audit.py', 'experiments/lean_ram16/test_contract.py']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  LEAN_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  independent-original-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout frozen source-only audit implementation
        uses: actions/checkout@v4
      - name: Checkout original MathCan TRAIN/DEV source, never TEST
        uses: actions/checkout@v4
        with:
          repository: patrickdugan/MathCan
          ref: f427e0ef4a61093304d12ca2c0dc943d8d2429e5
          path: _mathcan_train
          persist-credentials: false
      - name: Remove protected original TEST modules before any compiler work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _mathcan_train rev-parse HEAD)" = f427e0ef4a61093304d12ca2c0dc943d8d2429e5
          rm -f _mathcan_train/MathCan/{TemporalCutCapacity,PhaseLatch,ObserverLabelAlignment,ContractionAliasing}.lean
          test ! -f _mathcan_train/MathCan/NOR18RReciprocalReuse.lean
          for f in TemporalCutCapacity PhaseLatch ObserverLabelAlignment ContractionAliasing; do
            test ! -f "_mathcan_train/MathCan/$f.lean"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned resource monitor, Lean4.35 and permitted original module dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check psutil==7.1.3
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            -o /tmp/lean435.tar.zst
          tar --zstd -xf /tmp/lean435.tar.zst -C /tmp
          export PATH="/tmp/lean-4.35.0-linux/bin:$PATH"
          echo /tmp/lean-4.35.0-linux/bin >> "$GITHUB_PATH"
          lean --version | grep -F 'Lean (version 4.35.0,'
          (cd _mathcan_train && lake build MathCan.Intervention MathCan.Hodge MathCan.HookState MathCan.TOEGraph MathCan.GramianTransfer MathCan.FilteredOrbit MathCan.OrbitStitching MathCan.GraphAuthorization MathCan.MultiBasin MathCan.PhaseMemory MathCan.BasinCapture MathCan.TreeReconstruction MathCan.MemoryProjection)
          echo "LEAN_PATH=$GITHUB_WORKSPACE/experiments/lean_ram16:$(cd _mathcan_train && lake env printenv LEAN_PATH)" >> "$GITHUB_ENV"
      - name: Retrieve exactly first successful source-only TRAIN/DEV collection
        uses: actions/download-artifact@v4
        with:
          name: ram16-original-native-source-train-43802741798
          run-id: 43802741798
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _ram16_first_source_train
      - name: Audit original source corpus and independently triple-compile positives
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s experiments/lean_ram16 -p 'test_*.py' -v
          lean experiments/lean_ram16/ProbeServer.lean -o experiments/lean_ram16/ProbeServer.olean
          python experiments/lean_ram16/third_audit.py \
            --mathcan _mathcan_train --lean /tmp/lean-4.35.0-linux/bin/lean \
            --first _ram16_first_source_train --out "$RUNNER_TEMP/ram16_third_verified"
      - name: Preserve the exact third compiler source, evidence and gate failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ram16-independent-train-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/ram16_third_verified/
          retention-days: 30
          if-no-files-found: warn
