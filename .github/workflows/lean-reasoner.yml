name: Lean Reasoner proof audit
on:
  push:
    paths:
      - 'experiments/lean_reasoner/**'
      - '.github/workflows/lean-reasoner.yml'
  pull_request:
    paths:
      - 'experiments/lean_reasoner/**'
      - '.github/workflows/lean-reasoner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Lean 4.19.0
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/lean.tar.zst
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo '/tmp/lean-4.19.0-linux/bin' >> "$GITHUB_PATH"
      - name: Generate corpus and check every proof with Lean
        working-directory: experiments/lean_reasoner
        run: |
          python3 proof_data.py generate
          python3 proof_data.py verify
