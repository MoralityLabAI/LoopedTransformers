name: OLR-07B local CPU gym smoke
on:
  pull_request:
    paths:
      - "research/lean_cgrt_hrm400/ppt_gym/olr07b_cpu.py"
      - "research/lean_cgrt_hrm400/ppt_gym/tests/test_olr07b.py"
      - "research/lean_cgrt_hrm400/run_olr07b.py"
      - ".github/workflows/olr07b-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: olr07b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: leanprover/lean4
          ref: 6caaee842e9495688c1567e78c0e68dbb96942aa
          path: lean4-source
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_cgrt_hrm400/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy psutil
      - name: Authenticate original 07A artifact without transforming its zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/14890402416/zip > "$RUNNER_TEMP/07a.zip"
      - name: CPU model and receipt contract tests
        working-directory: research/lean_cgrt_hrm400
        run: python -m unittest discover -s ppt_gym/tests -p test_olr07b.py -v
      - name: Native six-file local-run smoke
        working-directory: research/lean_cgrt_hrm400
        run: |
          python run_olr07b.py --lean-source "${{ github.workspace }}/lean4-source" --prior-07a "$RUNNER_TEMP/07a.zip" --out runs/olr07b-smoke --profile smoke --threads 2 --workers 1 --ram 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olr07b-smoke
          path: |
            research/lean_cgrt_hrm400/runs/olr07b-smoke*
          if-no-files-found: ignore
