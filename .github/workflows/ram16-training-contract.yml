name: RAM-16 matched 23-family CPU model construction and supervised data contracts
on:
  push:
    paths: ['.github/workflows/ram16-training-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only-model-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore pinned CPU optimizer and resource monitor packages
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install psutil==7.1.3 numpy==2.1.3
      - name: Test 23-row families, equal-budget architecture initialization and task loss
        run: |
          python -m unittest discover -s experiments/lean_ram16 -p 'test_training.py' -v
          python -m unittest discover -s experiments/lean_ram16 -p 'test_contract.py' -v
          python -m py_compile experiments/lean_ram16/{train,third_audit,collect,grammar}.py
