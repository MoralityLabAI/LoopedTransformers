name: AF-07 preserve frozen recurrence-locality evidence

on:
  push:
    branches:
      - feat/activation-funnel-af07-recurrence-locality
    paths:
      - .github/workflows/activation-funnel-af07-publish.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: af07-scored-evidence-publication
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify original run artifacts and produce deterministic archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, os, json, hashlib, tarfile, zipfile, subprocess
          from pathlib import Path
          repo='MoralityLabAI/LoopedTransformers'
          run_id=43675750007
          repair_run_id=43676432842
          source='6c85f02c289201c9666fd99056515d68e62fb545'
          url='https://api.github.com/repos/'+repo
          out=Path('dist');out.mkdir(exist_ok=True)
          def digest(raw):return hashlib.sha256(raw).hexdigest()
          def fetch(endpoint):
              cp=subprocess.run(['curl','--fail','--silent','--show-error','--location',
                  '--retry','3','--connect-timeout','20',
                  '-H','Authorization: Bearer '+os.environ['GH_TOKEN'],
                  '-H','Accept: application/vnd.github+json',endpoint],
                  stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
              return cp.stdout
          metadata=json.loads(fetch(url+'/actions/runs/'+str(run_id)+'/artifacts?per_page=100'))
          artifacts=[a for a in metadata['artifacts'] if not a['expired']
              and a['name'].startswith('af07-') and a['name'].endswith('-'+str(run_id))]
          expected=['af07-preflight-'+str(run_id)]
          for seed in (17,29,43):
              for width in (1,2):
                  expected.extend(['af07-train-s%d-w%d-%d'%(seed,width,run_id),
                                   'af07-eval-s%d-w%d-%d'%(seed,width,run_id)])
          assert len(artifacts)==13,(len(artifacts),[a['name'] for a in artifacts])
          assert {a['name'] for a in artifacts}==set(expected)
          repair_meta=json.loads(fetch(url+'/actions/runs/'+str(repair_run_id)+'/artifacts?per_page=100'))
          repair=[a for a in repair_meta['artifacts'] if not a['expired'] and
               a['name']=='af07-results-repair-'+str(repair_run_id)]
          assert len(repair)==1,repair
          artifacts+=repair
          manifest={'schema':'af07-ci-evidence-v1','repository':repo,
              'scientific_source_sha':source,'original_ci_run':run_id,'aggregate_repair_run':repair_run_id,
              'original_ci_url':'https://github.com/'+repo+'/actions/runs/'+str(run_id),
              'repair_ci_url':'https://github.com/'+repo+'/actions/runs/'+str(repair_run_id),
              'artifacts':{},'provenance':'13 original successful artifacts plus one independent aggregate repair after missing Torch in original reducer'}
          copies={};results=None;report=None;evals=0
          for item in sorted(artifacts,key=lambda x:x['name']):
              name=item['name'];raw=fetch(url+'/actions/artifacts/'+str(item['id'])+'/zip')
              sha=digest(raw)
              assert item['digest']=='sha256:'+sha,(name,item['digest'],sha)
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  assert z.testzip() is None
                  names=z.namelist()
                  assert len(names)==len(set(names))
                  assert all(n and not n.startswith('/') and '..' not in Path(n).parts for n in names)
                  member_hashes={f.filename:{'sha256':digest(z.read(f.filename)),'bytes':f.file_size}
                     for f in z.infolist() if not f.is_dir()}
                  if name.startswith('af07-train-'):
                      assert z.read('source_revision.txt').decode().strip()==source
                      rec=json.loads(z.read('train/train_receipt.json'))
                      assert rec['experiment']=='AF-07' and set(rec['arms'])=={'warmup','status','ramp','locality'}
                  elif name.startswith('af07-eval-'):
                      audit=json.loads(z.read('independent_audit.json'))
                      evaluation=json.loads(z.read('evaluation.json'))
                      assert audit['passed'] and audit['evaluation_sha256']==digest(z.read('evaluation.json'))
                      assert (evaluation['clean_rows'],evaluation['patch_rows'],evaluation['trajectory_rows'])==(1488,2976,4512)
                      evals+=1
                  elif name.startswith('af07-results-'):
                      assert z.read('source_revision.txt').decode().strip()==source
                      results=json.loads(z.read('results.json'))
                      report=z.read('RESULTS.md')
                      assert results['experiment']=='AF-07'
                      assert results['independent_audit_passed']
                      assert (results['models'],results['warmups'],results['clean_rows'],
                              results['patch_rows'],results['trajectory_rows'])==(18,6,8928,17856,27072)
                      assert results['primary_verdict'] in ('pass','fail','inconclusive')
              copies[name+'.zip']=raw
              manifest['artifacts'][name]={
                  'id':item['id'],'zip_sha256':sha,'bytes':len(raw),'members':member_hashes}
              print('Verified',name,sha,len(member_hashes),flush=True)
          assert evals==6 and results is not None and report is not None
          manifest['primary_science_verdict']=results['primary_verdict']
          data=(json.dumps(manifest,indent=2,sort_keys=True)+'\n').encode()
          note=('AF-07 recurrence-locality proof-state study. Frozen source '+source+
                '. Registered scientific verdict '+results['primary_verdict'].upper()+
                '. Corpus facts and kernel checks are independent of neural claims.\n').encode()
          dest=out/'af07_ci_evidence_20261115.tar'
          def add(tf,name,content):
              info=tarfile.TarInfo(name)
              info.size=len(content);info.mtime=0;info.uid=info.gid=0
              info.uname=info.gname='';info.mode=0o644
              tf.addfile(info,io.BytesIO(content))
          with tarfile.open(dest,'w',format=tarfile.GNU_FORMAT) as tf:
              add(tf,'README.txt',note)
              add(tf,'RESULTS.md',report)
              add(tf,'PROTOCOL.json',Path('experiments/activation_funnel_af07/PROTOCOL.json').read_bytes())
              add(tf,'manifest.json',data)
              for name in sorted(copies):add(tf,'ci/'+name,copies[name])
          with tarfile.open(dest,'r') as tf:
              assert len(tf.getnames())==18
              assert tf.extractfile('manifest.json').read()==data
              assert tf.extractfile('RESULTS.md').read()==report
              for name,raw in copies.items():
                  assert digest(tf.extractfile('ci/'+name).read())==digest(raw)
          final_sha=digest(dest.read_bytes())
          (out/(dest.name+'.sha256')).write_text(final_sha+'  '+dest.name+'\n')
          (out/'release_notes.md').write_text(
              'AF-07 frozen source '+source+'. Original CI run '+str(run_id)+'.\n\n'
              'Verified original preflight and all six training/evaluation artifacts, plus independent repaired aggregate. '
              'Six shared status warmups, 18 continuation models, 8,928 clean, 17,856 original boundary patches and '
              '27,072 recurrence-resolved traces. Original complete Horn oracle and Lean certificates are retained; the repaired reducer uses the exact original six evaluation artifacts.\n\n'
              'Registered science verdict: '+results['primary_verdict'].upper()+'. '
              'See RESULTS.md and manifest.json for all negative and unqualified seeds.\n')
          print('AF07_ARCHIVE_SHA256',final_sha,'BYTES',dest.stat().st_size,flush=True)
          PY
      - name: Publish private prerelease anchored to frozen source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=af07-ci-evidence-6c85f02-20261115
          if gh release view "$TAG" --repo MoralityLabAI/LoopedTransformers >/dev/null 2>&1; then
            gh release upload "$TAG" dist/af07_ci_evidence_20261115.tar dist/af07_ci_evidence_20261115.tar.sha256 --clobber --repo MoralityLabAI/LoopedTransformers
          else
            gh release create "$TAG" --repo MoralityLabAI/LoopedTransformers \
              --target 6c85f02c289201c9666fd99056515d68e62fb545 \
              --title 'AF-07 frozen CI evidence' --notes-file dist/release_notes.md --prerelease \
              dist/af07_ci_evidence_20261115.tar dist/af07_ci_evidence_20261115.tar.sha256
          fi
          gh release view "$TAG" --repo MoralityLabAI/LoopedTransformers --json url,assets \
            --jq '{url:.url,assets:[.assets[].name]}'