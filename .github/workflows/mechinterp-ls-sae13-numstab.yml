name: LS-SAE13 matched ACT4 edit numerical-stability CPU pilot
# Engineering-only exploratory audit. Explicitly isolated from LS-SAE12's
# frozen registered stage: changes below never touch active_reasoning_v1/.
on:
  push:
    branches: [research/mechinterp-ls-sae13-numerical-stability-20261118]
    paths:
      - 'mechinterp/sae_causal_transfer/ls_sae13/**'
      - '.github/workflows/mechinterp-ls-sae13-numstab.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
  HF_HUB_DOWNLOAD_TIMEOUT: '180'
  HF_HUB_ETAG_TIMEOUT: '60'
  PYTHONUNBUFFERED: '1'
jobs:
  cpu-unit-and-engineering-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LS-SAE12-matched CPU dependency versions
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and test locked edits, certificates and batch layouts
        run: |
          python -m compileall -q mechinterp/sae_causal_transfer/ls_sae13
          python -m unittest discover -s mechinterp/sae_causal_transfer/ls_sae13 -p 'test_*.py' -v
      - name: Four known-puzzle CPU forward pilot, no scientific gate
        run: |
          python -m mechinterp.sae_causal_transfer.ls_sae13.run_pilot \
            --source mechinterp/sae_causal_transfer/results/ls_sae12/source_48.json \
            --out runs/ls_sae13/pilot-linux-cpu.json
      - name: Independent receipt shape and hash checks
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from mechinterp.sae_causal_transfer.ls_sae13 import run_pilot as P
          path = Path("runs/ls_sae13/pilot-linux-cpu.json")
          data = json.loads(path.read_bytes())
          assert data["schema"] == P.SCHEMA
          assert data["positions"] == list(P.POSITIONS)
          assert data["batches"] == list(P.BATCHES)
          assert data["protocol_registration_commit"] == P.PROTOCOL_COMMIT
          assert len(data["boards"]) == 4
          for board in data["boards"]:
              assert board["site"] == P.SITES[board["pool_position"]]
              edit = bytes.fromhex(board["edit_little_endian_float32_hex"])
              assert len(edit) == 2048
              assert hashlib.sha256(edit).hexdigest() == board["edit_sha256"]
              for size in P.BATCHES:
                  pr = board["probe"][str(size)]
                  assert len(pr["per_step"]) == 12
                  assert set(pr["trajectories"]) == {"clean","plus","minus"}
                  assert all("logit_sha256" in z["edits"]["plus"] for z in pr["per_step"])
          print("LS_SAE13_INDEPENDENT_SHAPE_AUDIT_PASS")
          print("RECEIPT_SHA256", hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae13-four-puzzle-cpu-pilot
          path: runs/ls_sae13/pilot-linux-cpu.json
          retention-days: 90
          if-no-files-found: warn
