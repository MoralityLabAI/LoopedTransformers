name: MOLT-17 exact dose verification
on:
  pull_request:
    paths:
      - 'research_gym/interp/molt_exact_dose_export.py'
      - 'research_gym/interp/molt_carry_feasibility.py'
      - 'lsa/exact_carry_certificate.py'
      - 'tests/test_exact_carry_certificate.py'
      - '.github/workflows/molt-exact-dose.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-dose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/BPD
          ref: 722613a80d80af0e80bb9f5ac1ce83eef111e4f7
          path: .native-bpd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pytest
      - run: python -m pytest -q tests/test_exact_carry_certificate.py
      - name: Reproduce frozen clock and fit, then export and independently verify exact witnesses
        run: |
          mkdir /tmp/molt17
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from research_gym.interp.aux_gym_v2_isolated_response import phase
          from research_gym.interp.molt_bpd_source import preflight
          root = Path("/tmp/molt17")
          source = root / "bpd-source.json"
          preflight(Path(".native-bpd"), source)
          commands = [
              ("clock", "molt_typed_clock", ["--out", str(root / "clock")]),
              ("bpd", "molt_typed_clock_bpd", ["--clock", str(root / "clock"),
                  "--bpd-checkout", ".native-bpd", "--bpd-source-receipt", str(source),
                  "--out", str(root / "bpd")]),
              ("repair", "molt_amortized_repair", ["--clock", str(root / "clock"),
                  "--factors", str(root / "bpd"), "--bpd-checkout", ".native-bpd",
                  "--bpd-source-receipt", str(source), "--out", str(root / "repair")]),
              ("export", "molt_exact_dose_export", ["--clock", str(root / "clock"),
                  "--factors", str(root / "bpd"), "--bpd-checkout", ".native-bpd",
                  "--bpd-source-receipt", str(source), "--controllers", str(root / "repair"),
                  "--out", str(root / "export")]),
          ]
          receipts = {}
          for name, module, args in commands:
              log = root / (name + ".log")
              receipts[name] = phase([sys.executable, "-m", "research_gym.interp." + module, *args],
                                     log, address_mib=8192, rss_mib=2048,
                                     cpu_seconds=300, wall_seconds=360)
              if receipts[name]["status"] == "success":
                  worker = json.loads((root / name / "receipt.json").read_text())
                  peak = worker.get("peak_rss_bytes")
                  receipts[name]["worker_kernel_peak_rss_bytes"] = peak
                  if peak is not None and peak > 2048 * 1024**2:
                      receipts[name]["status"] = "worker_reported_rss_guard_exceeded"
              (root / "phase-receipts.json").write_text(json.dumps(receipts, indent=2))
              print(log.read_text())
              print(json.dumps(receipts[name], sort_keys=True))
              if receipts[name]["status"] != "success":
                  raise SystemExit(f"{name} failed")
          log = root / "verify.log"
          receipts["verify"] = phase([sys.executable, "-m", "lsa.exact_carry_certificate",
              "--problems", str(root / "export" / "problems.json"),
              "--out", str(root / "exact-receipt.json")], log, address_mib=8192,
              rss_mib=2048, cpu_seconds=300, wall_seconds=360)
          (root / "phase-receipts.json").write_text(json.dumps(receipts, indent=2))
          print(log.read_text())
          print(json.dumps(receipts["verify"], sort_keys=True))
          if receipts["verify"]["status"] != "success":
              raise SystemExit("exact verifier failed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: molt17-exact-dose
          path: /tmp/molt17
          retention-days: 7
          if-no-files-found: warn
