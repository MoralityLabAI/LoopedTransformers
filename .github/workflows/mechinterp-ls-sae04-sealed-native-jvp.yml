name: LS-SAE04 sealed calibration then independent native 512D JVP
on:
  pull_request:
    paths:
      - 'mechinterp/sae_causal_transfer/native_jvp_v2/**'
      - '.github/workflows/mechinterp-ls-sae04-sealed-native-jvp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-numerical-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Source-only NPZ sealing and native forward/JVP regression checks
        run: |
          python -m compileall -q mechinterp/sae_causal_transfer/native_jvp_v2
          python -m unittest discover -s mechinterp/sae_causal_transfer/native_jvp_v1 -p 'test_*.py' -v
          python -m unittest discover -s mechinterp/sae_causal_transfer/native_jvp_v2 -p 'test_*.py' -v

  source-calibration-only:
    runs-on: ubuntu-latest
    needs: source-and-numerical-unit
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Generate ONLY source fit and byte-seal its arrays before any test
        run: python -m mechinterp.sae_causal_transfer.native_jvp_v2.freeze_fit --out-dir runs/ls_sae04/calibration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae04-original-preheldout-calibration-only
          path: runs/ls_sae04/calibration/
          retention-days: 90
          if-no-files-found: error

  isolated-pilot-4-puzzles:
    runs-on: ubuntu-latest
    needs: source-calibration-only
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download EXACT source-fit-only artifact from calibration job
        uses: actions/download-artifact@v4
        with:
          name: ls-sae04-original-preheldout-calibration-only
          path: runs/ls_sae04/source
      - name: Independent untouched pilot and full-512D JVP using frozen source fit
        run: python -m mechinterp.sae_causal_transfer.native_jvp_v2.run_native --pilot --calibration-manifest runs/ls_sae04/source/frozen_calibration_manifest.json --calibration-npz runs/ls_sae04/source/frozen_calibration.npz --out runs/ls_sae04/pilot.json
      - name: Independent stdlib pilot audit
        run: python -m mechinterp.sae_causal_transfer.native_jvp_v2.audit --input runs/ls_sae04/pilot.json --out runs/ls_sae04/pilot-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae04-native-JVP-pilot-and-independent-audit
          path: runs/ls_sae04/pilot*.json
          retention-days: 90
          if-no-files-found: warn

  full-24-fresh-sudoku:
    runs-on: ubuntu-latest
    needs: isolated-pilot-4-puzzles
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Independently download IDENTICAL original sealed calibration
        uses: actions/download-artifact@v4
        with:
          name: ls-sae04-original-preheldout-calibration-only
          path: runs/ls_sae04/source
      - name: Frozen source model, untouched 12+12 full-512D Jacobian-vector test
        run: python -m mechinterp.sae_causal_transfer.native_jvp_v2.run_native --calibration-manifest runs/ls_sae04/source/frozen_calibration_manifest.json --calibration-npz runs/ls_sae04/source/frozen_calibration.npz --out runs/ls_sae04/full.json
      - name: Independent stdlib source-seal, token JVP, rank and bootstrap replay
        run: python -m mechinterp.sae_causal_transfer.native_jvp_v2.audit --input runs/ls_sae04/full.json --out runs/ls_sae04/full-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae04-full512-native-evidence-sourcefit-and-audit
          path: |
            runs/ls_sae04/full*.json
            runs/ls_sae04/source/
          retention-days: 90
          if-no-files-found: warn
