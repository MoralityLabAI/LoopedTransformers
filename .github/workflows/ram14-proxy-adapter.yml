name: RAM-14 frozen 20-family extended-grammar adapter tests

on:
  push:
    paths:
      - '.github/workflows/ram14-proxy-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check adapter compatibility without loading any private model data
        run: |
          python -m unittest discover -s experiments/lean_ram14 -p 'test_*.py' -v
