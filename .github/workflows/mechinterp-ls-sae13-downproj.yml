name: LS-SAE13 isolated identical-input down-projection GEMM
# This path-isolated exploratory probe uses four hosted CPU allocations to
# sample backend variability, with no local GPU or model training.
on:
  push:
    branches: [research/mechinterp-ls-sae13-numerical-stability-20261118]
    paths:
      - '.github/workflows/mechinterp-ls-sae13-downproj.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
  HF_HUB_DOWNLOAD_TIMEOUT: '180'
  HF_HUB_ETAG_TIMEOUT: '60'
  PYTHONUNBUFFERED: '1'
jobs:
  isolate-gemm:
    strategy:
      fail-fast: false
      matrix:
        replicate: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matched CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Isolate first real ACT5 down-projection and compare B1/B2 float32 GEMMs
        run: |
          python -m compileall -q mechinterp/sae_causal_transfer/ls_sae13_analysis
          python -m mechinterp.sae_causal_transfer.ls_sae13_analysis.isolate_downproj \
            --source mechinterp/sae_causal_transfer/results/ls_sae12/source_48.json \
            --out runs/ls_sae13/downproj-${{ matrix.replicate }}.json \
            --fixture runs/ls_sae13/downproj-${{ matrix.replicate }}.npz
      - name: Independent receipt fixture digest and shape audit
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, numpy as np
          base=pathlib.Path('runs/ls_sae13')
          r=list(base.glob('downproj-*.json'))
          n=list(base.glob('downproj-*.npz'))
          assert len(r)==len(n)==1
          d=json.loads(r[0].read_text())
          assert d['schema']=='LS-SAE13/down-projection-isolated-B1-B2-v1'
          assert len(d['records'])==2
          assert d['positions']==[23,40]
          assert hashlib.sha256(n[0].read_bytes()).hexdigest()==d['npz_sha256']
          with np.load(n[0],allow_pickle=False) as arrays:
              for pos, row in zip([23,40],d['records']):
                  assert row['position']==pos
                  assert row['source_input_byte_identical_first_row']
                  assert len(row['replays'])==4
                  x=arrays[f'position{pos}_input']
                  w=arrays[f'position{pos}_weight']
                  assert x.shape==(97,1536) and w.shape==(512,1536)
                  assert hashlib.sha256(x.astype('<f4').tobytes()).hexdigest()==row['input_sha256']
                  assert hashlib.sha256(w.astype('<f4').tobytes()).hexdigest()==row['weights_sha256']
          print('LS_SAE13_ISOLATED_GEMM_AUDIT_PASS',hashlib.sha256(r[0].read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae13-downproj-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replicate }}
          path: runs/ls_sae13/downproj-${{ matrix.replicate }}.*
          retention-days: 90
          if-no-files-found: warn
