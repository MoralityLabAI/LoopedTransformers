name: SPC-08 current phase vs deferred-output CPU checks
on:
  push:
    paths:
      - 'experiments/spectral_state_cost_v0/spc08_*.py'
      - 'experiments/spectral_state_cost_v0/SPC-08.md'
      - 'tests/test_spc08_phase_readout.py'
      - '.github/workflows/spc08-phase-readout.yml'
  pull_request:
    paths:
      - 'experiments/spectral_state_cost_v0/spc08_*.py'
      - 'experiments/spectral_state_cost_v0/SPC-08.md'
      - 'tests/test_spc08_phase_readout.py'
      - '.github/workflows/spc08-phase-readout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-boundary-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run synthetic and checkpoint-hash validation tests
        run: python -m unittest discover -s tests -p 'test_spc08_phase_readout.py' -v
