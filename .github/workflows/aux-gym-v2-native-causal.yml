name: AUX-GYM V2 native causal and TRM engineering
on:
  pull_request:
    paths:
      - 'research_gym/interp/aux_gym_v2_native_causal.py'
      - 'research_gym/interp/aux_gym_v2_trm.py'
      - 'experiments/recurrence_monitorability_v0/aux_gym_v2_20261126/test_aux_gym_v2_native_causal.py'
      - '.github/workflows/aux-gym-v2-native-causal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/BPD
          ref: 722613a80d80af0e80bb9f5ac1ce83eef111e4f7
          path: .native-bpd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy
      - run: python -m unittest discover -s experiments/recurrence_monitorability_v0/aux_gym_v2_20261126 -p 'test_*.py'
      - name: Build engineering pairs and fit teacher
        run: |
          python -m research_gym.interp.aux_gym_v2 build --out /tmp/aux-causal/data --seed 2026112696 --train-quota 4 --eval-quota 2
          python -m research_gym.interp.aux_gym_v2_memory pairs --data /tmp/aux-causal/data --out /tmp/aux-causal/pairs --quota 1
          python -m research_gym.interp.aux_gym_v2 pilot --data /tmp/aux-causal/data --out /tmp/aux-causal/teacher --family modular_recurrence --arm LOOP-T --mode symbolic_trace --seed 1 --steps 8 --batch 8 --threads 2
          python -m research_gym.interp.aux_gym_v2_native_bpd --bpd-checkout .native-bpd --data /tmp/aux-causal/data --run /tmp/aux-causal/teacher --out /tmp/aux-causal/factors --seed 1 --components 8 --steps 2 --warmup 1 --batch 2 --smoke-no-null
      - name: Native API swap and matched dose replay
        run: python -m research_gym.interp.aux_gym_v2_native_causal --bpd-checkout .native-bpd --run /tmp/aux-causal/teacher --factors /tmp/aux-causal/factors --pairs /tmp/aux-causal/pairs --split validation --out /tmp/aux-causal/intervention --rank 4
      - name: Native attention TRM token adapter
        run: python -m research_gym.interp.aux_gym_v2_trm --data /tmp/aux-causal/data --out /tmp/aux-causal/trm --family modular_recurrence --mode symbolic_trace --seed 1 --steps 8 --batch 8 --commits 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aux-v2-native-causal-smoke
          path: /tmp/aux-causal
          if-no-files-found: warn
