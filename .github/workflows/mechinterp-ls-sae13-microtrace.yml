name: LS-SAE13 ACT5 B1/B2 first-divergence microtrace
# Single-ACT exploratory follow-up. Isolated path filter avoids rerunning
# the four-board Linux and Windows pilots.
on:
  push:
    branches: [research/mechinterp-ls-sae13-numerical-stability-20261118]
    paths:
      - '.github/workflows/mechinterp-ls-sae13-microtrace.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
  HF_HUB_DOWNLOAD_TIMEOUT: '180'
  HF_HUB_ETAG_TIMEOUT: '60'
  PYTHONUNBUFFERED: '1'
jobs:
  trace-first-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 huggingface_hub==0.36.0
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Trace projection inputs and outputs in first ACT5 on known positions 23 and 40
        run: |
          python -m compileall -q mechinterp/sae_causal_transfer/ls_sae13_analysis
          python -m mechinterp.sae_causal_transfer.ls_sae13_analysis.trace_act5 \
            --source mechinterp/sae_causal_transfer/results/ls_sae12/source_48.json \
            --out runs/ls_sae13/act5-first-projection.json
      - name: Independent trace receipt consistency
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('runs/ls_sae13/act5-first-projection.json')
          x=json.loads(p.read_bytes())
          assert x['schema']=='LS-SAE13/ACT5-batch-1-vs-2-microtrace-v1'
          assert x['positions']==[23,40]
          for r in x['boards']:
              assert r['projection_call_count']==168
              assert len(r['projection_digest_pairs'])==168
              if r['first_mismatch_focus'] is not None:
                  assert r['first_mismatch_focus']['index']==min(
                      i for i,(a,b) in enumerate(zip(
                          r['projection_digest_pairs'],r['projection_digest_pairs']))
                      if a['B1_in']!=b['B2_in'] or a['B1_out']!=b['B2_out'])
          print('LS_SAE13_MICROTRACE_AUDIT_PASS',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls-sae13-act5-projection-microtrace
          path: runs/ls_sae13/act5-first-projection.json
          retention-days: 90
          if-no-files-found: warn
