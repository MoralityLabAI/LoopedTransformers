name: KITE exact receipts and native replay
on:
  pull_request:
    paths:
      - 'research_gym/benchmarks/kite01/**'
      - '.github/workflows/kite-native-replay.yml'
  push:
    branches:
      - 'research/kite01-regret-gym-20261126'
    paths:
      - 'research_gym/benchmarks/kite01/**'
      - '.github/workflows/kite-native-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research_gym/benchmarks/kite01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay frozen arithmetic and profiles
        run: node native_replay.mjs
      - name: Independent unilateral-deviation audits
        run: |
          node audit02.mjs > /tmp/kite02_audit.json
          node audit03.mjs > /tmp/kite03_audit.json
          node --input-type=module -e "import assert from 'node:assert/strict'; import fs from 'node:fs'; for(const [a,b] of [['/tmp/kite02_audit.json','router02_audit.json'],['/tmp/kite03_audit.json','kite03_audit.json']]) assert.deepEqual(JSON.parse(fs.readFileSync(a)),JSON.parse(fs.readFileSync(b)));"
