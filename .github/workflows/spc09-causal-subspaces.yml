name: SPC-09 bounded native replay and causal subspace checks
on:
  push:
    paths: ['experiments/spectral_state_cost_v0/spc09_*.py', 'experiments/spectral_state_cost_v0/configs/spc09_*.json', 'tests/test_spc09.py', '.github/workflows/spc09-causal-subspaces.yml']
  pull_request:
    paths: ['experiments/spectral_state_cost_v0/spc09_*.py', 'experiments/spectral_state_cost_v0/configs/spc09_*.json', 'tests/test_spc09.py', '.github/workflows/spc09-causal-subspaces.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-native-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p 'test_spc09.py' -v
      - run: python -m unittest discover -s tests -p 'test_spc0[4-8]*.py' -v
