name: Dark Fibers local gyms CPU smoke

on:
  pull_request:
    paths:
      - "mechinterp/dark_fiber_gyms/**"
      - ".github/workflows/dark-fiber-local-gyms.yml"
  push:
    branches:
      - "research/causal-dark-fibers-arg03-20261115"
    paths:
      - "mechinterp/dark_fiber_gyms/**"
      - ".github/workflows/dark-fiber-local-gyms.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned CPU test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.3 pytest==8.4.2
      - name: Compile all gym sources
        run: python -m compileall -q mechinterp/dark_fiber_gyms
      - name: Checkpoint-free toy regressions
        run: python -m pytest -q mechinterp/dark_fiber_gyms/tests
