name: RAM-07 rebuild two frozen original TacticFibers complete Lean proof policies

on:
  push:
    paths:
      - '.github/workflows/lean-ram07-witness-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independently-rebuild-mathcan-witnesses:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/_ram07_gym
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact original MathCan source
        uses: actions/checkout@v4
        with:
          repository: patrickdugan/MathCan
          ref: fca46bfb3430ac85ffca16f6a6a83bb0b0231e41
          path: _mathcan
          persist-credentials: false
      - name: Checkout exact original FC12 theorem-source renderer
        uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/Compactification-Theory
          ref: e8a780254b5cf41d479095f4f22bcfc4aa76ed72
          path: _ram07_gym
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original Lean4.35
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o /tmp/lean435.tar.zst
          tar --zstd -xf /tmp/lean435.tar.zst -C /tmp
          echo /tmp/lean-4.35.0-linux/bin >> "$GITHUB_PATH"
      - name: Build source proof dependency graph without modifying original theorem code
        run: |
          test "$(git -C _mathcan rev-parse HEAD)" = fca46bfb3430ac85ffca16f6a6a83bb0b0231e41
          (cd _mathcan && lake build MathCan)
          echo "LEAN_PATH=$(cd _mathcan && lake env printenv LEAN_PATH)" >> "$GITHUB_ENV"
      - name: Reconstruct complete frequency and loop64 TacticFibers proofs from original source
        run: |
          python experiments/lean_ram07/replay_witnesses.py \
            --mathcan _mathcan --lean lean \
            --out "$RUNNER_TEMP/ram07_witnesses"
      - name: Confirm source hash and full sorry-free axiom-gated theorem count
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          file=Path(os.environ['RUNNER_TEMP'])/'ram07_witnesses/witness_rebuild_receipt.json'
          r=json.loads(file.read_text(encoding='utf8'))
          assert r['complete_source_policy_instances']==2 and r['independent_theorems']==1
          assert r['false_positive_certificates']==0
          assert all(x['compiled'] and x['valid_axiom_gate']
                     for x in r['policy_results'])
          assert set(x['policy'] for x in r['policy_results'])=={'frequency','loop64'}
          print('RAM07_TWO_FROZEN_SOURCE_PROOFS_REPRODUCED',r['policy_results'])
          PY
      - name: Preserve complete exact Lean proof source and compiler messages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ram07-rebuilt-native-miss-witnesses-${{ github.run_id }}
          path: ${{ runner.temp }}/ram07_witnesses/
          retention-days: 30
          if-no-files-found: warn
