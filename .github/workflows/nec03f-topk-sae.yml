name: NEC-03F true-TopK SAE active-feature CPU pilot

on:
  push:
    branches: ['research/nec03f-topk-active-sae-20261121']
    paths:
      - '.github/workflows/nec03f-topk-sae.yml'
      - 'mechinterp/neuron_communities/topk_sae.py'
      - 'mechinterp/neuron_communities/nec03f_active.py'
      - 'mechinterp/neuron_communities/audit_nec03f.py'
      - 'mechinterp/neuron_communities/test_nec03f.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nec03f-source-topk-20261121
  cancel-in-progress: true

jobs:
  cpu-frozen-topk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      DNNL_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only locked test dependencies
        run: |
          python -m pip install pytest==8.4.2 networkx==3.4.2 numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore original six frozen checkpoint and 20-community archive
        uses: actions/download-artifact@v4
        with:
          name: nec02b-six-model-raw-causal-and-crossseed-receipts
          run-id: 44790504320
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: MoralityLabAI/LoopedTransformers
          path: /tmp/nec03f
      - name: Source-manifest and checkpoint integrity gate
        run: |
          python -m mechinterp.neuron_communities.audit_crossseed --root /tmp/nec03f
      - name: Test TopK source-only fitting, label-blind source ranking and physical intervention
        run: |
          python -m pytest -q mechinterp/neuron_communities/test_nec03f.py
      - name: Fit TopK16 SAEs and source-only input-conditioned feature policies
        timeout-minutes: 13
        run: |
          for task in coalition threshold; do
            python -m mechinterp.neuron_communities.nec03f_active prepare \
              --root /tmp/nec03f --out "/tmp/nec03f/nec03f/seed103_$task" \
              --seed 103 --task "$task"
          done
      - name: Require both TopK dictionaries sealed before causal scoring
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          for task in ('coalition','threshold'):
              base=Path('/tmp/nec03f/nec03f')/f'seed103_{task}'
              raw=(base/'prepare.json').read_bytes()
              assert hashlib.sha256(raw).hexdigest()==(base/'prepare.sha256').read_text().strip()
              data=json.loads(raw)
              assert data['train_only_contexts']=={'fit':80,'rank':80,'heldout':0}
              assert data['topk_training']['target_active_features_per_input']==16
              assert data['topk_training']['heldout_contexts_seen']==0
              assert data['routing_policy']['teacher_labels_visible_to_selector'] is False
              assert data['FSI_01_gate']=='REDESIGN_OR_PILOT_ONLY'
              checkpoint=base/data['topk_checkpoint_file']
              assert hashlib.sha256(checkpoint.read_bytes()).hexdigest()==data['topk_checkpoint_sha256']
              print('NEC03F_SOURCE_TOPK_FROZEN',task,data['topk_training']['train_normalized_reconstruction_mse'])
          PY
      - name: Retrospective native-vs-TopK and TopK-vs-alternate matched-dose replay
        timeout-minutes: 14
        run: |
          for task in coalition threshold; do
            python -m mechinterp.neuron_communities.nec03f_active evaluate \
              --root /tmp/nec03f --out "/tmp/nec03f/nec03f/seed103_$task" \
              --seed 103 --task "$task"
          done
      - name: Independent raw TopK routing, labels and physical-dose audit
        run: |
          python -m mechinterp.neuron_communities.audit_nec03f \
            --root /tmp/nec03f --seed 103 --tasks coalition threshold
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/nec03f/nec03f_audit.json').read_text())
          assert len(report['arms'])==2
          assert report['FSI_01_gate']=='REDESIGN_OR_PILOT_ONLY'
          assert report['no_prospective_significance_inferred']
          assert report['total_candidate_pair_context_records']==48*3*sum(x['candidate_count'] for x in report['arms'])
          print('NEC03F_TOPK_SOURCE_AND_DOSE_AUDITED',report['total_signal_feasible_pairs'])
          PY
      - name: Upload TopK16 weights, source policies and all raw paired context effects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nec03f-topk16-active-source-matched-causal
          path: |
            /tmp/nec03f/nec03f/
            /tmp/nec03f/nec03f_audit.json
          retention-days: 30
          if-no-files-found: warn
