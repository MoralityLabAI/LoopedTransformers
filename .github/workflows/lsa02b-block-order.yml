name: LSA-02B PPT block-order source gate
on:
  pull_request:
    paths:
      - 'research/lean_cgrt_hrm400/ppt_gym/core.py'
      - 'research/lean_cgrt_hrm400/ppt_gym/cli.py'
      - 'research/lean_cgrt_hrm400/ppt_gym/order_probe.py'
      - 'research/lean_cgrt_hrm400/ppt_gym/tests/test_lsa02b_order.py'
      - 'docs/lsa02b_block_order_protocol.md'
      - '.github/workflows/lsa02b-block-order.yml'
  push:
    branches:
      - 'research/lsa02b-block-order-20261123'
    paths:
      - 'research/lean_cgrt_hrm400/ppt_gym/**'
      - '.github/workflows/lsa02b-block-order.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-order-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify default dispatch, mirrored order and source custody
        working-directory: research/lean_cgrt_hrm400
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m compileall -q ppt_gym/core.py ppt_gym/cli.py ppt_gym/order_probe.py
          python -m unittest ppt_gym.tests.test_lsa02b_order -v
