name: PEF-07 prospective twelve-bit coalition transfer

on:
  pull_request:
    paths:
      - 'research/pef07/**'
      - '.github/workflows/pef07-prospective-coalitions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  six-model-prospective-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      DNNL_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU neural and test stack
        run: |
          python -m pip install pytest
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify context split, teacher interventions and checkpoint integrity
        run: python -m pytest research/pef07/test_pef07.py -q
      - name: Train and seal six models before evaluating unseen 12-bit histories
        run: python -m research.pef07.pef07 --out /tmp/pef07_results
      - name: Fail-closed audit of the preregistered source and checkpoint receipts
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/pef07_results')
          result=json.loads((root/'summary.json').read_text())
          ledger=json.loads((root/'sealed_training_ledger.json').read_text())
          manifest=json.loads((root/'source_split.json').read_text())
          assert result['full_registered_run']
          assert result['seed_order']==[103,131,167]
          assert result['task_order']==['coalition','threshold']
          assert result['steps']==450
          assert result['primary_decision'] in {'criterion_met','criterion_not_met'}
          assert result['diagnostic_decision'] in {'criterion_met','criterion_not_met'}
          assert result['heldout_history_count']==768
          assert result['source_sha256']==manifest['sha256']==ledger['source_sha256']
          assert manifest['history_count_by_split']=={'train':2560,'probe':768,'heldout':768}
          assert ledger['all_six_trunks_sealed_before_scoring']
          assert ledger['onednn_max_cpu_isa']=='AVX2'
          assert len(ledger['checkpoints'])==len(result['models'])==6
          for rec in ledger['checkpoints']:
              path=root/rec['file']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==rec['checkpoint_sha256']
              assert rec['steps']==450 and rec['source_sha256']==manifest['sha256']
              row=next(m for m in result['models'] if
                       m['seed']==rec['seed'] and m['task']==rec['task'])
              assert row['all_original_weights_frozen_before_probe']
              assert row['checkpoint_sha256']==rec['checkpoint_sha256']
              assert row['trained_h12_native_head']['total']==768
              assert row['frozen_h14_downstream_ridge']['total']==768
              assert row['random_h14_downstream_ridge']['total']==768
              assert len(row['focal_pair_effects']['pairs'])==6
              teacher={tuple(p['pair']):p['teacher_pair_only']
                       for p in row['focal_pair_effects']['pairs']}
              intended={(0,1),(2,3)}
              for key,value in teacher.items():
                  assert value==(48 if
                      rec['task']=='threshold' or key in intended else 0)
              c=row['focal_pair_effects']
              assert c['native_pair_only_events']==(
                  c['surrogate_compatible_events']+c['surrogate_mismatch_events'])
          print('PEF07_REGISTERED_DECISION',result['primary_decision'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pef07-six-seed-12bit-context-closed-coalition-transfer
          path: /tmp/pef07_results/
          if-no-files-found: warn
