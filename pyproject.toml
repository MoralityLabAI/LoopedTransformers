[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ldt-trm-research-gym"
version = "0.0.1"
description = "Starter auto-research gym for hybrid LDT/TRM typed-soundness experiments."
requires-python = ">=3.10"
# Runtime imports of research_gym/ and lsa/: torch (44 modules), numpy (12), scipy
# (research_gym/interp/arrival.py). matplotlib is imported only by experiments/,
# but every analysis script there needs it, so it is declared here too.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Kept for callers of `pip install -e ".[neural]"` (docs/neural_hybrid.md); torch is
# now a core dependency, so this extra adds nothing.
neural = ["torch>=2.1"]
# tests/test_rmp_association.py imports sklearn.
test = ["pytest>=7", "scikit-learn>=1.3"]
# Extra packages imported by the standalone suites under experiments/.
experiments = ["pandas>=2.0", "safetensors>=0.4", "transformers>=4.40", "tokenizers>=0.19"]

[tool.setuptools]
packages = ["research_gym", "lsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
