name = "lgym"
defaultTargets = ["lgym"]

[[lean_exe]]
name = "lgym"
root = "Main"
supportInterpreter = true

[[lean_lib]]
name = "Trace"

# Same server, separate binary: lgym.exe stays locked while evaluation jobs run.
[[lean_exe]]
name = "lgym_trace"
root = "Main"
supportInterpreter = true

# Third copy for certified select runs (mathlib_eval) while a bulk trace holds lgym_trace.exe.
[[lean_exe]]
name = "lgym_cert"
root = "Main"
supportInterpreter = true
